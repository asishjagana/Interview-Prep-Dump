<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="fobg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="foarG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6ee7b7"/></marker>
    <marker id="foarB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#93c5fd"/></marker>
    <marker id="foarV" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#c4b5fd"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .cap{fill:#e2e8f0;font-size:11px}
      .lbl{fill:#f8fafc;font-size:12px;font-weight:700}
      .node{fill:#0b1220;stroke-width:2}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="760" height="560" rx="16" fill="url(#fobg)"/>
  <text x="30" y="40" class="t">Fan-out on Write vs Read (push vs pull feed)</text>
  <text x="30" y="62" class="sub">where do you pay — precompute every feed on POST (push), or assemble the feed on OPEN (pull)?</text>

  <!-- ============ LEFT: FAN-OUT ON WRITE (PUSH) ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="80" width="352" height="266" rx="10" fill="#0b1220" stroke="#16a34a" stroke-width="2.5"/>
    <text x="202" y="104" text-anchor="middle" class="hd" fill="#6ee7b7">A. FAN-OUT ON WRITE (PUSH)</text>
    <text x="202" y="120" text-anchor="middle" class="cap" font-size="10">precompute each follower's feed on POST</text>

    <!-- poster -->
    <rect x="44" y="136" width="86" height="40" rx="8" class="node" stroke="#16a34a"/>
    <text x="87" y="153" text-anchor="middle" class="lbl" font-size="11">User POSTS</text>
    <text x="87" y="168" text-anchor="middle" class="cap" font-size="9">1 write</text>
    <!-- worker -->
    <rect x="150" y="136" width="94" height="40" rx="8" class="node" stroke="#16a34a"/>
    <text x="197" y="153" text-anchor="middle" class="lbl" font-size="11">Fan-out</text>
    <text x="197" y="168" text-anchor="middle" class="cap" font-size="9">worker</text>
    <line x1="130" y1="156" x2="148" y2="156" stroke="#6ee7b7" stroke-width="2" marker-end="url(#foarG)"/>

    <!-- follower feed caches -->
    <rect x="278" y="132" width="86" height="24" rx="5" class="node" stroke="#334155"/>
    <text x="321" y="148" text-anchor="middle" class="cap" font-size="9">follower feed 1</text>
    <rect x="278" y="162" width="86" height="24" rx="5" class="node" stroke="#334155"/>
    <text x="321" y="178" text-anchor="middle" class="cap" font-size="9">follower feed 2</text>
    <rect x="278" y="192" width="86" height="24" rx="5" class="node" stroke="#334155"/>
    <text x="321" y="208" text-anchor="middle" class="cap" font-size="9">follower feed 3</text>
    <rect x="278" y="222" width="86" height="24" rx="5" class="node" stroke="#334155"/>
    <text x="321" y="238" text-anchor="middle" class="cap" font-size="9">... follower N</text>
    <!-- write arrows -->
    <line x1="244" y1="150" x2="276" y2="144" stroke="#6ee7b7" stroke-width="1.8" marker-end="url(#foarG)"/>
    <line x1="244" y1="154" x2="276" y2="174" stroke="#6ee7b7" stroke-width="1.8" marker-end="url(#foarG)"/>
    <line x1="244" y1="158" x2="276" y2="204" stroke="#6ee7b7" stroke-width="1.8" marker-end="url(#foarG)"/>
    <line x1="244" y1="162" x2="276" y2="234" stroke="#6ee7b7" stroke-width="1.8" marker-end="url(#foarG)"/>

    <text x="44" y="270" class="cap" fill="#6ee7b7">✓ reads are INSTANT (feed precomputed)</text>
    <text x="44" y="290" class="cap" fill="#fca5a5">✗ writes are expensive — write amplification</text>
    <text x="44" y="310" class="cap" fill="#fca5a5">✗ celebrity 100M followers = 100M writes/post</text>
    <text x="44" y="330" class="cap" fill="#fbbf24">~ wasted writes to inactive followers</text>
  </g>

  <!-- ============ RIGHT: FAN-OUT ON READ (PULL) ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.5s" fill="freeze"/>
    <rect x="382" y="80" width="352" height="266" rx="10" fill="#0b1220" stroke="#2563eb" stroke-width="2.5"/>
    <text x="558" y="104" text-anchor="middle" class="hd" fill="#93c5fd">B. FAN-OUT ON READ (PULL)</text>
    <text x="558" y="120" text-anchor="middle" class="cap" font-size="10">assemble the feed on OPEN, at read time</text>

    <!-- reader -->
    <rect x="400" y="136" width="94" height="40" rx="8" class="node" stroke="#2563eb"/>
    <text x="447" y="153" text-anchor="middle" class="lbl" font-size="11">User OPENS</text>
    <text x="447" y="168" text-anchor="middle" class="cap" font-size="9">feed</text>

    <!-- authors followed -->
    <rect x="648" y="132" width="70" height="24" rx="5" class="node" stroke="#334155"/>
    <text x="683" y="148" text-anchor="middle" class="cap" font-size="9">author A</text>
    <rect x="648" y="162" width="70" height="24" rx="5" class="node" stroke="#334155"/>
    <text x="683" y="178" text-anchor="middle" class="cap" font-size="9">author B</text>
    <rect x="648" y="192" width="70" height="24" rx="5" class="node" stroke="#334155"/>
    <text x="683" y="208" text-anchor="middle" class="cap" font-size="9">author C</text>
    <!-- merge box -->
    <rect x="516" y="150" width="104" height="46" rx="8" class="node" stroke="#2563eb"/>
    <text x="568" y="170" text-anchor="middle" class="lbl" font-size="11">query + MERGE</text>
    <text x="568" y="185" text-anchor="middle" class="cap" font-size="9">recent posts, by time</text>
    <!-- read arrows (pull) -->
    <line x1="494" y1="158" x2="514" y2="170" stroke="#93c5fd" stroke-width="2" marker-end="url(#foarB)"/>
    <line x1="646" y1="144" x2="622" y2="164" stroke="#93c5fd" stroke-width="1.8" marker-end="url(#foarB)"/>
    <line x1="646" y1="174" x2="622" y2="176" stroke="#93c5fd" stroke-width="1.8" marker-end="url(#foarB)"/>
    <line x1="646" y1="204" x2="622" y2="188" stroke="#93c5fd" stroke-width="1.8" marker-end="url(#foarB)"/>

    <text x="400" y="270" class="cap" fill="#6ee7b7">✓ writes are CHEAP — one row per post</text>
    <text x="400" y="290" class="cap" fill="#6ee7b7">✓ no wasted work for inactive users</text>
    <text x="400" y="310" class="cap" fill="#fca5a5">✗ reads are expensive — merge N authors</text>
    <text x="400" y="330" class="cap" fill="#fca5a5">✗ slow if you follow thousands of people</text>
  </g>

  <!-- ============ HYBRID STRIP ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="356" width="708" height="112" rx="10" fill="#0b1220" stroke="#7c3aed" stroke-width="2"/>
    <text x="44" y="380" class="hd" fill="#c4b5fd">C. HYBRID — what Twitter / Instagram actually do</text>

    <rect x="44" y="394" width="150" height="56" rx="8" class="node" stroke="#16a34a"/>
    <text x="119" y="414" text-anchor="middle" class="cap" fill="#6ee7b7" font-size="10">normal authors (~200 flwrs)</text>
    <text x="119" y="430" text-anchor="middle" class="lbl" font-size="11">PUSH on write</text>
    <text x="119" y="444" text-anchor="middle" class="cap" font-size="9">precomputed feed in Redis</text>

    <rect x="214" y="394" width="150" height="56" rx="8" class="node" stroke="#2563eb"/>
    <text x="289" y="414" text-anchor="middle" class="cap" fill="#93c5fd" font-size="10">CELEBRITIES (100M flwrs)</text>
    <text x="289" y="430" text-anchor="middle" class="lbl" font-size="11">PULL on read</text>
    <text x="289" y="444" text-anchor="middle" class="cap" font-size="9">no fan-out explosion</text>

    <rect x="470" y="392" width="244" height="60" rx="8" class="node" stroke="#7c3aed"/>
    <text x="592" y="414" text-anchor="middle" class="lbl" fill="#c4b5fd" font-size="11">READ-TIME MERGE</text>
    <text x="592" y="431" text-anchor="middle" class="cap" font-size="10">precomputed feed  +  pull celebrities</text>
    <text x="592" y="446" text-anchor="middle" class="cap" font-size="9">merge &amp; rank → the timeline you see</text>
    <line x1="364" y1="422" x2="468" y2="422" stroke="#c4b5fd" stroke-width="2" marker-end="url(#foarV)"/>
    <line x1="194" y1="422" x2="212" y2="422" stroke="#c4b5fd" stroke-width="1.6" marker-end="url(#foarV)"/>
  </g>

  <!-- ============ BOTTOM CALLOUT ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="480" width="708" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="380" y="504" text-anchor="middle" class="hd">Push (write) = fast reads, costly writes (celebrity fan-out explosion)</text>
    <text x="380" y="524" text-anchor="middle" class="hd">Pull (read) = cheap writes, costly reads</text>
    <text x="380" y="539" text-anchor="middle" class="cap" fill="#5b21b6" font-size="10">Real systems (Twitter / Instagram) go HYBRID: push the long tail, pull celebrities, merge at read time</text>
  </g>
</svg>
