<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 790" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="kop_bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="kop_arrowG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6ee7b7"/></marker>
    <marker id="kop_arrowR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#fca5a5"/></marker>
    <marker id="kop_arrowB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#93c5fd"/></marker>
    <marker id="kop_arrowA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#fbbf24"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .cap{fill:#e2e8f0;font-size:11px}
      .lbl{fill:#f8fafc;font-size:12px;font-weight:700}
      .mono{font-family:'Consolas','Courier New',monospace;font-size:10px;fill:#e2e8f0}
      .node{fill:#0b1220;stroke-width:2}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="780" height="790" rx="16" fill="url(#kop_bg)"/>
  <text x="30" y="38" class="t">Kubernetes Operators &amp; CRDs</text>
  <text x="30" y="58" class="sub">a runbook compiled into a control loop · controllers are LEVEL-triggered — they re-derive state, they never replay events</text>

  <!-- ============ PANEL A: THE ANATOMY ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="72" width="728" height="196" rx="10" fill="#0b1220" stroke="#2563eb" stroke-width="2.5"/>
    <text x="44" y="94" class="hd" fill="#93c5fd">A. ANATOMY — the CRD defines the API, the object holds the state, the controller does the work</text>

    <!-- CRD -->
    <rect x="42" y="104" width="204" height="150" rx="8" class="node" stroke="#7c3aed"/>
    <text x="144" y="123" text-anchor="middle" class="lbl" fill="#c4b5fd" font-size="11">① CustomResourceDefinition</text>
    <text x="54" y="140" class="mono" font-size="9" fill="#c4b5fd">apiextensions.k8s.io/v1</text>
    <text x="54" y="155" class="cap" font-size="9">group / version / kind / plural</text>
    <text x="54" y="169" class="cap" font-size="9" fill="#fbbf24">structural OpenAPI v3 schema</text>
    <text x="54" y="181" class="cap" font-size="8.5">⇒ validation + defaults + kubectl explain</text>
    <text x="54" y="196" class="cap" font-size="9">subresources: <tspan class="mono" font-size="9" fill="#6ee7b7">/status</tspan> <tspan class="mono" font-size="9" fill="#6ee7b7">/scale</tspan></text>
    <text x="54" y="208" class="cap" font-size="8.5">/scale ⇒ kubectl scale + HPA work</text>
    <text x="54" y="223" class="cap" font-size="9">additionalPrinterColumns</text>
    <text x="54" y="237" class="cap" font-size="9">v1alpha1→v1: ONE storage version</text>
    <text x="54" y="248" class="cap" font-size="8.5" fill="#fbbf24">+ conversion webhook · CEL x-k8s-validations</text>

    <line x1="248" y1="180" x2="266" y2="180" stroke="#c4b5fd" stroke-width="2" marker-end="url(#kop_arrowB)"/>

    <!-- The custom resource -->
    <rect x="270" y="104" width="212" height="150" rx="8" class="node" stroke="#16a34a"/>
    <text x="376" y="123" text-anchor="middle" class="lbl" fill="#6ee7b7" font-size="11">② the custom resource</text>
    <rect x="282" y="130" width="188" height="34" rx="5" fill="#052e1a" stroke="#16a34a" stroke-width="1.5"/>
    <text x="290" y="144" class="mono" font-size="9" fill="#bbf7d0">spec: {replicas: 3, version: 16}</text>
    <text x="290" y="157" class="cap" font-size="8.5" fill="#6ee7b7">DESIRED · humans write this · generation++</text>
    <rect x="282" y="169" width="188" height="34" rx="5" fill="#0c2b3f" stroke="#2563eb" stroke-width="1.5"/>
    <text x="290" y="183" class="mono" font-size="9" fill="#bfdbfe">status: {ready: 3, observedGen: 7}</text>
    <text x="290" y="196" class="cap" font-size="8.5" fill="#93c5fd">OBSERVED · ONLY the controller writes this</text>
    <rect x="282" y="208" width="188" height="38" rx="5" class="node" stroke="#d97706" stroke-width="1.5"/>
    <text x="290" y="222" class="mono" font-size="9" fill="#fde68a">conditions[Ready/Progressing]</text>
    <text x="290" y="234" class="mono" font-size="9" fill="#fde68a">finalizers[] · ownerReferences[]</text>
    <text x="290" y="243" class="cap" font-size="8" fill="#fbbf24">pre-delete hook · cascading GC</text>

    <line x1="484" y1="172" x2="502" y2="172" stroke="#6ee7b7" stroke-width="2" marker-end="url(#kop_arrowG)"/>
    <line x1="502" y1="196" x2="484" y2="196" stroke="#93c5fd" stroke-width="2" marker-end="url(#kop_arrowB)"/>
    <text x="493" y="212" text-anchor="middle" class="cap" font-size="8" fill="#93c5fd">status</text>

    <!-- The controller -->
    <rect x="506" y="104" width="248" height="150" rx="8" fill="#052e1a" stroke="#16a34a" stroke-width="2.5"/>
    <text x="630" y="123" text-anchor="middle" class="lbl" fill="#6ee7b7" font-size="11">③ the controller (operator)</text>
    <rect x="518" y="130" width="106" height="30" rx="5" class="node" stroke="#2563eb" stroke-width="1.5"/>
    <text x="571" y="143" text-anchor="middle" class="cap" font-size="9" fill="#93c5fd">informer</text>
    <text x="571" y="154" text-anchor="middle" class="cap" font-size="8">watch + 10h resync</text>
    <rect x="632" y="130" width="110" height="30" rx="5" class="node" stroke="#2563eb" stroke-width="1.5"/>
    <text x="687" y="143" text-anchor="middle" class="cap" font-size="9" fill="#93c5fd">shared cache</text>
    <text x="687" y="154" text-anchor="middle" class="cap" font-size="8">lister — reads never hit API</text>
    <rect x="518" y="166" width="224" height="30" rx="5" class="node" stroke="#d97706" stroke-width="1.5"/>
    <text x="630" y="179" text-anchor="middle" class="cap" font-size="9" fill="#fbbf24">workqueue — DEDUPLICATES by ns/name</text>
    <text x="630" y="190" text-anchor="middle" class="cap" font-size="8">100 events on one object ⇒ 1 reconcile · rate-limited 5ms→1000s</text>
    <rect x="518" y="202" width="224" height="26" rx="5" fill="#0b1220" stroke="#16a34a" stroke-width="2"/>
    <text x="630" y="219" text-anchor="middle" class="mono" font-size="10" fill="#6ee7b7">Reconcile(ctx, req) — gets only ns/name</text>
    <text x="630" y="242" text-anchor="middle" class="cap" font-size="9">Owns()/Watches() map child→parent · leader election ⇒ 1 active replica</text>
    <text x="630" y="252" text-anchor="middle" class="cap" font-size="8" fill="#fbbf24">MaxConcurrentReconciles · resourceVersion conflict ⇒ re-read + retry, NEVER force</text>
  </g>

  <!-- ============ PANEL B: LEVEL-TRIGGERED SELF-HEALING ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="280" width="728" height="238" rx="10" fill="#0b1220" stroke="#d97706" stroke-width="2.5"/>
    <text x="44" y="302" class="hd" fill="#fbbf24">B. WHY IT SELF-HEALS — every wake-up re-derives the world from scratch (LEVEL), never from the event (EDGE)</text>

    <!-- the loop -->
    <rect x="42" y="314" width="96" height="34" rx="6" fill="#2e1065" stroke="#7c3aed" stroke-width="2"/>
    <text x="90" y="329" text-anchor="middle" class="cap" font-size="9" fill="#c4b5fd">watch / resync</text>
    <text x="90" y="341" text-anchor="middle" class="cap" font-size="8" fill="#c4b5fd">"something may differ"</text>
    <line x1="140" y1="331" x2="162" y2="331" stroke="#c4b5fd" stroke-width="2" marker-end="url(#kop_arrowB)"/>
    <rect x="164" y="314" width="84" height="34" rx="6" class="node" stroke="#d97706"/>
    <text x="206" y="329" text-anchor="middle" class="cap" font-size="9" fill="#fbbf24">workqueue</text>
    <text x="206" y="341" text-anchor="middle" class="cap" font-size="8" fill="#fbbf24">key = ns/name only</text>
    <line x1="250" y1="331" x2="272" y2="331" stroke="#fbbf24" stroke-width="2" marker-end="url(#kop_arrowA)"/>
    <rect x="274" y="308" width="196" height="46" rx="6" fill="#052e1a" stroke="#16a34a" stroke-width="2.5"/>
    <text x="372" y="324" text-anchor="middle" class="lbl" font-size="10" fill="#6ee7b7">OBSERVE → DIFF → ACT</text>
    <text x="372" y="336" text-anchor="middle" class="cap" font-size="8.5" fill="#bbf7d0">LIST the real children, compare to spec,</text>
    <text x="372" y="347" text-anchor="middle" class="cap" font-size="8.5" fill="#bbf7d0">take ONE convergent step (create-or-update-if-different)</text>
    <line x1="472" y1="331" x2="494" y2="331" stroke="#6ee7b7" stroke-width="2" marker-end="url(#kop_arrowG)"/>
    <rect x="496" y="314" width="102" height="34" rx="6" class="node" stroke="#2563eb"/>
    <text x="547" y="328" text-anchor="middle" class="cap" font-size="9" fill="#93c5fd">write /status</text>
    <text x="547" y="340" text-anchor="middle" class="cap" font-size="8" fill="#93c5fd">only IF it changed</text>
    <line x1="600" y1="331" x2="622" y2="331" stroke="#93c5fd" stroke-width="2" marker-end="url(#kop_arrowB)"/>
    <rect x="624" y="308" width="126" height="46" rx="6" class="node" stroke="#d97706"/>
    <text x="687" y="322" text-anchor="middle" class="cap" font-size="9" fill="#fbbf24">return</text>
    <text x="687" y="333" text-anchor="middle" class="mono" font-size="8">nil · err (backoff) ·</text>
    <text x="687" y="344" class="mono" font-size="8" text-anchor="middle">RequeueAfter: 30s</text>
    <!-- requeue arc back to workqueue -->
    <path d="M687,356 L687,368 L206,368 L206,352" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#kop_arrowA)"/>
    <text x="446" y="365" text-anchor="middle" class="cap" font-size="8" fill="#fbbf24">requeue / exponential backoff — the SAME key, so it collapses into one reconcile</text>
    <!-- travelling dot -->
    <circle r="4" fill="#6ee7b7"><animateMotion dur="4s" repeatCount="indefinite" path="M90,331 L206,331 L372,331 L547,331 L687,331 L687,368 L206,368 L206,331"/></circle>

    <!-- the four self-healing scenarios -->
    <text x="44" y="392" class="cap" font-size="10" font-weight="700" fill="#fbbf24">Four things that would break an EDGE-triggered system — and heal themselves here:</text>

    <rect x="42" y="400" width="172" height="52" rx="6" class="node" stroke="#dc2626"/>
    <text x="128" y="415" text-anchor="middle" class="cap" font-size="9" fill="#fca5a5">① a watch event is DROPPED</text>
    <text x="128" y="428" text-anchor="middle" class="cap" font-size="8">the 10h resync re-LISTs everything</text>
    <text x="128" y="440" text-anchor="middle" class="cap" font-size="9" fill="#6ee7b7">✓ converges at next pass</text>
    <text x="128" y="449" text-anchor="middle" class="cap" font-size="8" fill="#94a3b8">edge-triggered: lost forever</text>

    <rect x="222" y="400" width="172" height="52" rx="6" class="node" stroke="#dc2626"/>
    <text x="308" y="415" text-anchor="middle" class="cap" font-size="9" fill="#fca5a5">② operator pod is KILLED</text>
    <text x="308" y="428" text-anchor="middle" class="cap" font-size="8">new pod lists all objects at boot</text>
    <text x="308" y="440" text-anchor="middle" class="cap" font-size="9" fill="#6ee7b7">✓ no state to recover</text>
    <text x="308" y="449" text-anchor="middle" class="cap" font-size="8" fill="#94a3b8">edge: missed the whole window</text>

    <rect x="402" y="400" width="172" height="52" rx="6" class="node" stroke="#dc2626"/>
    <text x="488" y="415" text-anchor="middle" class="cap" font-size="9" fill="#fca5a5">③ someone deletes a child</text>
    <text x="488" y="428" text-anchor="middle" class="cap" font-size="8">Owns() fires; observed ≠ desired</text>
    <text x="488" y="440" text-anchor="middle" class="cap" font-size="9" fill="#6ee7b7">✓ recreated, no bookkeeping</text>
    <text x="488" y="449" text-anchor="middle" class="cap" font-size="8" fill="#94a3b8">edge: no "delete" it knows about</text>

    <rect x="582" y="400" width="168" height="52" rx="6" class="node" stroke="#dc2626"/>
    <text x="666" y="415" text-anchor="middle" class="cap" font-size="9" fill="#fca5a5">④ 200 events in 1 second</text>
    <text x="666" y="428" text-anchor="middle" class="cap" font-size="8">queue dedups by key → 1 reconcile</text>
    <text x="666" y="440" text-anchor="middle" class="cap" font-size="9" fill="#6ee7b7">✓ latest level is all that matters</text>
    <text x="666" y="449" text-anchor="middle" class="cap" font-size="8" fill="#94a3b8">edge: 200 handlers, ordering bugs</text>

    <rect x="42" y="460" width="350" height="48" rx="6" fill="#3a0f12" stroke="#dc2626" stroke-width="2"/>
    <text x="217" y="476" text-anchor="middle" class="cap" font-size="10" fill="#fca5a5" font-weight="700">EDGE-triggered (what people write by accident)</text>
    <text x="217" y="489" text-anchor="middle" class="cap" font-size="9" fill="#fecaca">"on ADD do X, on UPDATE diff old vs new, on DELETE undo X"</text>
    <text x="217" y="501" text-anchor="middle" class="cap" font-size="9" fill="#fecaca">⇒ one dropped event = permanent drift, forever</text>

    <rect x="402" y="460" width="348" height="48" rx="6" fill="#052e1a" stroke="#16a34a" stroke-width="2.5"/>
    <text x="576" y="476" text-anchor="middle" class="cap" font-size="10" fill="#6ee7b7" font-weight="700">LEVEL-triggered (what Kubernetes actually is)</text>
    <text x="576" y="489" text-anchor="middle" class="cap" font-size="9" fill="#bbf7d0">"whatever woke me, read the world and make it match spec"</text>
    <text x="576" y="501" text-anchor="middle" class="cap" font-size="9" fill="#bbf7d0">⇒ idempotent, restartable at any instant, eventually correct</text>
  </g>

  <!-- ============ PANEL C: HELM vs OPERATOR + MATURITY LADDER ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="530" width="728" height="240" rx="10" fill="#0b1220" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="44" y="552" class="hd" fill="#c4b5fd">C. DO I ACTUALLY NEED AN OPERATOR? — a chart INSTALLS; an operator OPERATES</text>

    <rect x="42" y="562" width="304" height="76" rx="7" fill="#0c2b3f" stroke="#2563eb" stroke-width="2"/>
    <text x="194" y="578" text-anchor="middle" class="cap" font-size="10" font-weight="700" fill="#93c5fd">HELM CHART + GitOps is enough when…</text>
    <text x="54" y="593" class="cap" font-size="9">the only ongoing lifecycle work is "apply new YAML"</text>
    <text x="54" y="606" class="cap" font-size="9">stateless app · config templating · install/uninstall</text>
    <text x="54" y="619" class="cap" font-size="9">Argo CD already gives you the reconcile loop, for free</text>
    <text x="54" y="632" class="cap" font-size="9" fill="#fbbf24">an unneeded operator = a permanent maintenance liability</text>

    <rect x="354" y="562" width="396" height="76" rx="7" fill="#052e1a" stroke="#16a34a" stroke-width="2.5"/>
    <text x="552" y="578" text-anchor="middle" class="cap" font-size="10" font-weight="700" fill="#6ee7b7">YOU NEED AN OPERATOR when there is real operational LOGIC</text>
    <text x="366" y="593" class="cap" font-size="9">leader failover + promotion for a stateful system (seconds, not a human)</text>
    <text x="366" y="606" class="cap" font-size="9">backup / restore / point-in-time recovery · certificate rotation</text>
    <text x="366" y="619" class="cap" font-size="9">ordered version upgrades with data migration · resharding / rebalancing</text>
    <text x="366" y="632" class="cap" font-size="9" fill="#fbbf24">test: could you write it as a runbook? then it can be a control loop</text>

    <text x="44" y="658" class="cap" font-size="10" font-weight="700" fill="#c4b5fd">THE OPERATOR MATURITY MODEL — most published operators stop at II or III</text>

    <rect x="42" y="666" width="150" height="22" rx="4" class="node" stroke="#475569"/>
    <text x="52" y="681" class="cap" font-size="9" fill="#cbd5e1">I · BASIC INSTALL</text>
    <text x="206" y="681" class="cap" font-size="9" fill="#94a3b8">provision + config — a Helm chart already does this</text>

    <rect x="42" y="690" width="196" height="22" rx="4" class="node" stroke="#2563eb"/>
    <text x="52" y="705" class="cap" font-size="9" fill="#93c5fd">II · SEAMLESS UPGRADES</text>
    <text x="252" y="705" class="cap" font-size="9" fill="#94a3b8">version + ordered rolling upgrade · <tspan fill="#e2e8f0">Strimzi (Kafka)</tspan></text>

    <rect x="42" y="714" width="242" height="22" rx="4" fill="#052e1a" stroke="#16a34a" stroke-width="2"/>
    <text x="52" y="729" class="cap" font-size="9" fill="#6ee7b7">III · FULL LIFECYCLE</text>
    <text x="298" y="729" class="cap" font-size="9" fill="#94a3b8">backup · PITR · failover · <tspan fill="#e2e8f0">CloudNativePG, cert-manager</tspan></text>

    <rect x="42" y="738" width="288" height="22" rx="4" class="node" stroke="#d97706"/>
    <text x="52" y="753" class="cap" font-size="9" fill="#fbbf24">IV · DEEP INSIGHTS</text>
    <text x="344" y="753" class="cap" font-size="9" fill="#94a3b8">metrics, alerts, workload analysis · <tspan fill="#e2e8f0">Prometheus Operator</tspan></text>

    <rect x="558" y="666" width="192" height="94" rx="6" fill="#2e1065" stroke="#7c3aed" stroke-width="2"/>
    <text x="654" y="682" text-anchor="middle" class="cap" font-size="10" font-weight="700" fill="#c4b5fd">V · AUTOPILOT</text>
    <text x="654" y="697" text-anchor="middle" class="cap" font-size="8.5" fill="#ddd6fe">auto-scaling · auto-tuning</text>
    <text x="654" y="709" text-anchor="middle" class="cap" font-size="8.5" fill="#ddd6fe">auto-remediation, no human</text>
    <text x="654" y="726" text-anchor="middle" class="cap" font-size="8.5" fill="#fbbf24">rare, and it is where the</text>
    <text x="654" y="737" text-anchor="middle" class="cap" font-size="8.5" fill="#fbbf24">operator becomes a SPOF for</text>
    <text x="654" y="748" text-anchor="middle" class="cap" font-size="8.5" fill="#fbbf24">your data-plane failover</text>
  </g>
</svg>
