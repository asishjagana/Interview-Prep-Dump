<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="soabg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <linearGradient id="bus" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .box{fill:#1e293b;stroke:#475569;stroke-width:1.5}
      .bl{fill:#e2e8f0;font-size:12px;font-weight:600}
      .note{fill:#94a3b8;font-size:11px}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="760" height="420" rx="16" fill="url(#soabg)"/>
  <text x="30" y="38" class="t">SOA — services plug into a central ESB</text>

  <!-- top services -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.5s" fill="freeze"/>
    <rect x="60" y="70" width="140" height="44" rx="8" class="box"/><text x="130" y="97" text-anchor="middle" class="bl">CRM (Java)</text>
    <rect x="230" y="70" width="160" height="44" rx="8" class="box"/><text x="310" y="97" text-anchor="middle" class="bl">Billing (Mainframe)</text>
    <rect x="420" y="70" width="150" height="44" rx="8" class="box"/><text x="495" y="97" text-anchor="middle" class="bl">Inventory (COBOL)</text>
    <rect x="600" y="70" width="110" height="44" rx="8" class="box"/><text x="655" y="97" text-anchor="middle" class="bl">Web Portal</text>
  </g>

  <!-- the bus -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.6s" fill="freeze"/>
    <rect x="50" y="180" width="660" height="50" rx="10" fill="url(#bus)"/>
    <text x="380" y="205" text-anchor="middle" fill="#0f172a" font-size="15" font-weight="700">Enterprise Service Bus (ESB)</text>
    <text x="380" y="222" text-anchor="middle" fill="#1e1b4b" font-size="11">routing · protocol translation (SOAP↔JSON) · security · orchestration</text>
  </g>

  <!-- connectors -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.5s" fill="freeze"/>
    <line x1="130" y1="114" x2="130" y2="180" stroke="#64748b" stroke-width="2"/>
    <line x1="310" y1="114" x2="310" y2="180" stroke="#64748b" stroke-width="2"/>
    <line x1="495" y1="114" x2="495" y2="180" stroke="#64748b" stroke-width="2"/>
    <line x1="655" y1="114" x2="655" y2="180" stroke="#64748b" stroke-width="2"/>
  </g>

  <!-- bottom consumers -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2s" dur="0.5s" fill="freeze"/>
    <line x1="230" y1="230" x2="230" y2="280" stroke="#64748b" stroke-width="2"/>
    <line x1="530" y1="230" x2="530" y2="280" stroke="#64748b" stroke-width="2"/>
    <rect x="160" y="280" width="140" height="40" rx="8" class="box"/><text x="230" y="305" text-anchor="middle" class="bl">"Process Claim"</text>
    <rect x="460" y="280" width="140" height="40" rx="8" class="box"/><text x="530" y="305" text-anchor="middle" class="bl">"Book Flight"</text>
    <text x="380" y="262" text-anchor="middle" class="note">coarse-grained business services, reused enterprise-wide</text>
  </g>

  <rect x="30" y="338" width="700" height="66" rx="10" fill="#0b1220" stroke="#334155" class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.6s" fill="freeze"/></rect>
  <text x="46" y="362" class="note" fill="#e2e8f0">SOA vs Microservices: SOA = coarse services + SMART pipe (ESB orchestration) + often shared DB.</text>
  <text x="46" y="382" class="note">Microservices = fine-grained + DUMB pipes + choreography + DB-per-service. ⚠ The ESB can become a God-service SPOF.</text>
</svg>
