<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="capbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .ax{fill:#94a3b8;font-size:13px}
      .lg{font-size:12px}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="720" height="420" rx="16" fill="url(#capbg)"/>
  <text x="30" y="40" class="t">Capacity (steps) vs Demand (smooth)</text>

  <!-- axes -->
  <line x1="70" y1="350" x2="670" y2="350" stroke="#475569" stroke-width="2"/>
  <line x1="70" y1="350" x2="70" y2="70" stroke="#475569" stroke-width="2"/>
  <text x="370" y="392" text-anchor="middle" class="ax">Time →</text>
  <text x="28" y="210" class="ax" transform="rotate(-90 28 210)">Load / Capacity →</text>

  <!-- capacity as a staircase (provisioned servers) -->
  <polyline points="70,300 200,300 200,250 360,250 360,180 520,180 520,110 670,110"
            fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="900" stroke-dashoffset="900">
    <animate attributeName="stroke-dashoffset" from="900" to="0" dur="2.5s" fill="freeze"/>
  </polyline>

  <!-- demand as smooth growing curve -->
  <path d="M70,330 C200,320 320,290 430,250 C540,210 600,170 670,140"
        fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="800" stroke-dashoffset="800">
    <animate attributeName="stroke-dashoffset" from="800" to="0" dur="2.5s" begin="0.4s" fill="freeze"/>
  </path>

  <!-- headroom gap arrows -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.6s" fill="freeze"/>
    <line x1="300" y1="250" x2="300" y2="297" stroke="#34d399" stroke-width="2"/>
    <text x="308" y="278" fill="#34d399" font-size="11">headroom ✅</text>
  </g>

  <!-- danger: demand crosses capacity -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="3s" dur="0.6s" fill="freeze"/>
    <circle cx="600" cy="152" r="7" fill="#f87171"/>
    <text x="560" y="135" fill="#f87171" font-size="11" font-weight="700">demand nears capacity →</text>
    <text x="560" y="150" fill="#f87171" font-size="11" font-weight="700">scale BEFORE this point</text>
  </g>

  <!-- legend -->
  <rect x="430" y="365" width="18" height="4" fill="#fbbf24"/><text x="454" y="372" class="lg" fill="#fbbf24">Capacity (servers added in blocks)</text>
  <rect x="430" y="382" width="18" height="4" fill="#22d3ee"/><text x="454" y="389" class="lg" fill="#22d3ee">Actual demand (grows smoothly)</text>
</svg>
