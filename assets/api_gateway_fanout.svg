<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="gwbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .box{fill:#1e293b;stroke:#475569;stroke-width:1.5}
      .bl{fill:#e2e8f0;font-size:12px;font-weight:600}
      .note{fill:#94a3b8;font-size:11px}
      .gw{fill:#0e7490;stroke:#22d3ee;stroke-width:2}
      .dot{fill:#fde68a}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="760" height="420" rx="16" fill="url(#gwbg)"/>
  <text x="30" y="38" class="t">API Gateway — one front door (North–South traffic)</text>

  <!-- client -->
  <rect x="40" y="170" width="90" height="50" rx="8" class="box"/><text x="85" y="200" text-anchor="middle" class="bl">Client</text>

  <!-- gateway -->
  <rect x="220" y="120" width="150" height="150" rx="12" class="gw"/>
  <text x="295" y="148" text-anchor="middle" class="bl" fill="#cffafe">API Gateway</text>
  <text x="234" y="172" class="note" fill="#a5f3fc">• routing</text>
  <text x="234" y="190" class="note" fill="#a5f3fc">• authN / authZ</text>
  <text x="234" y="208" class="note" fill="#a5f3fc">• rate limiting</text>
  <text x="234" y="226" class="note" fill="#a5f3fc">• TLS termination</text>
  <text x="234" y="244" class="note" fill="#a5f3fc">• aggregation</text>

  <!-- services -->
  <rect x="560" y="80" width="150" height="40" rx="8" class="box"/><text x="635" y="105" text-anchor="middle" class="bl">User service</text>
  <rect x="560" y="135" width="150" height="40" rx="8" class="box"/><text x="635" y="160" text-anchor="middle" class="bl">Order service</text>
  <rect x="560" y="190" width="150" height="40" rx="8" class="box"/><text x="635" y="215" text-anchor="middle" class="bl">Payment service</text>
  <rect x="560" y="245" width="150" height="40" rx="8" class="box"/><text x="635" y="270" text-anchor="middle" class="bl">Catalog service</text>

  <!-- links -->
  <line x1="130" y1="195" x2="220" y2="195" stroke="#475569" stroke-width="2"/>
  <line x1="370" y1="150" x2="560" y2="100" stroke="#475569" stroke-width="1.5"/>
  <line x1="370" y1="175" x2="560" y2="155" stroke="#475569" stroke-width="1.5"/>
  <line x1="370" y1="210" x2="560" y2="210" stroke="#475569" stroke-width="1.5"/>
  <line x1="370" y1="235" x2="560" y2="265" stroke="#475569" stroke-width="1.5"/>

  <!-- animated request -->
  <circle r="7" class="dot" cx="130" cy="195"><animate attributeName="cx" values="130;220" dur="1.6s" repeatCount="indefinite"/></circle>
  <circle r="6" fill="#34d399" cx="370" cy="175"><animate attributeName="cx" values="370;560" dur="1.2s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="cy" values="175;155" dur="1.2s" begin="0.8s" repeatCount="indefinite"/></circle>

  <text x="85" y="240" text-anchor="middle" class="note">one URL, one token</text>

  <rect x="30" y="312" width="700" height="92" rx="10" fill="#0b1220" stroke="#334155"/>
  <text x="46" y="338" fill="#f8fafc" font-size="13" font-weight="700">Gateway vs Load Balancer vs Service Mesh</text>
  <text x="46" y="360" class="note">• Load Balancer = spreads traffic across identical instances (L4/L7). • Gateway = smart edge: routing + cross-cutting concerns.</text>
  <text x="46" y="380" class="note">• Service Mesh = East–West (service-to-service) traffic via sidecars.  ⚠ Gateway is a SPOF → run it redundant; keep business logic OUT of it.</text>
  <text x="46" y="398" class="note" fill="#fca5a5">BFF pattern: a tailored gateway per client type (mobile / web / partner).</text>
</svg>
