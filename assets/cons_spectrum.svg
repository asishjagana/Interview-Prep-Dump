<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="consbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <linearGradient id="cspec" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#16a34a"/><stop offset="0.5" stop-color="#d97706"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .lvl{fill:#f8fafc;font-size:13px;font-weight:700}
      .card{fill:#0f172a;font-size:11px}
      .ch{fill:#0f172a;font-size:12px;font-weight:800}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="760" height="480" rx="16" fill="url(#consbg)"/>
  <text x="30" y="40" class="t">The consistency spectrum — freshness vs speed</text>
  <text x="30" y="62" class="sub">not a switch: pick the weakest model that's still correct for each piece of data</text>

  <!-- gradient bar -->
  <rect x="40" y="82" width="680" height="16" rx="8" fill="url(#cspec)"/>
  <text x="48" y="118" class="sub" fill="#6ee7b7">weakest · fastest · most available</text>
  <text x="712" y="118" text-anchor="end" class="sub" fill="#c4b5fd">strongest · slowest · needs coordination</text>

  <!-- cards -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="40" y="132" width="200" height="130" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="56" y="156" class="ch">EVENTUAL</text>
    <text x="56" y="180" class="card">converges if writes stop</text>
    <text x="56" y="198" class="card">reads may be stale</text>
    <text x="56" y="222" class="card" font-style="italic">like counts, feeds,</text>
    <text x="56" y="240" class="card" font-style="italic">presence, recs</text>
  </g>
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.5s" fill="freeze"/>
    <rect x="256" y="132" width="220" height="130" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="272" y="156" class="ch">READ-YOUR-WRITES</text>
    <text x="272" y="180" class="card">you always see YOUR</text>
    <text x="272" y="198" class="card">own latest write</text>
    <text x="272" y="222" class="card" font-style="italic">own profile edit,</text>
    <text x="272" y="240" class="card" font-style="italic">own comment/cart</text>
    <text x="272" y="258" class="card">+ Monotonic: never go backward</text>
  </g>
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.5s" fill="freeze"/>
    <rect x="492" y="132" width="228" height="130" rx="10" fill="#e0f2fe" stroke="#2563eb" stroke-width="2"/>
    <text x="508" y="156" class="ch">CAUSAL</text>
    <text x="508" y="180" class="card">cause seen before effect</text>
    <text x="508" y="198" class="card">everywhere (reply after msg)</text>
    <text x="508" y="222" class="card" font-style="italic">comment threads,</text>
    <text x="508" y="240" class="card" font-style="italic">chat, collaborative apps</text>
  </g>
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.5s" fill="freeze"/>
    <rect x="256" y="278" width="464" height="96" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="272" y="302" class="ch">STRONG / LINEARIZABLE</text>
    <text x="272" y="326" class="card">every read = latest committed write · behaves like one copy</text>
    <text x="272" y="346" class="card">requires cross-node coordination (quorum / consensus) → highest latency</text>
    <text x="272" y="366" class="card" font-style="italic">bank balance, inventory "last item", auth, distributed locks</text>
  </g>

  <!-- group chat analogy -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.6s" fill="freeze"/>
    <rect x="40" y="278" width="200" height="96" rx="10" fill="#0b1220" stroke="#475569" stroke-width="2"/>
    <text x="56" y="300" class="lvl" font-size="12">Group-chat analogy</text>
    <text x="56" y="322" class="card" fill="#cbd5e1">strong = live call</text>
    <text x="56" y="340" class="card" fill="#cbd5e1">eventual = email</text>
    <text x="56" y="358" class="card" fill="#cbd5e1">causal = threaded replies</text>
  </g>

  <!-- rule -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="3.3s" dur="0.6s" fill="freeze"/>
    <rect x="40" y="388" width="680" height="72" rx="10" fill="#1e293b" stroke="#64748b"/>
    <text x="56" y="412" class="lvl">Achieved via quorum (R + W &gt; N) or a leader read · tunable per query (CL=ONE ↔ QUORUM)</text>
    <text x="56" y="436" class="card" fill="#cbd5e1">⚠ "Last-Write-Wins" depends on synchronized clocks — clock drift silently picks the wrong winner</text>
  </g>
</svg>
