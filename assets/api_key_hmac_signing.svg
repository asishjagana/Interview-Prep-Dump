<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="akbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="akG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6ee7b7"/></marker>
    <marker id="akB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#93c5fd"/></marker>
    <marker id="akV" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#c4b5fd"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .cap{fill:#e2e8f0;font-size:11px}
      .lbl{fill:#f8fafc;font-size:12px;font-weight:700}
      .node{fill:#0b1220;stroke-width:2}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="760" height="650" rx="16" fill="url(#akbg)"/>
  <text x="30" y="38" class="t">API Keys &amp; Service-to-Service Authentication</text>
  <text x="30" y="58" class="sub">a bearer key is a password that never expires — each rung up the ladder removes one thing an attacker can steal</text>

  <!-- ============ PANEL A: THE LADDER ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="72" width="708" height="176" rx="10" fill="#0b1220" stroke="#2563eb" stroke-width="2.5"/>
    <text x="44" y="94" class="hd" fill="#93c5fd">A. THE MACHINE-AUTH LADDER — what each option still leaves exposed</text>
    <text x="44" y="109" class="cap" font-size="10">the question is always: what does an attacker get if they read one log line, one env var, or one repo?</text>

    <rect x="44" y="118" width="672" height="28" rx="6" fill="#3a0f12" stroke="#dc2626" stroke-width="2"/>
    <text x="56" y="136" class="cap" fill="#fca5a5" font-size="11" font-weight="700">① STATIC API KEY</text>
    <text x="230" y="136" class="cap" font-size="10" fill="#fca5a5">long-lived secret sent on every call · leaks in logs/URLs/repos · replayable forever until revoked</text>

    <rect x="44" y="150" width="672" height="28" rx="6" fill="#3a2a0a" stroke="#d97706" stroke-width="2"/>
    <text x="56" y="168" class="cap" fill="#fbbf24" font-size="11" font-weight="700">② OAUTH2 CLIENT CREDENTIALS</text>
    <text x="290" y="168" class="cap" font-size="10" fill="#fbbf24">secret exchanged once for a short-lived scoped token · leak window shrinks to minutes</text>

    <rect x="44" y="182" width="672" height="28" rx="6" fill="#0b2545" stroke="#2563eb" stroke-width="2"/>
    <text x="56" y="200" class="cap" fill="#93c5fd" font-size="11" font-weight="700">③ HMAC SIGNED REQUEST (SigV4-style)</text>
    <text x="330" y="200" class="cap" font-size="10" fill="#93c5fd">secret NEVER on the wire · signature covers method+path+body+time → no replay, no tampering</text>

    <rect x="44" y="214" width="672" height="28" rx="6" fill="#052e1a" stroke="#16a34a" stroke-width="2.5"/>
    <text x="56" y="232" class="lbl" fill="#6ee7b7" font-size="11">④ mTLS / WORKLOAD IDENTITY (SPIFFE, OIDC federation)</text>
    <text x="410" y="232" class="cap" font-size="10" fill="#6ee7b7">no static secret exists at all · identity is attested + auto-rotated (hours)</text>
  </g>

  <!-- ============ PANEL B: HMAC SIGNING ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="260" width="708" height="190" rx="10" fill="#0b1220" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="44" y="282" class="hd" fill="#c4b5fd">B. HMAC REQUEST SIGNING — proving possession without transmitting the secret</text>

    <rect x="44" y="294" width="160" height="64" rx="7" class="node" stroke="#334155"/>
    <text x="124" y="312" text-anchor="middle" class="cap" font-size="10" font-weight="700">① canonical request</text>
    <text x="124" y="326" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">METHOD ‖ path ‖ sorted query</text>
    <text x="124" y="338" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">‖ signed headers ‖ sha256(body)</text>
    <text x="124" y="350" text-anchor="middle" class="cap" font-size="9" fill="#fbbf24">byte-exact, both sides</text>

    <rect x="216" y="294" width="160" height="64" rx="7" class="node" stroke="#7c3aed"/>
    <text x="296" y="312" text-anchor="middle" class="cap" fill="#c4b5fd" font-size="10" font-weight="700">② string to sign</text>
    <text x="296" y="326" text-anchor="middle" class="cap" font-size="9">+ X-Timestamp (±5 min)</text>
    <text x="296" y="338" text-anchor="middle" class="cap" font-size="9">+ nonce · + scope</text>
    <text x="296" y="350" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">time bounds the replay window</text>

    <rect x="388" y="294" width="160" height="64" rx="7" class="node" stroke="#2563eb"/>
    <text x="468" y="312" text-anchor="middle" class="cap" fill="#93c5fd" font-size="10" font-weight="700">③ derived signing key</text>
    <text x="468" y="326" text-anchor="middle" class="cap" font-size="9">HMAC chain: secret → date</text>
    <text x="468" y="338" text-anchor="middle" class="cap" font-size="9">→ region → service → request</text>
    <text x="468" y="350" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">a leaked derived key is scoped</text>

    <rect x="560" y="294" width="156" height="64" rx="7" class="node" stroke="#16a34a"/>
    <text x="638" y="312" text-anchor="middle" class="cap" fill="#6ee7b7" font-size="10" font-weight="700">④ signature</text>
    <text x="638" y="326" text-anchor="middle" class="cap" font-size="9">Authorization: …Signature=…</text>
    <text x="638" y="338" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">only the KEY ID travels,</text>
    <text x="638" y="350" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">never the secret</text>

    <line x1="204" y1="326" x2="214" y2="326" stroke="#c4b5fd" stroke-width="1.6" marker-end="url(#akV)"/>
    <line x1="376" y1="326" x2="386" y2="326" stroke="#c4b5fd" stroke-width="1.6" marker-end="url(#akV)"/>
    <line x1="548" y1="326" x2="558" y2="326" stroke="#6ee7b7" stroke-width="1.6" marker-end="url(#akG)"/>

    <rect x="44" y="372" width="672" height="32" rx="7" fill="#0b2545" stroke="#2563eb" stroke-width="2"/>
    <text x="380" y="392" text-anchor="middle" class="cap" font-size="10" fill="#93c5fd">SERVER: look up the secret by key id → recompute the whole chain → <tspan font-weight="700">constant-time compare</tspan> → check timestamp skew + nonce not seen before</text>

    <text x="380" y="424" text-anchor="middle" class="cap" font-size="10" fill="#fbbf24">the payoff: intercepting the request gives an attacker nothing reusable — the signature is valid for exactly that request, for ~5 minutes</text>
    <text x="380" y="440" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">the cost: canonicalisation is fiddly, clock skew breaks callers, and every client SDK must implement it correctly</text>
  </g>

  <!-- ============ PANEL C: ROTATION ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="462" width="708" height="110" rx="10" fill="#0b1220" stroke="#d97706" stroke-width="2.5"/>
    <text x="44" y="484" class="hd" fill="#fbbf24">C. ROTATION WITHOUT DOWNTIME — two keys valid at once, always</text>

    <rect x="44" y="496" width="420" height="22" rx="5" fill="#052e1a" stroke="#16a34a" stroke-width="2"/>
    <text x="254" y="511" text-anchor="middle" class="cap" fill="#6ee7b7" font-size="10">KEY A active</text>
    <rect x="464" y="496" width="120" height="22" rx="5" fill="#3a2a0a" stroke="#d97706" stroke-width="2"/>
    <text x="524" y="511" text-anchor="middle" class="cap" fill="#fbbf24" font-size="10">A deprecated</text>
    <rect x="584" y="496" width="132" height="22" rx="5" fill="#3a0f12" stroke="#dc2626" stroke-width="2"/>
    <text x="650" y="511" text-anchor="middle" class="cap" fill="#fca5a5" font-size="10">A REVOKED</text>

    <rect x="300" y="524" width="416" height="22" rx="5" fill="#052e1a" stroke="#16a34a" stroke-width="2"/>
    <text x="508" y="539" text-anchor="middle" class="cap" fill="#6ee7b7" font-size="10">KEY B issued → clients migrate → B is now primary</text>

    <text x="380" y="562" text-anchor="middle" class="cap" font-size="10" fill="#94a3b8">the overlap window is the whole trick: issue B before retiring A, watch per-key usage metrics fall to zero, then revoke — never rotate by deleting</text>
  </g>

  <!-- ============ CALLOUT ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="584" width="708" height="50" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="380" y="607" text-anchor="middle" class="hd">Store a HASH of the key, show the plaintext once, and always keep two valid</text>
    <text x="380" y="625" text-anchor="middle" class="cap" fill="#5b21b6" font-size="10">key id prefix for identification · scoped least privilege · per-key rate limits &amp; audit · secret scanning · rotate on a schedule, not after a breach</text>
  </g>
</svg>
