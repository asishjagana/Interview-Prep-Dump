<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="lbbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="lbar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .colhd{font-size:14px;font-weight:800}
      .csub{fill:#94a3b8;font-size:10px}
      .cap{fill:#e2e8f0;font-size:11px}
      .lbl{fill:#f8fafc;font-size:12px;font-weight:700}
      .sm{fill:#cbd5e1;font-size:10px}
      .tag{fill:#94a3b8;font-size:9px;font-style:italic}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="760" height="560" rx="16" fill="url(#lbbg)"/>
  <text x="30" y="40" class="t">Client-side vs Server-side load balancing: same algorithm, different WHERE</text>
  <text x="30" y="62" class="sub">the balancing logic can live in a shared proxy, inside the client itself, or in a co-located sidecar</text>

  <!-- ================= COLUMN 1: SERVER-SIDE ================= -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="30" y="76" width="224" height="378" rx="10" fill="#0b1220" stroke="#2563eb" stroke-width="2"/>
    <text x="142" y="98" text-anchor="middle" class="colhd" fill="#93c5fd">SERVER-SIDE LB</text>
    <text x="142" y="113" text-anchor="middle" class="csub">the shared proxy holds the logic</text>

    <!-- client -->
    <rect x="99" y="122" width="86" height="24" rx="6" fill="#0f172a" stroke="#2563eb"/>
    <text x="142" y="138" text-anchor="middle" class="lbl">Client</text>
    <line x1="142" y1="146" x2="142" y2="160" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#lbar)"/>

    <!-- proxy -->
    <rect x="52" y="162" width="180" height="42" rx="8" fill="#0f172a" stroke="#2563eb" stroke-width="2.5"/>
    <text x="142" y="180" text-anchor="middle" class="lbl">Nginx / HAProxy / ALB</text>
    <text x="142" y="196" text-anchor="middle" class="sm" fill="#93c5fd">holds the LB logic — in the data path</text>

    <!-- fan-out -->
    <line x1="142" y1="204" x2="87" y2="222" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#lbar)"/>
    <line x1="142" y1="204" x2="142" y2="222" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#lbar)"/>
    <line x1="142" y1="204" x2="197" y2="222" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#lbar)"/>
    <rect x="63" y="224" width="48" height="24" rx="5" fill="#0f172a" stroke="#475569"/><text x="87" y="240" text-anchor="middle" class="sm">B1</text>
    <rect x="119" y="224" width="48" height="24" rx="5" fill="#0f172a" stroke="#475569"/><text x="143" y="240" text-anchor="middle" class="sm">B2</text>
    <rect x="175" y="224" width="48" height="24" rx="5" fill="#0f172a" stroke="#475569"/><text x="199" y="240" text-anchor="middle" class="sm">B3</text>

    <text x="44" y="278" class="cap" fill="#6ee7b7">+ language-agnostic</text>
    <text x="44" y="298" class="cap" fill="#6ee7b7">+ central control, thin clients</text>
    <text x="44" y="318" class="cap" fill="#fca5a5">- extra network hop / latency</text>
    <text x="44" y="338" class="cap" fill="#fca5a5">- proxy = a tier to scale + keep HA</text>
    <text x="44" y="362" class="cap" fill="#fca5a5">- can become a bottleneck / SPOF</text>
    <text x="44" y="418" class="tag">every request routes THROUGH</text>
    <text x="44" y="432" class="tag">the proxy: one more hop, one</text>
    <text x="44" y="446" class="tag">more thing to scale and fail.</text>
  </g>

  <!-- ================= COLUMN 2: CLIENT-SIDE ================= -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.5s" fill="freeze"/>
    <rect x="265" y="76" width="224" height="378" rx="10" fill="#0b1220" stroke="#16a34a" stroke-width="2.5"/>
    <text x="377" y="98" text-anchor="middle" class="colhd" fill="#6ee7b7">CLIENT-SIDE LB</text>
    <text x="377" y="113" text-anchor="middle" class="csub">the client picks a backend itself</text>

    <!-- client containing embedded LB -->
    <rect x="300" y="122" width="154" height="52" rx="8" fill="#0f172a" stroke="#16a34a" stroke-width="2.5"/>
    <text x="311" y="136" class="sm" fill="#6ee7b7">CLIENT</text>
    <rect x="318" y="142" width="118" height="24" rx="5" fill="#0b2016" stroke="#16a34a"/>
    <text x="377" y="158" text-anchor="middle" class="lbl">embedded LB</text>

    <!-- registry -->
    <rect x="283" y="196" width="94" height="42" rx="8" fill="#0f172a" stroke="#16a34a"/>
    <text x="330" y="214" text-anchor="middle" class="lbl" font-size="11">Service Registry</text>
    <text x="330" y="230" text-anchor="middle" class="sm">Consul/Eureka/DNS</text>

    <!-- chosen backend -->
    <rect x="393" y="200" width="88" height="34" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="437" y="216" text-anchor="middle" class="lbl" font-size="11">Backend</text>
    <text x="437" y="229" text-anchor="middle" class="sm">(chosen)</text>

    <!-- arrows -->
    <line x1="332" y1="174" x2="330" y2="196" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#lbar)"/>
    <text x="252" y="190" class="tag" fill="#cbd5e1">1 get list</text>
    <line x1="424" y1="174" x2="437" y2="200" stroke="#6ee7b7" stroke-width="2" marker-end="url(#lbar)"/>
    <text x="445" y="190" class="tag" fill="#6ee7b7">2 direct</text>
    <text x="377" y="252" text-anchor="middle" class="sm" fill="#6ee7b7">no middle box — connects straight to B</text>

    <text x="279" y="278" class="cap" fill="#6ee7b7">+ no extra hop, lower latency</text>
    <text x="279" y="298" class="cap" fill="#6ee7b7">+ no proxy bottleneck / SPOF</text>
    <text x="279" y="318" class="cap" fill="#6ee7b7">+ locality-aware (prefer same-zone)</text>
    <text x="279" y="338" class="cap" fill="#fca5a5">- fat client, per-language logic</text>
    <text x="279" y="362" class="cap" fill="#fca5a5">- redeploy every client to change policy</text>
    <text x="279" y="418" class="tag">the LB lives INSIDE the app.</text>
    <text x="279" y="432" class="tag">e.g. gRPC round_robin, Ribbon,</text>
    <text x="279" y="446" class="tag">Spring Cloud LoadBalancer.</text>
  </g>

  <!-- ================= COLUMN 3: SIDECAR ================= -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.5s" fill="freeze"/>
    <rect x="500" y="76" width="224" height="378" rx="10" fill="#0b1220" stroke="#d97706" stroke-width="2"/>
    <text x="612" y="98" text-anchor="middle" class="colhd" fill="#fbbf24">SERVICE MESH SIDECAR</text>
    <text x="612" y="113" text-anchor="middle" class="csub">the synthesis of both</text>

    <!-- app pod -->
    <rect x="522" y="122" width="180" height="52" rx="8" fill="#0f172a" stroke="#d97706" stroke-width="2.5"/>
    <text x="530" y="135" class="sm" fill="#fbbf24">APP POD</text>
    <rect x="532" y="140" width="78" height="26" rx="5" fill="#0b1220" stroke="#475569"/>
    <text x="571" y="157" text-anchor="middle" class="lbl" font-size="11">App</text>
    <rect x="614" y="140" width="78" height="26" rx="5" fill="#1c1207" stroke="#d97706"/>
    <text x="653" y="157" text-anchor="middle" class="lbl" font-size="11">Envoy</text>

    <!-- backend -->
    <rect x="532" y="200" width="86" height="34" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="575" y="221" text-anchor="middle" class="lbl" font-size="11">Backend</text>
    <line x1="640" y1="166" x2="580" y2="200" stroke="#fbbf24" stroke-width="2" marker-end="url(#lbar)"/>
    <text x="583" y="185" class="tag" fill="#fbbf24">direct</text>

    <!-- control plane -->
    <rect x="620" y="200" width="86" height="42" rx="8" fill="#0f172a" stroke="#d97706"/>
    <text x="663" y="218" text-anchor="middle" class="lbl" font-size="11">Control Plane</text>
    <text x="663" y="232" text-anchor="middle" class="sm">Istio / Linkerd</text>
    <line x1="660" y1="200" x2="656" y2="168" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#lbar)"/>
    <text x="668" y="190" class="tag" fill="#cbd5e1">push policy</text>

    <text x="514" y="278" class="cap" fill="#6ee7b7">client-side-LB benefits...</text>
    <text x="514" y="298" class="cap" fill="#6ee7b7">(direct path, no central bottleneck)</text>
    <text x="514" y="318" class="cap" fill="#fbbf24">...with server-side ergonomics</text>
    <text x="514" y="338" class="cap" fill="#fbbf24">(app stays dumb; policy set once)</text>
    <text x="514" y="362" class="cap" fill="#e2e8f0">the LB logic LEAVES the app code</text>
    <text x="514" y="418" class="tag">Envoy sits beside the app and</text>
    <text x="514" y="432" class="tag">does the picking; the control</text>
    <text x="514" y="446" class="tag">plane pushes policy, no redeploy.</text>
  </g>

  <!-- ================= CALLOUT BAR ================= -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.5s" fill="freeze"/>
    <rect x="30" y="474" width="694" height="66" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="377" y="502" text-anchor="middle" class="hd">Same algorithms (round robin, least-conn) — the question is WHERE they run:</text>
    <text x="377" y="524" text-anchor="middle" class="cap" fill="#166534">a shared proxy (server-side), the client itself (client-side), or a co-located sidecar (service mesh).</text>
  </g>
</svg>
