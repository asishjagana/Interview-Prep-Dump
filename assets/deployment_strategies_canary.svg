<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 684" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="dep_bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="dep_arrowG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6ee7b7"/></marker>
    <marker id="dep_arrowR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#fca5a5"/></marker>
    <marker id="dep_arrowB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#93c5fd"/></marker>
    <marker id="dep_arrowA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#fbbf24"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .cap{fill:#e2e8f0;font-size:11px}
      .lbl{fill:#f8fafc;font-size:12px;font-weight:700}
      .mono{font-family:'Consolas','Courier New',monospace;font-size:10px;fill:#e2e8f0}
      .node{fill:#0b1220;stroke-width:2}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="780" height="684" rx="16" fill="url(#dep_bg)"/>
  <text x="30" y="38" class="t">Deployment Strategies — Blue-Green, Canary, Rolling &amp; Shadow</text>
  <text x="30" y="58" class="sub">deploy ≠ release · the strategy is easy, the shared database is the hard part</text>

  <!-- ============ PANEL A: FIVE STRATEGIES OVER A TIME AXIS ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="72" width="728" height="166" rx="10" fill="#0b1220" stroke="#2563eb" stroke-width="2.5"/>
    <text x="44" y="94" class="hd" fill="#93c5fd">A. THE LADDER — traffic share over time, left→right · blue = v1 · green = v2 · red = downtime</text>

    <!-- 1. RECREATE -->
    <rect x="44" y="104" width="132" height="126" rx="8" class="node" stroke="#dc2626"/>
    <text x="110" y="122" text-anchor="middle" class="lbl" font-size="11" fill="#fca5a5">1 · RECREATE</text>
    <rect x="56" y="132" width="40" height="28" fill="#60a5fa"/>
    <rect x="96" y="132" width="26" height="28" fill="#f87171"/>
    <text x="109" y="150" text-anchor="middle" class="cap" font-size="7" fill="#450a0a" font-weight="700">DOWN</text>
    <rect x="122" y="132" width="42" height="28" fill="#34d399"/>
    <text x="110" y="176" text-anchor="middle" class="cap" font-size="8">infra cost: 1× (no overlap)</text>
    <text x="110" y="189" text-anchor="middle" class="cap" font-size="8" fill="#fca5a5">downtime: 30 s – minutes</text>
    <text x="110" y="202" text-anchor="middle" class="cap" font-size="8">rollback: redeploy old (min)</text>
    <text x="110" y="215" text-anchor="middle" class="cap" font-size="8" fill="#fca5a5">blast radius: 100% of users</text>

    <!-- 2. ROLLING -->
    <rect x="183" y="104" width="132" height="126" rx="8" class="node" stroke="#d97706"/>
    <text x="249" y="122" text-anchor="middle" class="lbl" font-size="11" fill="#fbbf24">2 · ROLLING</text>
    <rect x="195" y="132" width="108" height="28" fill="#60a5fa"/>
    <polygon points="195,160 195,155.3 213,155.3 213,150.7 231,150.7 231,146 249,146 249,141.3 267,141.3 267,136.7 285,136.7 285,132 303,132 303,160" fill="#34d399"/>
    <text x="249" y="176" text-anchor="middle" class="cap" font-size="8">cost: 1.25× peak (maxSurge)</text>
    <text x="249" y="189" text-anchor="middle" class="cap" font-size="8" fill="#6ee7b7">no downtime · K8s default</text>
    <text x="249" y="202" text-anchor="middle" class="cap" font-size="8" fill="#fca5a5">rollback: reverse rollout (min)</text>
    <text x="249" y="215" text-anchor="middle" class="cap" font-size="8">v1+v2 BOTH live the whole time</text>

    <!-- 3. BLUE-GREEN -->
    <rect x="322" y="104" width="132" height="126" rx="8" class="node" stroke="#2563eb"/>
    <text x="388" y="122" text-anchor="middle" class="lbl" font-size="11" fill="#93c5fd">3 · BLUE-GREEN</text>
    <rect x="334" y="132" width="72" height="28" fill="#60a5fa"/>
    <rect x="408" y="132" width="34" height="28" fill="#34d399"/>
    <line x1="407" y1="128" x2="407" y2="166" stroke="#fbbf24" stroke-width="2"/>
    <polygon points="403,166 411,166 407,160" fill="#fbbf24"/>
    <text x="388" y="176" text-anchor="middle" class="cap" font-size="8" fill="#fca5a5">cost: 2× (two full fleets)</text>
    <text x="388" y="189" text-anchor="middle" class="cap" font-size="8" fill="#fbbf24">atomic cutover at the LB</text>
    <text x="388" y="202" text-anchor="middle" class="cap" font-size="8" fill="#6ee7b7">rollback: flip back, ~seconds</text>
    <text x="388" y="215" text-anchor="middle" class="cap" font-size="8" fill="#fca5a5">blast: 100%, all at once</text>

    <!-- 4. CANARY -->
    <rect x="461" y="104" width="132" height="126" rx="8" fill="#052e1a" stroke="#16a34a" stroke-width="2.5"/>
    <text x="527" y="122" text-anchor="middle" class="lbl" font-size="11" fill="#6ee7b7">4 · CANARY</text>
    <rect x="473" y="132" width="108" height="28" fill="#60a5fa"/>
    <polygon points="473,160 473,158 500,158 500,155 527,155 527,146 554,146 554,132 581,132 581,160" fill="#34d399"/>
    <text x="527" y="176" text-anchor="middle" class="cap" font-size="8">cost: ~1.05× (a few pods)</text>
    <text x="527" y="189" text-anchor="middle" class="cap" font-size="8" fill="#6ee7b7">weights 1% → 10% → 50% → 100%</text>
    <text x="527" y="202" text-anchor="middle" class="cap" font-size="8" fill="#6ee7b7">rollback: re-weight to 0, ~sec</text>
    <text x="527" y="215" text-anchor="middle" class="cap" font-size="8" fill="#fbbf24">needs traffic volume to judge</text>

    <!-- 5. SHADOW -->
    <rect x="600" y="104" width="132" height="126" rx="8" class="node" stroke="#7c3aed"/>
    <text x="666" y="122" text-anchor="middle" class="lbl" font-size="11" fill="#c4b5fd">5 · SHADOW</text>
    <rect x="612" y="132" width="108" height="18" fill="#60a5fa"/>
    <text x="666" y="145" text-anchor="middle" class="cap" font-size="7" fill="#0b1220" font-weight="700">100% of real traffic still v1</text>
    <rect x="612" y="153" width="108" height="8" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="666" y="176" text-anchor="middle" class="cap" font-size="8">cost: 2× compute, 0% risk</text>
    <text x="666" y="189" text-anchor="middle" class="cap" font-size="8" fill="#c4b5fd">responses DISCARDED</text>
    <text x="666" y="202" text-anchor="middle" class="cap" font-size="8">nothing to roll back</text>
    <text x="666" y="215" text-anchor="middle" class="cap" font-size="8" fill="#fca5a5">trap: duplicate side effects</text>
  </g>

  <!-- ============ PANEL B: EXPAND-CONTRACT MIGRATION ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="250" width="728" height="176" rx="10" fill="#0b1220" stroke="#d97706" stroke-width="2.5"/>
    <text x="44" y="272" class="hd" fill="#fbbf24">B. EXPAND–CONTRACT — the 6 releases that turn one column rename into a zero-downtime change</text>

    <rect x="44" y="280" width="110" height="86" rx="7" class="node" stroke="#334155"/>
    <text x="99" y="296" text-anchor="middle" class="cap" font-size="9" font-weight="700" fill="#93c5fd">① EXPAND</text>
    <text x="99" y="310" text-anchor="middle" class="mono" font-size="7.5">ALTER TABLE u</text>
    <text x="99" y="321" text-anchor="middle" class="mono" font-size="7.5">ADD email_new</text>
    <text x="99" y="332" text-anchor="middle" class="cap" font-size="7.5">NULL, no default</text>
    <text x="99" y="343" text-anchor="middle" class="cap" font-size="7.5" fill="#6ee7b7">metadata-only lock</text>
    <text x="99" y="354" text-anchor="middle" class="cap" font-size="7.5">app code: unchanged</text>

    <rect x="159" y="280" width="110" height="86" rx="7" class="node" stroke="#334155"/>
    <text x="214" y="296" text-anchor="middle" class="cap" font-size="9" font-weight="700" fill="#93c5fd">② DUAL-WRITE</text>
    <text x="214" y="310" text-anchor="middle" class="cap" font-size="7.5">deploy v2: writes</text>
    <text x="214" y="321" text-anchor="middle" class="cap" font-size="7.5">BOTH columns,</text>
    <text x="214" y="332" text-anchor="middle" class="cap" font-size="7.5">still READS old</text>
    <text x="214" y="343" text-anchor="middle" class="cap" font-size="7.5" fill="#6ee7b7">v1 and v2 coexist</text>
    <text x="214" y="354" text-anchor="middle" class="cap" font-size="7.5">rollback is free here</text>

    <rect x="274" y="280" width="110" height="86" rx="7" class="node" stroke="#334155"/>
    <text x="329" y="296" text-anchor="middle" class="cap" font-size="9" font-weight="700" fill="#93c5fd">③ BACKFILL</text>
    <text x="329" y="310" text-anchor="middle" class="mono" font-size="7.5">UPDATE … WHERE</text>
    <text x="329" y="321" text-anchor="middle" class="mono" font-size="7.5">id BETWEEN a,b</text>
    <text x="329" y="332" text-anchor="middle" class="cap" font-size="7.5">5k rows/batch,</text>
    <text x="329" y="343" text-anchor="middle" class="cap" font-size="7.5">sleep 100 ms</text>
    <text x="329" y="354" text-anchor="middle" class="cap" font-size="7.5" fill="#fca5a5">never one big UPDATE</text>

    <rect x="389" y="280" width="110" height="86" rx="7" class="node" stroke="#334155"/>
    <text x="444" y="296" text-anchor="middle" class="cap" font-size="9" font-weight="700" fill="#93c5fd">④ READ NEW</text>
    <text x="444" y="310" text-anchor="middle" class="cap" font-size="7.5">read email_new,</text>
    <text x="444" y="321" text-anchor="middle" class="cap" font-size="7.5">fall back to old</text>
    <text x="444" y="332" text-anchor="middle" class="cap" font-size="7.5">when it is NULL</text>
    <text x="444" y="343" text-anchor="middle" class="cap" font-size="7.5" fill="#fbbf24">compare old vs new</text>
    <text x="444" y="354" text-anchor="middle" class="cap" font-size="7.5" fill="#fbbf24">gate: mismatches = 0</text>

    <rect x="504" y="280" width="110" height="86" rx="7" class="node" stroke="#334155"/>
    <text x="559" y="296" text-anchor="middle" class="cap" font-size="9" font-weight="700" fill="#93c5fd">⑤ STOP OLD</text>
    <text x="559" y="310" text-anchor="middle" class="cap" font-size="7.5">deploy v3: read +</text>
    <text x="559" y="321" text-anchor="middle" class="cap" font-size="7.5">write NEW only</text>
    <text x="559" y="332" text-anchor="middle" class="cap" font-size="7.5">old column frozen</text>
    <text x="559" y="343" text-anchor="middle" class="cap" font-size="7.5" fill="#fbbf24">WAIT ≥ 1 full</text>
    <text x="559" y="354" text-anchor="middle" class="cap" font-size="7.5" fill="#fbbf24">release cycle</text>

    <rect x="619" y="280" width="110" height="86" rx="7" fill="#052e1a" stroke="#16a34a" stroke-width="2"/>
    <text x="674" y="296" text-anchor="middle" class="cap" font-size="9" font-weight="700" fill="#6ee7b7">⑥ CONTRACT</text>
    <text x="674" y="310" text-anchor="middle" class="mono" font-size="7.5">ALTER TABLE u</text>
    <text x="674" y="321" text-anchor="middle" class="mono" font-size="7.5">DROP email</text>
    <text x="674" y="332" text-anchor="middle" class="cap" font-size="7.5">only once NO</text>
    <text x="674" y="343" text-anchor="middle" class="cap" font-size="7.5">running version</text>
    <text x="674" y="354" text-anchor="middle" class="cap" font-size="7.5">references it</text>

    <!-- the rollout marker sweeping the six steps -->
    <rect x="44" y="280" width="110" height="86" rx="7" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="0,0;115,0;230,0;345,0;460,0;575,0" dur="7.2s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>

    <rect x="44" y="374" width="685" height="20" rx="6" fill="#052e1a" stroke="#16a34a" stroke-width="2"/>
    <text x="386" y="388" text-anchor="middle" class="cap" font-size="9.5" fill="#6ee7b7">THE INVARIANT: at every single step the schema works for BOTH the version you are leaving (N−1) and the one you are shipping (N+1)</text>

    <rect x="44" y="400" width="685" height="20" rx="6" fill="#3a0f12" stroke="#dc2626" stroke-width="2"/>
    <text x="386" y="414" text-anchor="middle" class="cap" font-size="9.5" fill="#fca5a5">THE SHORTCUT THAT KILLS YOU: RENAME or DROP in the same release as the code — the still-running old pods query a column that no longer exists</text>
  </g>

  <!-- ============ PANEL C: WHICH STRATEGY? ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="438" width="728" height="220" rx="10" fill="#0b1220" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="44" y="460" class="hd" fill="#c4b5fd">C. WHICH STRATEGY? — ask in order, the FIRST yes is your answer</text>

    <rect x="44" y="470" width="692" height="22" rx="6" fill="#2e1065" stroke="#7c3aed" stroke-width="2"/>
    <text x="390" y="485" text-anchor="middle" class="cap" font-size="10" fill="#c4b5fd" font-weight="700">DEPLOY (code onto machines) ≠ RELEASE (traffic onto code). A feature flag flips in ~1 s; a redeploy takes minutes.</text>

    <rect x="44" y="500" width="340" height="22" rx="5" class="node" stroke="#334155"/>
    <text x="54" y="515" class="cap" font-size="9">1. Is downtime acceptable? (nightly batch, single-writer job)</text>
    <line x1="386" y1="511" x2="394" y2="511" stroke="#93c5fd" stroke-width="1.8" marker-end="url(#dep_arrowB)"/>
    <rect x="396" y="500" width="340" height="22" rx="5" class="node" stroke="#2563eb"/>
    <text x="406" y="515" class="cap" font-size="9" fill="#93c5fd">RECREATE. Cheapest, simplest — stop over-engineering.</text>

    <rect x="44" y="526" width="340" height="22" rx="5" class="node" stroke="#334155"/>
    <text x="54" y="541" class="cap" font-size="9">2. Does the change touch the database schema?</text>
    <line x1="386" y1="537" x2="394" y2="537" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#dep_arrowA)"/>
    <rect x="396" y="526" width="340" height="22" rx="5" fill="#3a2a06" stroke="#d97706" stroke-width="2"/>
    <text x="406" y="541" class="cap" font-size="9" fill="#fbbf24">EXPAND–CONTRACT FIRST. No strategy survives a breaking migration.</text>

    <rect x="44" y="552" width="340" height="22" rx="5" class="node" stroke="#334155"/>
    <text x="54" y="567" class="cap" font-size="9">3. Stateless, no shared DB coupling, and you can pay 2× infra?</text>
    <line x1="386" y1="563" x2="394" y2="563" stroke="#93c5fd" stroke-width="1.8" marker-end="url(#dep_arrowB)"/>
    <rect x="396" y="552" width="340" height="22" rx="5" class="node" stroke="#2563eb"/>
    <text x="406" y="567" class="cap" font-size="9" fill="#93c5fd">BLUE-GREEN. Atomic flip, seconds to undo. Watch the DNS TTL.</text>

    <rect x="44" y="578" width="340" height="22" rx="5" class="node" stroke="#334155"/>
    <text x="54" y="593" class="cap" font-size="9">4. Can the LB/mesh split by weight, and do you have SLIs?</text>
    <line x1="386" y1="589" x2="394" y2="589" stroke="#6ee7b7" stroke-width="1.8" marker-end="url(#dep_arrowG)"/>
    <rect x="396" y="578" width="340" height="22" rx="5" fill="#052e1a" stroke="#16a34a" stroke-width="2.5"/>
    <text x="406" y="593" class="cap" font-size="9" fill="#6ee7b7" font-weight="700">CANARY + automated analysis. The default answer at scale.</text>

    <rect x="44" y="604" width="340" height="22" rx="5" class="node" stroke="#334155"/>
    <text x="54" y="619" class="cap" font-size="9">5. Rewriting a READ path and want real traffic at zero user risk?</text>
    <line x1="386" y1="615" x2="394" y2="615" stroke="#c4b5fd" stroke-width="1.8" marker-end="url(#dep_arrowB)"/>
    <rect x="396" y="604" width="340" height="22" rx="5" class="node" stroke="#7c3aed"/>
    <text x="406" y="619" class="cap" font-size="9" fill="#c4b5fd">SHADOW, then canary. Stub every write or you double-charge.</text>

    <rect x="44" y="630" width="340" height="22" rx="5" class="node" stroke="#334155"/>
    <text x="54" y="645" class="cap" font-size="9">6. Judging conversion over DAYS, not errors over minutes?</text>
    <line x1="386" y1="641" x2="394" y2="641" stroke="#c4b5fd" stroke-width="1.8" marker-end="url(#dep_arrowB)"/>
    <rect x="396" y="630" width="340" height="22" rx="5" class="node" stroke="#7c3aed"/>
    <text x="406" y="645" class="cap" font-size="9" fill="#c4b5fd">A/B TEST behind a FLAG. That is a release, not a deployment.</text>
  </g>
</svg>
