<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="ifbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="ifar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#fbbf24"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .lbl{fill:#0f172a;font-size:14px;font-weight:700}
      .api{fill:#fbbf24;font-size:11px;font-family:'Consolas',monospace}
      .mono{font-family:'Consolas',monospace}
      .note{fill:#94a3b8;font-size:12px}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="760" height="440" rx="16" fill="url(#ifbg)"/>
  <text x="30" y="38" class="t">Program to an interface, not an implementation</text>
  <text x="30" y="58" class="sub">High-level code depends only on the contract. Any implementation that satisfies it plugs in.</text>

  <!-- high-level consumer -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.5s" fill="freeze"/>
    <rect x="40" y="90" width="200" height="90" rx="10" fill="#ede9fe" stroke="#818cf8" stroke-width="2"/>
    <text x="140" y="120" text-anchor="middle" class="lbl">OrderService</text>
    <text x="140" y="142" text-anchor="middle" fill="#4c1d95" font-size="11">high-level policy</text>
    <text x="140" y="162" text-anchor="middle" fill="#4c1d95" class="mono" font-size="11">notifier.send(msg)</text>
  </g>

  <!-- the contract / socket -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.5s" fill="freeze"/>
    <rect x="300" y="80" width="160" height="110" rx="10" fill="#fef3c7" stroke="#fbbf24" stroke-width="3"/>
    <text x="380" y="112" text-anchor="middle" class="lbl">«interface»</text>
    <text x="380" y="134" text-anchor="middle" class="lbl">Notifier</text>
    <rect x="316" y="150" width="128" height="26" rx="4" fill="#78350f"/>
    <text x="380" y="167" text-anchor="middle" class="api">send(msg) -&gt; bool</text>
  </g>

  <!-- dependency arrow -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.5s" fill="freeze"/>
    <path d="M240,135 L300,135" stroke="#fbbf24" stroke-width="2" marker-end="url(#ifar)"/>
    <text x="270" y="126" text-anchor="middle" fill="#fbbf24" font-size="10">depends on</text>
  </g>

  <!-- implementations plugging in -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.5s" fill="freeze"/>
    <path d="M460,110 L520,110" stroke="#fbbf24" stroke-width="2" marker-end="url(#ifar)"/>
    <rect x="520" y="86" width="200" height="48" rx="8" fill="#dcfce7" stroke="#34d399" stroke-width="2"/>
    <text x="620" y="107" text-anchor="middle" class="lbl">EmailNotifier</text>
    <text x="620" y="124" text-anchor="middle" fill="#065f46" font-size="10">SMTP / SendGrid</text>
  </g>
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.5s" fill="freeze"/>
    <path d="M460,135 L520,150" stroke="#fbbf24" stroke-width="2" marker-end="url(#ifar)"/>
    <rect x="520" y="144" width="200" height="48" rx="8" fill="#dcfce7" stroke="#34d399" stroke-width="2"/>
    <text x="620" y="165" text-anchor="middle" class="lbl">SmsNotifier</text>
    <text x="620" y="182" text-anchor="middle" fill="#065f46" font-size="10">Twilio</text>
  </g>
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.5s" fill="freeze"/>
    <path d="M460,160 L520,208" stroke="#fbbf24" stroke-width="2" marker-end="url(#ifar)"/>
    <rect x="520" y="202" width="200" height="48" rx="8" fill="#dcfce7" stroke="#34d399" stroke-width="2"/>
    <text x="620" y="223" text-anchor="middle" class="lbl">SlackNotifier</text>
    <text x="620" y="240" text-anchor="middle" fill="#065f46" font-size="10">webhook</text>
  </g>
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.5s" fill="freeze"/>
    <path d="M460,170 L520,266" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ifar)"/>
    <rect x="520" y="260" width="200" height="48" rx="8" fill="#e0f2fe" stroke="#60a5fa" stroke-width="2"/>
    <text x="620" y="281" text-anchor="middle" class="lbl">MockNotifier</text>
    <text x="620" y="298" text-anchor="middle" fill="#1e40af" font-size="10">records calls — for tests</text>
  </g>

  <!-- bottom banner -->
  <rect x="30" y="330" width="700" height="94" rx="10" fill="#0b1220" stroke="#334155" class="fade"><animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.6s" fill="freeze"/></rect>
  <text x="46" y="356" fill="#f8fafc" font-size="14" font-weight="700">One contract, many interchangeable implementations — swap at the wiring layer, not in business logic.</text>
  <text x="46" y="380" class="note" fill="#86efac">✓ decoupled · testable (inject the mock) · open to extension — add a new Notifier without touching OrderService.</text>
  <text x="46" y="402" class="note" fill="#fca5a5">✗ leaky method like getSmtpConnection() would drag transport details back across the seam — keep the contract minimal.</text>
</svg>
