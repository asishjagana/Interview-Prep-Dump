<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 710" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="rmbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="rmB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#93c5fd"/></marker>
    <marker id="rmG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6ee7b7"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .cap{fill:#e2e8f0;font-size:11px}
      .lbl{fill:#f8fafc;font-size:12px;font-weight:700}
      .mono{font-family:'Consolas','Courier New',monospace;font-size:10px;fill:#e2e8f0}
      .node{fill:#0b1220;stroke-width:2}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="780" height="710" rx="16" fill="url(#rmbg)"/>
  <text x="30" y="38" class="t">Real User Monitoring — the last mile of observability</text>
  <text x="30" y="58" class="sub">your servers said 40 ms · the user waited 6 s · only one of those is the product</text>

  <!-- ============ PANEL A: THE THREE CORE WEB VITALS ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="72" width="728" height="152" rx="10" fill="#0b1220" stroke="#2563eb" stroke-width="2.5"/>
    <text x="44" y="94" class="hd" fill="#93c5fd">A. THE THREE CORE WEB VITALS — all judged at the 75th percentile of real page loads</text>

    <rect x="44" y="104" width="228" height="106" rx="8" class="node" stroke="#16a34a"/>
    <text x="158" y="122" text-anchor="middle" class="lbl" fill="#6ee7b7" font-size="12">LCP · loading</text>
    <text x="158" y="136" text-anchor="middle" class="cap" font-size="9">when the biggest above-the-fold element renders</text>
    <rect x="60" y="144" width="92" height="14" rx="3" fill="#16a34a"/>
    <rect x="152" y="144" width="60" height="14" rx="0" fill="#d97706"/>
    <rect x="212" y="144" width="44" height="14" rx="3" fill="#dc2626"/>
    <text x="106" y="155" text-anchor="middle" class="cap" font-size="9" fill="#052e1a" font-weight="700">≤ 2.5s good</text>
    <text x="182" y="155" text-anchor="middle" class="cap" font-size="9" fill="#3a2a0a" font-weight="700">≤ 4.0s</text>
    <text x="234" y="155" text-anchor="middle" class="cap" font-size="9" fill="#3a0f12" font-weight="700">poor</text>
    <text x="158" y="176" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">usual cause: slow TTFB · render-blocking CSS/JS</text>
    <text x="158" y="188" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">unoptimized hero image · client-side rendering</text>
    <text x="158" y="203" text-anchor="middle" class="mono" font-size="9" fill="#bbf7d0">attribution: ttfb / resourceDelay / renderDelay</text>

    <rect x="284" y="104" width="228" height="106" rx="8" class="node" stroke="#d97706"/>
    <text x="398" y="122" text-anchor="middle" class="lbl" fill="#fbbf24" font-size="12">INP · responsiveness</text>
    <text x="398" y="136" text-anchor="middle" class="cap" font-size="9">WORST input→paint latency of the whole visit</text>
    <rect x="300" y="144" width="92" height="14" rx="3" fill="#16a34a"/>
    <rect x="392" y="144" width="60" height="14" fill="#d97706"/>
    <rect x="452" y="144" width="44" height="14" rx="3" fill="#dc2626"/>
    <text x="346" y="155" text-anchor="middle" class="cap" font-size="9" fill="#052e1a" font-weight="700">≤ 200ms good</text>
    <text x="422" y="155" text-anchor="middle" class="cap" font-size="9" fill="#3a2a0a" font-weight="700">≤ 500ms</text>
    <text x="474" y="155" text-anchor="middle" class="cap" font-size="9" fill="#3a0f12" font-weight="700">poor</text>
    <text x="398" y="176" text-anchor="middle" class="cap" font-size="9" fill="#fbbf24">replaced FID in March 2024 — FID measured only</text>
    <text x="398" y="188" text-anchor="middle" class="cap" font-size="9" fill="#fbbf24">the delay before the FIRST interaction; everyone passed</text>
    <text x="398" y="203" text-anchor="middle" class="mono" font-size="9" fill="#fde68a">attribution: inputDelay / processing / presentation</text>

    <rect x="524" y="104" width="230" height="106" rx="8" class="node" stroke="#7c3aed"/>
    <text x="639" y="122" text-anchor="middle" class="lbl" fill="#c4b5fd" font-size="12">CLS · visual stability</text>
    <text x="639" y="136" text-anchor="middle" class="cap" font-size="9">how much the content jumps (unitless score)</text>
    <rect x="540" y="144" width="92" height="14" rx="3" fill="#16a34a"/>
    <rect x="632" y="144" width="60" height="14" fill="#d97706"/>
    <rect x="692" y="144" width="46" height="14" rx="3" fill="#dc2626"/>
    <text x="586" y="155" text-anchor="middle" class="cap" font-size="9" fill="#052e1a" font-weight="700">≤ 0.1 good</text>
    <text x="662" y="155" text-anchor="middle" class="cap" font-size="9" fill="#3a2a0a" font-weight="700">≤ 0.25</text>
    <text x="715" y="155" text-anchor="middle" class="cap" font-size="9" fill="#3a0f12" font-weight="700">poor</text>
    <text x="639" y="176" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">usual cause: images with no width/height · injected</text>
    <text x="639" y="188" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">banners and ads · late-loading web fonts</text>
    <text x="639" y="203" text-anchor="middle" class="mono" font-size="9" fill="#ddd6fe">attribution: largestShiftTarget (the node that moved)</text>
  </g>

  <!-- ============ PANEL B: LAB POINT vs FIELD DISTRIBUTION ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="236" width="728" height="200" rx="10" fill="#0b1220" stroke="#d97706" stroke-width="2.5"/>
    <text x="44" y="258" class="hd" fill="#fbbf24">B. LAB GIVES YOU A POINT · FIELD GIVES YOU A DISTRIBUTION — and the decision lives at p75</text>

    <rect x="44" y="270" width="300" height="150" rx="8" fill="#0c2b3f" stroke="#2563eb" stroke-width="2"/>
    <text x="194" y="288" text-anchor="middle" class="cap" font-size="11" font-weight="700" fill="#93c5fd">SYNTHETIC (lab)</text>
    <line x1="70" y1="380" x2="320" y2="380" stroke="#334155" stroke-width="1.5"/>
    <circle cx="140" cy="340" r="8" fill="#60a5fa"/>
    <text x="140" y="366" text-anchor="middle" class="mono" font-size="10" fill="#bfdbfe">LCP 1.1s</text>
    <text x="194" y="308" text-anchor="middle" class="cap" font-size="9">datacenter link · modern CPU · cold cache</text>
    <text x="194" y="320" text-anchor="middle" class="cap" font-size="9">no extensions · same page, every time</text>
    <text x="194" y="398" text-anchor="middle" class="cap" font-size="9" fill="#6ee7b7">✓ repeatable · works at 3am with zero traffic</text>
    <text x="194" y="411" text-anchor="middle" class="cap" font-size="9" fill="#fca5a5">✗ one device, one network, one place on earth</text>

    <rect x="356" y="270" width="398" height="150" rx="8" fill="#3a2a0a" stroke="#d97706" stroke-width="2"/>
    <text x="555" y="288" text-anchor="middle" class="cap" font-size="11" font-weight="700" fill="#fbbf24">RUM (field) — thousands of real page loads</text>
    <line x1="376" y1="380" x2="742" y2="380" stroke="#334155" stroke-width="1.5"/>
    <g fill="#fbbf24" opacity="0.85">
      <rect x="380" y="374" width="13" height="6"/>
      <rect x="395" y="362" width="13" height="18"/>
      <rect x="410" y="342" width="13" height="38"/>
      <rect x="425" y="320" width="13" height="60"/>
      <rect x="440" y="306" width="13" height="74"/>
      <rect x="455" y="300" width="13" height="80"/>
      <rect x="470" y="308" width="13" height="72"/>
      <rect x="485" y="322" width="13" height="58"/>
      <rect x="500" y="336" width="13" height="44"/>
      <rect x="515" y="346" width="13" height="34"/>
      <rect x="530" y="354" width="13" height="26"/>
      <rect x="545" y="360" width="13" height="20"/>
      <rect x="560" y="365" width="13" height="15"/>
      <rect x="575" y="369" width="13" height="11"/>
      <rect x="590" y="371" width="13" height="9"/>
      <rect x="605" y="373" width="13" height="7"/>
      <rect x="620" y="375" width="13" height="5"/>
      <rect x="635" y="376" width="13" height="4"/>
      <rect x="650" y="377" width="13" height="3"/>
      <rect x="665" y="377" width="13" height="3"/>
      <rect x="680" y="378" width="13" height="2"/>
      <rect x="695" y="378" width="13" height="2"/>
    </g>
    <line x1="500" y1="296" x2="500" y2="386" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="500" y="292" text-anchor="middle" class="cap" font-size="9" fill="#93c5fd">mean</text>
    <line x1="552" y1="296" x2="552" y2="386" stroke="#6ee7b7" stroke-width="2.5"/>
    <text x="566" y="292" class="cap" font-size="10" fill="#6ee7b7" font-weight="700">p75 ← the number that counts</text>
    <text x="555" y="400" text-anchor="middle" class="cap" font-size="9" fill="#fca5a5">the mean is left of p75 and left of everyone who is suffering</text>
    <text x="555" y="412" text-anchor="middle" class="cap" font-size="9" fill="#fbbf24">segment by device · country · connection: one slice is often 3× worse than the aggregate</text>
  </g>

  <!-- ============ PANEL C: THE PIPELINE ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="448" width="728" height="196" rx="10" fill="#0b1220" stroke="#16a34a" stroke-width="2.5"/>
    <text x="44" y="470" class="hd" fill="#6ee7b7">C. COLLECTION — what to gather, how to send it, and what to strip before it lands</text>

    <rect x="44" y="482" width="172" height="96" rx="7" class="node" stroke="#7c3aed"/>
    <text x="130" y="500" text-anchor="middle" class="cap" font-size="10" font-weight="700" fill="#c4b5fd">in the browser</text>
    <text x="130" y="516" class="mono" font-size="9" text-anchor="middle">PerformanceObserver</text>
    <text x="130" y="529" class="mono" font-size="9" text-anchor="middle">web-vitals/attribution</text>
    <text x="130" y="545" text-anchor="middle" class="cap" font-size="9">+ window error &amp; unhandledrejection</text>
    <text x="130" y="557" text-anchor="middle" class="cap" font-size="9">+ CSP violation reports</text>
    <text x="130" y="571" text-anchor="middle" class="cap" font-size="9" fill="#fbbf24">errors: sample at 100%</text>

    <rect x="240" y="482" width="196" height="96" rx="7" fill="#052e1a" stroke="#16a34a" stroke-width="2.5"/>
    <text x="338" y="500" text-anchor="middle" class="cap" font-size="10" font-weight="700" fill="#6ee7b7">flush</text>
    <text x="338" y="518" text-anchor="middle" class="mono" font-size="9" fill="#bbf7d0">visibilitychange → hidden</text>
    <text x="338" y="533" text-anchor="middle" class="mono" font-size="9" fill="#bbf7d0">navigator.sendBeacon(batch)</text>
    <text x="338" y="551" text-anchor="middle" class="cap" font-size="9" fill="#fca5a5">NEVER unload/beforeunload —</text>
    <text x="338" y="563" text-anchor="middle" class="cap" font-size="9" fill="#fca5a5">it disables the back/forward cache</text>
    <text x="338" y="574" text-anchor="middle" class="cap" font-size="8" fill="#94a3b8">(you'd slow the site down to measure it)</text>

    <rect x="460" y="482" width="294" height="96" rx="7" class="node" stroke="#2563eb"/>
    <text x="607" y="500" text-anchor="middle" class="cap" font-size="10" font-weight="700" fill="#93c5fd">pipeline → columnar store</text>
    <text x="607" y="516" text-anchor="middle" class="cap" font-size="9">strip PII &amp; tokens from URLs · templatize /product/8213 → /product/:id</text>
    <text x="607" y="529" text-anchor="middle" class="cap" font-size="9">filter bots · join on trace_id → one timeline, click to database</text>
    <text x="607" y="545" text-anchor="middle" class="cap" font-size="9" fill="#6ee7b7">aggregate p75 BY SEGMENT: route · device · country · ECT · build</text>
    <text x="607" y="559" text-anchor="middle" class="cap" font-size="9" fill="#fbbf24">need ≥1,000 samples per segment before a p75 means anything</text>
    <text x="607" y="572" text-anchor="middle" class="cap" font-size="9" fill="#fbbf24">1 beacon/page view: 10M views/day × 1 KB = 10 GB/day</text>

    <line x1="218" y1="530" x2="236" y2="530" stroke="#c4b5fd" stroke-width="2" marker-end="url(#rmB)"/>
    <line x1="438" y1="530" x2="456" y2="530" stroke="#6ee7b7" stroke-width="2" marker-end="url(#rmG)"/>

    <rect x="44" y="588" width="710" height="44" rx="7" fill="#3a0f12" stroke="#dc2626" stroke-width="2"/>
    <text x="399" y="605" text-anchor="middle" class="cap" font-size="10" fill="#fca5a5" font-weight="700">Read RUM with suspicion: ad blockers and consent rejections remove 10–30% of your sample, and the slowest users abandon before the beacon fires</text>
    <text x="399" y="622" text-anchor="middle" class="cap" font-size="9" fill="#fca5a5">so your field data is biased OPTIMISTIC — send an early TTFB/FCP beacon too, and reconcile page-view counts against server-side request counts</text>
  </g>

  <!-- ============ CALLOUT ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="654" width="728" height="42" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="390" y="674" text-anchor="middle" class="hd">Synthetic asks "did we break it?" · RUM asks "who does it hurt, and how much?" — you need both</text>
    <text x="390" y="689" text-anchor="middle" class="cap" fill="#5b21b6" font-size="10">Vodafone: 31% better LCP → +8% sales · rank fixes by population × gap-to-threshold, not by worst absolute number</text>
  </g>
</svg>
