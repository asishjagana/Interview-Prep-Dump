<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="objbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="objar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .nd{fill:#f8fafc;font-size:12px;font-weight:700}
      .cap{fill:#e2e8f0;font-size:11px}
      .lbl{fill:#94a3b8;font-size:11px}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="760" height="520" rx="16" fill="url(#objbg)"/>
  <text x="30" y="40" class="t">The blob pattern: pointer in the DB, bytes in object storage</text>
  <text x="30" y="62" class="sub">never stream large files through your app or database — hand out a URL and let the client talk to S3 directly</text>

  <!-- actors -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="30" y="90" width="120" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="90" y="118" text-anchor="middle" class="hd">Client</text>
    <text x="90" y="136" text-anchor="middle" class="lbl">browser / app</text>

    <rect x="320" y="90" width="120" height="60" rx="10" fill="#e0f2fe" stroke="#2563eb" stroke-width="2"/>
    <text x="380" y="118" text-anchor="middle" class="hd">App server</text>
    <text x="380" y="136" text-anchor="middle" class="lbl">issues presigned URL</text>

    <rect x="320" y="200" width="120" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="380" y="228" text-anchor="middle" class="hd">Database</text>
    <text x="380" y="246" text-anchor="middle" class="lbl">stores the KEY only</text>

    <rect x="600" y="90" width="130" height="170" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="665" y="116" text-anchor="middle" class="hd">Object store</text>
    <text x="665" y="134" text-anchor="middle" class="lbl">S3 / GCS / Azure Blob</text>
    <rect x="618" y="146" width="94" height="26" rx="4" fill="#34d399"/><text x="665" y="164" text-anchor="middle" class="nd" font-size="10">bucket</text>
    <text x="628" y="190" class="cap" font-size="10">key: uploads/</text>
    <text x="628" y="206" class="cap" font-size="10">u/42/photo.jpg</text>
    <text x="628" y="230" class="cap" font-size="10">→ opaque bytes</text>
    <text x="628" y="246" class="cap" font-size="10">flat namespace</text>
  </g>

  <!-- upload flow -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.5s" fill="freeze"/>
    <path d="M150 110 L318 110" stroke="#94a3b8" marker-end="url(#objar)"/>
    <text x="160" y="104" class="lbl">1. "I want to upload"</text>
    <path d="M320 128 L152 128" stroke="#34d399" marker-end="url(#objar)"/>
    <text x="160" y="146" class="lbl" fill="#6ee7b7">2. presigned PUT URL (expires 15m)</text>
  </g>

  <!-- direct upload -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.5s" fill="freeze"/>
    <path d="M120 150 C 120 340, 665 340, 665 262" stroke="#f59e0b" stroke-width="2.5" fill="none" marker-end="url(#objar)" stroke-dasharray="6 4">
      <animate attributeName="stroke-dashoffset" from="200" to="0" dur="1.5s" begin="1.8s" repeatCount="indefinite"/>
    </path>
    <text x="300" y="360" class="hd" fill="#fbbf24">3. client PUTs bytes DIRECTLY to S3 (bypasses app + DB)</text>
  </g>

  <!-- store pointer -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.5s" fill="freeze"/>
    <path d="M380 150 L380 198" stroke="#94a3b8" marker-end="url(#objar)"/>
    <text x="388" y="180" class="lbl">4. save key +</text>
    <text x="388" y="194" class="lbl">metadata row</text>
  </g>

  <!-- storage classes -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.6s" fill="freeze"/>
    <rect x="30" y="384" width="700" height="76" rx="10" fill="#0b1220" stroke="#475569" stroke-width="1.5"/>
    <text x="48" y="408" class="hd" fill="#e2e8f0">STORAGE CLASSES — lifecycle tiering cuts cost as data cools</text>
    <text x="48" y="430" class="cap" font-size="11">Standard (hot, ~$0.023/GB) → Infrequent Access → Glacier / Archive (~$0.004/GB, retrieval delay)</text>
    <text x="48" y="448" class="cap" font-size="11">Lifecycle rule: "move to IA after 30d, Glacier after 90d, delete after 1y" — set once, saves ~80%</text>
  </g>

  <!-- rule -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.6s" fill="freeze"/>
    <rect x="30" y="472" width="700" height="38" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="380" y="496" text-anchor="middle" class="hd">Blob → object storage · pointer → database · access → presigned URL</text>
  </g>
</svg>
