<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="dddbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="ddar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#fbbf24"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .ctx{stroke-width:2}
      .cl{fill:#0f172a;font-size:15px;font-weight:700}
      .field{fill:#e2e8f0;font-size:11px;font-family:monospace}
      .word{fill:#fbbf24;font-size:13px;font-weight:700;font-family:monospace}
      .note{fill:#94a3b8;font-size:12px}
      .cap{fill:#fbbf24;font-size:12px;font-weight:700;font-family:monospace}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="780" height="460" rx="16" fill="url(#dddbg)"/>
  <text x="30" y="40" class="t">Bounded Contexts — same word, different model</text>

  <!-- Sales context -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.5s" fill="freeze"/>
    <rect x="30" y="70" width="220" height="180" rx="12" fill="#dcfce7" class="ctx" stroke="#16a34a"/>
    <text x="140" y="96" text-anchor="middle" fill="#065f46" font-size="13" font-weight="700">SALES context</text>
    <rect x="52" y="112" width="176" height="120" rx="8" fill="#34d399" stroke="#059669"/>
    <text x="140" y="134" text-anchor="middle" class="word">Policy</text>
    <line x1="66" y1="144" x2="214" y2="144" stroke="#065f46" stroke-width="1"/>
    <text x="66" y="164" class="field">+ quotedPremium</text>
    <text x="66" y="184" class="field">+ salesRep</text>
    <text x="66" y="204" class="field">+ commissionRate</text>
    <text x="66" y="224" class="field">+ pipelineStage</text>
  </g>

  <!-- Claims context -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.5s" fill="freeze"/>
    <rect x="280" y="70" width="220" height="180" rx="12" fill="#e0f2fe" class="ctx" stroke="#2563eb"/>
    <text x="390" y="96" text-anchor="middle" fill="#1e3a5f" font-size="13" font-weight="700">CLAIMS context</text>
    <rect x="302" y="112" width="176" height="120" rx="8" fill="#60a5fa" stroke="#2563eb"/>
    <text x="390" y="134" text-anchor="middle" class="word">Policy</text>
    <line x1="316" y1="144" x2="464" y2="144" stroke="#1e3a5f" stroke-width="1"/>
    <text x="316" y="164" class="field">+ coverageLimit</text>
    <text x="316" y="184" class="field">+ deductible</text>
    <text x="316" y="204" class="field">+ exclusions[]</text>
    <text x="316" y="224" class="field">+ claimHistory[]</text>
  </g>

  <!-- Billing context -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.5s" fill="freeze"/>
    <rect x="530" y="70" width="220" height="180" rx="12" fill="#ede9fe" class="ctx" stroke="#7c3aed"/>
    <text x="640" y="96" text-anchor="middle" fill="#4c1d95" font-size="13" font-weight="700">BILLING context</text>
    <rect x="552" y="112" width="176" height="120" rx="8" fill="#a78bfa" stroke="#7c3aed"/>
    <text x="640" y="134" text-anchor="middle" class="word">Policy</text>
    <line x1="566" y1="144" x2="714" y2="144" stroke="#4c1d95" stroke-width="1"/>
    <text x="566" y="164" class="field">+ billingSchedule</text>
    <text x="566" y="184" class="field">+ amountDue</text>
    <text x="566" y="204" class="field">+ paymentMethod</text>
    <text x="566" y="224" class="field">+ dunningState</text>
  </g>

  <!-- context-mapping arrows -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.5s" fill="freeze"/>
    <path d="M250,300 L280,300" stroke="#fbbf24" stroke-width="2" marker-end="url(#ddar)"/>
    <path d="M500,300 L530,300" stroke="#fbbf24" stroke-width="2" marker-end="url(#ddar)"/>
    <rect x="30" y="284" width="220" height="34" rx="6" fill="#0b1220" stroke="#334155"/>
    <text x="140" y="305" text-anchor="middle" class="cap">policyId + event</text>
    <rect x="280" y="284" width="220" height="34" rx="6" fill="#0b1220" stroke="#334155"/>
    <text x="390" y="305" text-anchor="middle" class="cap">policyId + event</text>
    <rect x="530" y="284" width="220" height="34" rx="6" fill="#0b1220" stroke="#334155"/>
    <text x="640" y="305" text-anchor="middle" class="cap">policyId + event</text>
    <text x="140" y="340" text-anchor="middle" class="note">Context Map: contexts integrate via a shared ID + domain events</text>
  </g>

  <!-- caption panel -->
  <rect x="30" y="350" width="720" height="86" rx="10" fill="#0b1220" stroke="#334155" class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.6s" fill="freeze"/></rect>
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.6s" fill="freeze"/>
    <text x="46" y="376" fill="#f8fafc" font-size="14" font-weight="700">Same word, different model per context</text>
    <text x="46" y="398" class="note">Do NOT build one universal "Policy" class shared by all three — that re-couples the teams.</text>
    <text x="46" y="418" class="note" fill="#86efac">✓ Each context owns its own model &amp; data; they integrate by shared policyId + published domain events.</text>
  </g>
</svg>
