<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="rpcbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="rpcar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .cap{fill:#e2e8f0;font-size:11px}
      .lbl{fill:#f8fafc;font-size:12px;font-weight:700}
      .code{fill:#6ee7b7;font-size:11px;font-family:'Consolas',monospace}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="760" height="560" rx="16" fill="url(#rpcbg)"/>
  <text x="30" y="40" class="t">RPC: make a remote call LOOK local</text>
  <text x="30" y="62" class="sub">the stub hides marshalling + transport; the IDL (.thrift/.proto) is the shared contract, generating BOTH stubs</text>

  <!-- client + server round trip -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <!-- CLIENT -->
    <rect x="24" y="82" width="206" height="186" rx="10" fill="#0b1220" stroke="#2563eb" stroke-width="2"/>
    <text x="127" y="106" text-anchor="middle" class="hd" fill="#93c5fd">CLIENT (caller)</text>
    <text x="40" y="132" class="code">client.getUser(42)</text>
    <text x="40" y="150" class="cap" fill="#fbbf24">looks like a LOCAL function call</text>
    <rect x="40" y="164" width="174" height="86" rx="8" fill="#111c33" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="127" y="184" text-anchor="middle" class="lbl" fill="#93c5fd">CLIENT STUB (proxy)</text>
    <text x="52" y="204" class="cap">1. marshal args -> bytes</text>
    <text x="52" y="222" class="cap">4. unmarshal reply</text>
    <text x="52" y="240" class="cap" fill="#6ee7b7">   returns User to caller</text>
  </g>

  <!-- SERVER -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.5s" fill="freeze"/>
    <rect x="530" y="82" width="206" height="186" rx="10" fill="#0b1220" stroke="#16a34a" stroke-width="2"/>
    <text x="633" y="106" text-anchor="middle" class="hd" fill="#6ee7b7">SERVER (real func)</text>
    <rect x="546" y="118" width="174" height="86" rx="8" fill="#111c33" stroke="#16a34a" stroke-width="1.5"/>
    <text x="633" y="138" text-anchor="middle" class="lbl" fill="#6ee7b7">SERVER STUB (skeleton)</text>
    <text x="558" y="158" class="cap">2. unmarshal args</text>
    <text x="558" y="176" class="cap">3. marshal result -> bytes</text>
    <text x="558" y="196" class="cap" fill="#fbbf24">   dispatches to impl</text>
    <text x="546" y="228" class="code">User getUser(int id) { ... }</text>
    <text x="546" y="246" class="cap" fill="#6ee7b7">actual business logic runs here</text>
  </g>

  <!-- transport arrows -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.5s" fill="freeze"/>
    <line x1="234" y1="150" x2="524" y2="150" stroke="#94a3b8" stroke-width="2" marker-end="url(#rpcar)"/>
    <text x="379" y="142" text-anchor="middle" class="cap" fill="#fca5a5">request bytes over the network (transport)</text>
    <line x1="524" y1="196" x2="236" y2="196" stroke="#94a3b8" stroke-width="2" marker-end="url(#rpcar)"/>
    <text x="379" y="212" text-anchor="middle" class="cap" fill="#fca5a5">reply bytes back over the network</text>
    <!-- IDL contract chip -->
    <rect x="300" y="158" width="158" height="30" rx="8" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="379" y="177" text-anchor="middle" class="cap" fill="#c4b5fd">IDL contract = wire format + signatures</text>
  </g>

  <!-- IDL codegen band -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.5s" fill="freeze"/>
    <rect x="24" y="280" width="712" height="52" rx="10" fill="#0b1220" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="42" y="303" class="hd" fill="#c4b5fd">ONE .thrift / .proto file -> code generator -> BOTH stubs in every language</text>
    <text x="42" y="324" class="cap">contract-first: the IDL defines the service methods + message types; the compiler emits the client stub AND the server skeleton</text>
  </g>

  <!-- comparison strip -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.5s" fill="freeze"/>
    <rect x="24" y="344" width="171" height="128" rx="10" fill="#0b1220" stroke="#64748b" stroke-width="1.5"/>
    <text x="109" y="366" text-anchor="middle" class="lbl">JSON-RPC</text>
    <text x="38" y="388" class="cap">text (JSON)</text>
    <text x="38" y="406" class="cap">no strict schema</text>
    <text x="38" y="424" class="cap">over HTTP</text>
    <text x="38" y="442" class="cap" fill="#6ee7b7">simple, human-readable</text>
    <text x="38" y="460" class="cap" fill="#fca5a5">no streaming, verbose</text>

    <rect x="203" y="344" width="171" height="128" rx="10" fill="#0b1220" stroke="#16a34a" stroke-width="1.5"/>
    <text x="288" y="366" text-anchor="middle" class="lbl" fill="#6ee7b7">Thrift</text>
    <text x="217" y="388" class="cap">binary (compact)</text>
    <text x="217" y="406" class="cap">.thrift IDL</text>
    <text x="217" y="424" class="cap">pluggable transport</text>
    <text x="217" y="442" class="cap" fill="#6ee7b7">Facebook, many langs</text>
    <text x="217" y="460" class="cap" fill="#fbbf24">its own ecosystem</text>

    <rect x="382" y="344" width="171" height="128" rx="10" fill="#0b1220" stroke="#2563eb" stroke-width="1.5"/>
    <text x="467" y="366" text-anchor="middle" class="lbl" fill="#93c5fd">gRPC</text>
    <text x="396" y="388" class="cap">binary (protobuf)</text>
    <text x="396" y="406" class="cap">.proto IDL</text>
    <text x="396" y="424" class="cap">HTTP/2</text>
    <text x="396" y="442" class="cap" fill="#6ee7b7">Google, streaming</text>
    <text x="396" y="460" class="cap" fill="#fbbf24">needs proxy for web</text>

    <rect x="561" y="344" width="175" height="128" rx="10" fill="#0b1220" stroke="#d97706" stroke-width="1.5"/>
    <text x="648" y="366" text-anchor="middle" class="lbl" fill="#fbbf24">SOAP</text>
    <text x="575" y="388" class="cap">XML (heavy)</text>
    <text x="575" y="406" class="cap">WSDL contract</text>
    <text x="575" y="424" class="cap">HTTP, SMTP, TCP</text>
    <text x="575" y="442" class="cap" fill="#6ee7b7">enterprise, WS-Security</text>
    <text x="575" y="460" class="cap" fill="#fca5a5">bulky, slow</text>
  </g>

  <!-- bottom callout -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.5s" fill="freeze"/>
    <rect x="24" y="484" width="712" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="380" y="507" text-anchor="middle" class="hd">The stub hides marshalling + transport - but the network is NOT local</text>
    <text x="380" y="527" text-anchor="middle" class="cap" fill="#991b1b">Fallacies of Distributed Computing: the network is NOT reliable, zero-latency, or infinite-bandwidth - plan for partial failure, timeouts, retries</text>
  </g>
</svg>
