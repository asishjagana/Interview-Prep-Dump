<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="svfbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="svfar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .cap{fill:#e2e8f0;font-size:11px}
      .lbl{fill:#f8fafc;font-size:12px;font-weight:700}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="760" height="560" rx="16" fill="url(#svfbg)"/>
  <text x="30" y="40" class="t">Kafka Streams vs Flink: a library vs a cluster</text>
  <text x="30" y="62" class="sub">same job — running inside your app (Streams) vs. running as a managed dataflow cluster (Flink)</text>

  <!-- (A) DEPLOYMENT MODEL -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <!-- Kafka Streams -->
    <rect x="30" y="82" width="345" height="200" rx="10" fill="#0b1220" stroke="#16a34a" stroke-width="2.5"/>
    <text x="202" y="106" text-anchor="middle" class="hd" fill="#6ee7b7">KAFKA STREAMS = A LIBRARY (a .jar)</text>
    <text x="202" y="122" text-anchor="middle" class="cap" font-size="10">embedded inside YOUR app — no separate cluster</text>
    <rect x="48" y="134" width="90" height="40" rx="6" fill="#052e1a" stroke="#16a34a"/>
    <text x="93" y="151" text-anchor="middle" class="cap" font-size="10">app pod 1</text>
    <text x="93" y="166" text-anchor="middle" class="cap" font-size="9" fill="#6ee7b7">+streams jar</text>
    <rect x="146" y="134" width="90" height="40" rx="6" fill="#052e1a" stroke="#16a34a"/>
    <text x="191" y="151" text-anchor="middle" class="cap" font-size="10">app pod 2</text>
    <text x="191" y="166" text-anchor="middle" class="cap" font-size="9" fill="#6ee7b7">+streams jar</text>
    <rect x="244" y="134" width="90" height="40" rx="6" fill="#052e1a" stroke="#16a34a"/>
    <text x="289" y="151" text-anchor="middle" class="cap" font-size="10">app pod 3</text>
    <text x="289" y="166" text-anchor="middle" class="cap" font-size="9" fill="#6ee7b7">+streams jar</text>
    <text x="48" y="196" class="cap" fill="#6ee7b7">scales via CONSUMER-GROUP rebalancing</text>
    <text x="48" y="214" class="cap">state → local <tspan fill="#fbbf24">RocksDB</tspan> store, per instance</text>
    <text x="48" y="232" class="cap">backed by a compacted <tspan fill="#fbbf24">CHANGELOG</tspan> topic</text>
    <text x="48" y="250" class="cap" font-size="10">on failure → replay changelog to restore state</text>
    <text x="48" y="270" class="cap" font-size="10" fill="#93c5fd">Kafka-in / Kafka-out only · simplest ops</text>

    <!-- Flink -->
    <rect x="385" y="82" width="345" height="200" rx="10" fill="#0b1220" stroke="#2563eb" stroke-width="2.5"/>
    <text x="557" y="106" text-anchor="middle" class="hd" fill="#93c5fd">FLINK = A CLUSTER / FRAMEWORK</text>
    <text x="557" y="122" text-anchor="middle" class="cap" font-size="10">runs your job as a dataflow graph</text>
    <rect x="403" y="134" width="130" height="40" rx="6" fill="#0b1e3a" stroke="#2563eb"/>
    <text x="468" y="151" text-anchor="middle" class="cap" font-size="10">JobManager</text>
    <text x="468" y="166" text-anchor="middle" class="cap" font-size="9" fill="#93c5fd">coordinates</text>
    <rect x="541" y="134" width="86" height="40" rx="6" fill="#0b1e3a" stroke="#2563eb"/>
    <text x="584" y="157" text-anchor="middle" class="cap" font-size="10">TaskMgr 1</text>
    <rect x="633" y="134" width="86" height="40" rx="6" fill="#0b1e3a" stroke="#2563eb"/>
    <text x="676" y="157" text-anchor="middle" class="cap" font-size="10">TaskMgr 2</text>
    <text x="403" y="196" class="cap" fill="#93c5fd">state SNAPSHOTTED via CHECKPOINTS</text>
    <text x="403" y="214" class="cap">to durable storage → <tspan fill="#fbbf24">S3 / HDFS</tspan></text>
    <text x="403" y="232" class="cap">SAVEPOINTS for upgrades &amp; job migration</text>
    <text x="403" y="250" class="cap" font-size="10">many sources/sinks · rich event-time APIs</text>
    <text x="403" y="270" class="cap" font-size="10" fill="#6ee7b7">heavy stateful, low-latency, exactly-once</text>
  </g>

  <!-- (B) TIME & CORRECTNESS -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.5s" fill="freeze"/>
    <rect x="30" y="298" width="700" height="150" rx="10" fill="#0b1220" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="48" y="322" class="hd" fill="#c4b5fd">TIME &amp; CORRECTNESS — event time vs processing time, watermarks, late events</text>
    <!-- timeline axis -->
    <line x1="60" y1="372" x2="700" y2="372" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#svfar)"/>
    <text x="705" y="376" class="cap" font-size="9" fill="#94a3b8">time</text>
    <!-- on-time events -->
    <circle cx="120" cy="372" r="6" fill="#6ee7b7"/><circle cx="200" cy="372" r="6" fill="#6ee7b7"/><circle cx="300" cy="372" r="6" fill="#6ee7b7"/><circle cx="400" cy="372" r="6" fill="#6ee7b7"/>
    <text x="120" y="356" text-anchor="middle" class="cap" font-size="9">events arriving in event-time order</text>
    <!-- watermark -->
    <line x1="470" y1="352" x2="470" y2="392" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="4 3"/>
    <text x="470" y="406" text-anchor="middle" class="cap" font-size="10" fill="#fbbf24">WATERMARK</text>
    <text x="470" y="418" text-anchor="middle" class="cap" font-size="9" fill="#fbbf24">"event-time has reached here"</text>
    <!-- late event -->
    <circle cx="560" cy="372" r="7" fill="#fca5a5" stroke="#dc2626"/>
    <text x="600" y="356" class="cap" font-size="9" fill="#fca5a5">LATE EVENT (event-time &lt; watermark)</text>
    <text x="600" y="370" class="cap" font-size="9" fill="#fca5a5">→ dropped, or sent to a SIDE-OUTPUT</text>
    <text x="48" y="438" class="cap" font-size="10" fill="#c4b5fd">Flink's checkpoint barriers (Chandy-Lamport) + 2-phase-commit sinks = true end-to-end exactly-once.</text>
  </g>

  <!-- bottom callout -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.5s" fill="freeze"/>
    <rect x="30" y="462" width="700" height="78" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="380" y="486" text-anchor="middle" class="hd">Kafka Streams = a library you deploy like any app (Kafka-only, simplest ops)</text>
    <text x="380" y="508" text-anchor="middle" class="hd">Flink = a cluster for heavy stateful, event-time, exactly-once processing</text>
    <text x="380" y="528" text-anchor="middle" class="cap" fill="#166534">across many sources &amp; sinks · pick the tool by state size, sources, and latency needs</text>
  </g>
</svg>
