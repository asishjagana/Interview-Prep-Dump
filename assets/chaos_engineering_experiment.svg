<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 796" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="cha_bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="cha_arrowG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6ee7b7"/></marker>
    <marker id="cha_arrowR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#fca5a5"/></marker>
    <marker id="cha_arrowB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#93c5fd"/></marker>
    <marker id="cha_arrowP" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#c4b5fd"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .cap{fill:#e2e8f0;font-size:11px}
      .lbl{fill:#f8fafc;font-size:12px;font-weight:700}
      .mono{font-family:'Consolas','Courier New',monospace;font-size:10px;fill:#e2e8f0}
      .node{fill:#0b1220;stroke-width:2}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="780" height="796" rx="16" fill="url(#cha_bg)"/>
  <text x="30" y="38" class="t">Chaos Engineering — an experiment about your assumptions</text>
  <text x="30" y="58" class="sub">a hypothesis on a USER-visible metric · abort criteria declared first · the smallest blast radius that can still teach you something</text>

  <!-- ============ PANEL A: THE HYPOTHESIS LOOP ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="72" width="728" height="162" rx="10" fill="#0b1220" stroke="#2563eb" stroke-width="2.5"/>
    <text x="44" y="94" class="hd" fill="#93c5fd">A. THE EXPERIMENT LOOP — and the abort branch, which is the part that makes it engineering instead of vandalism</text>

    <rect x="40" y="106" width="100" height="46" rx="7" fill="#2e1065" stroke="#7c3aed" stroke-width="2"/>
    <text x="90" y="121" text-anchor="middle" class="lbl" font-size="10" fill="#c4b5fd">① STEADY STATE</text>
    <text x="90" y="134" text-anchor="middle" class="cap" font-size="8">orders/sec — not CPU</text>
    <text x="90" y="145" text-anchor="middle" class="cap" font-size="8">a USER-visible output</text>

    <rect x="156" y="106" width="100" height="46" rx="7" class="node" stroke="#2563eb"/>
    <text x="206" y="121" text-anchor="middle" class="lbl" font-size="10" fill="#93c5fd">② HYPOTHESIS</text>
    <text x="206" y="134" text-anchor="middle" class="cap" font-size="8">"p99 holds if X dies"</text>
    <text x="206" y="145" text-anchor="middle" class="cap" font-size="8">falsifiable, not vague</text>

    <rect x="272" y="106" width="100" height="46" rx="7" fill="#3a2a06" stroke="#d97706" stroke-width="2.5"/>
    <text x="322" y="121" text-anchor="middle" class="lbl" font-size="10" fill="#fbbf24">③ ABORT RULE</text>
    <text x="322" y="134" text-anchor="middle" class="cap" font-size="8" fill="#fbbf24">declared BEFORE inject</text>
    <text x="322" y="145" text-anchor="middle" class="cap" font-size="8" fill="#fbbf24">SLO burn · error rate</text>

    <rect x="388" y="106" width="100" height="46" rx="7" class="node" stroke="#2563eb"/>
    <text x="438" y="121" text-anchor="middle" class="lbl" font-size="10" fill="#93c5fd">④ INJECT</text>
    <text x="438" y="134" text-anchor="middle" class="cap" font-size="8">smallest blast radius</text>
    <text x="438" y="145" text-anchor="middle" class="cap" font-size="8">daylight · humans on</text>

    <rect x="504" y="106" width="100" height="46" rx="7" class="node" stroke="#2563eb"/>
    <text x="554" y="121" text-anchor="middle" class="lbl" font-size="10" fill="#93c5fd">⑤ OBSERVE</text>
    <text x="554" y="134" text-anchor="middle" class="cap" font-size="8">did the metric move?</text>
    <text x="554" y="145" text-anchor="middle" class="cap" font-size="8">vs the control group</text>

    <rect x="620" y="106" width="100" height="46" rx="7" fill="#052e1a" stroke="#16a34a" stroke-width="2.5"/>
    <text x="670" y="121" text-anchor="middle" class="lbl" font-size="10" fill="#6ee7b7">⑥ LEARN or FIX</text>
    <text x="670" y="134" text-anchor="middle" class="cap" font-size="8" fill="#6ee7b7">then AUTOMATE it</text>
    <text x="670" y="145" text-anchor="middle" class="cap" font-size="8" fill="#6ee7b7">as a regression test</text>

    <line x1="142" y1="129" x2="154" y2="129" stroke="#93c5fd" stroke-width="1.8" marker-end="url(#cha_arrowB)"/>
    <line x1="258" y1="129" x2="270" y2="129" stroke="#93c5fd" stroke-width="1.8" marker-end="url(#cha_arrowB)"/>
    <line x1="374" y1="129" x2="386" y2="129" stroke="#93c5fd" stroke-width="1.8" marker-end="url(#cha_arrowB)"/>
    <line x1="490" y1="129" x2="502" y2="129" stroke="#93c5fd" stroke-width="1.8" marker-end="url(#cha_arrowB)"/>
    <line x1="606" y1="129" x2="618" y2="129" stroke="#93c5fd" stroke-width="1.8" marker-end="url(#cha_arrowB)"/>

    <!-- abort branch: the animated dashes are the point — this path must be able to fire at any moment -->
    <polyline points="554,152 554,168" fill="none" stroke="#fca5a5" stroke-width="2" marker-end="url(#cha_arrowR)"/>
    <rect x="300" y="168" width="440" height="34" rx="7" fill="#3a0f12" stroke="#dc2626" stroke-width="2.5"/>
    <text x="520" y="182" text-anchor="middle" class="cap" font-size="9" fill="#fca5a5" font-weight="700">⛔ ABORT — the pre-declared threshold trips (SLO burn rate, error rate, saturation)</text>
    <text x="520" y="195" text-anchor="middle" class="cap" font-size="8.5" fill="#fecaca">kill switch VERIFIED before injection · must NOT depend on the thing you are breaking</text>
    <polyline points="300,185 90,185 90,154" fill="none" stroke="#fca5a5" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#cha_arrowR)">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/>
    </polyline>

    <rect x="40" y="206" width="700" height="22" rx="6" fill="#052e1a" stroke="#16a34a" stroke-width="1.6"/>
    <text x="390" y="220" text-anchor="middle" class="cap" font-size="9" fill="#6ee7b7">⑥ feeds back into ① — a passing experiment gets AUTOMATED and runs continuously, because a weakness you fixed once but never re-test will regress</text>
  </g>

  <!-- ============ PANEL B: FAULT TAXONOMY → WHAT EACH ONE UNIQUELY REVEALS ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="244" width="728" height="250" rx="10" fill="#0b1220" stroke="#d97706" stroke-width="2.5"/>
    <text x="44" y="266" class="hd" fill="#fbbf24">B. THE FAULT TAXONOMY — each fault reveals a DIFFERENT weakness, so pick the fault that tests your actual hypothesis</text>

    <rect x="38" y="276" width="150" height="24" rx="5" fill="#3a2a06" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="113" y="292" text-anchor="middle" class="cap" font-size="8.5" fill="#fde68a" font-weight="700">★ LATENCY INJECTION</text>
    <text x="194" y="287" class="cap" font-size="8.5" fill="#fde68a">a slow dependency exhausts thread and</text>
    <text x="194" y="298" class="cap" font-size="8.5" fill="#fde68a">connection pools → cascade. HIGHEST YIELD.</text>

    <rect x="38" y="304" width="150" height="24" rx="5" class="node" stroke="#334155"/>
    <text x="113" y="320" text-anchor="middle" class="cap" font-size="8.5" font-weight="700">INSTANCE / POD KILL</text>
    <text x="194" y="315" class="cap" font-size="8.5">does the replacement actually come up, and</text>
    <text x="194" y="326" class="cap" font-size="8.5">is state really externalised off the node?</text>

    <rect x="38" y="332" width="150" height="24" rx="5" class="node" stroke="#334155"/>
    <text x="113" y="348" text-anchor="middle" class="cap" font-size="8.5" font-weight="700">ERROR / EXCEPTION</text>
    <text x="194" y="343" class="cap" font-size="8.5">does the caller degrade gracefully, or pass</text>
    <text x="194" y="354" class="cap" font-size="8.5">the 500 straight through to the user?</text>

    <rect x="38" y="360" width="150" height="24" rx="5" class="node" stroke="#334155"/>
    <text x="113" y="376" text-anchor="middle" class="cap" font-size="8.5" font-weight="700">RESOURCE PRESSURE</text>
    <text x="194" y="371" class="cap" font-size="8.5">CPU · memory · disk-fill · IO — the health</text>
    <text x="194" y="382" class="cap" font-size="8.5">check says OK while the process is useless</text>

    <rect x="38" y="388" width="150" height="24" rx="5" class="node" stroke="#334155"/>
    <text x="113" y="404" text-anchor="middle" class="cap" font-size="8.5" font-weight="700">PARTITION / PKT LOSS</text>
    <text x="194" y="399" class="cap" font-size="8.5">split brain, quorum loss, and TCP retransmit</text>
    <text x="194" y="410" class="cap" font-size="8.5">stalls that look like hangs, not errors</text>

    <rect x="38" y="416" width="150" height="24" rx="5" class="node" stroke="#334155"/>
    <text x="113" y="432" text-anchor="middle" class="cap" font-size="8.5" font-weight="700">DNS FAILURE</text>
    <text x="194" y="427" class="cap" font-size="8.5">TTLs plus negative caching turn a 30-second</text>
    <text x="194" y="438" class="cap" font-size="8.5">failover into a 30-minute outage</text>

    <rect x="396" y="276" width="150" height="24" rx="5" class="node" stroke="#dc2626"/>
    <text x="471" y="292" text-anchor="middle" class="cap" font-size="8.5" fill="#fca5a5" font-weight="700">BROWNOUT vs BLACKOUT</text>
    <text x="552" y="287" class="cap" font-size="8.5" fill="#fecaca">10% errors is HARDER than 100%: retries stay</text>
    <text x="552" y="298" class="cap" font-size="8.5" fill="#fecaca">alive and amplify the offered load 3–5×</text>

    <rect x="396" y="304" width="150" height="24" rx="5" class="node" stroke="#334155"/>
    <text x="471" y="320" text-anchor="middle" class="cap" font-size="8.5" font-weight="700">CLOCK SKEW</text>
    <text x="552" y="315" class="cap" font-size="8.5">token expiry, TLS validity windows, leases</text>
    <text x="552" y="326" class="cap" font-size="8.5">and leader-election timeouts</text>

    <rect x="396" y="332" width="150" height="24" rx="5" class="node" stroke="#334155"/>
    <text x="471" y="348" text-anchor="middle" class="cap" font-size="8.5" font-weight="700">CERTIFICATE EXPIRY</text>
    <text x="552" y="343" class="cap" font-size="8.5">is renewal really automated — and has the</text>
    <text x="552" y="354" class="cap" font-size="8.5">expiry alert itself ever actually fired?</text>

    <rect x="396" y="360" width="150" height="24" rx="5" class="node" stroke="#334155"/>
    <text x="471" y="376" text-anchor="middle" class="cap" font-size="8.5" font-weight="700">AZ / REGION EVACUATE</text>
    <text x="552" y="371" class="cap" font-size="8.5">capacity math: can the surviving 2 of 3 AZs</text>
    <text x="552" y="382" class="cap" font-size="8.5">absorb 100% of traffic, or do they fall over?</text>

    <rect x="396" y="388" width="150" height="24" rx="5" class="node" stroke="#334155"/>
    <text x="471" y="404" text-anchor="middle" class="cap" font-size="8.5" font-weight="700">CACHE FLUSH</text>
    <text x="552" y="399" class="cap" font-size="8.5">thundering herd onto a cold origin — can the</text>
    <text x="552" y="410" class="cap" font-size="8.5">database survive a 0% hit rate for a minute?</text>

    <rect x="396" y="416" width="150" height="24" rx="5" class="node" stroke="#334155"/>
    <text x="471" y="432" text-anchor="middle" class="cap" font-size="8.5" font-weight="700">"NON-CRITICAL" DEP</text>
    <text x="552" y="427" class="cap" font-size="8.5">the recommendations call turns out to sit in</text>
    <text x="552" y="438" class="cap" font-size="8.5">the SYNCHRONOUS critical path after all</text>

    <rect x="38" y="450" width="704" height="36" rx="7" fill="#3a2a06" stroke="#d97706" stroke-width="2"/>
    <text x="390" y="465" text-anchor="middle" class="cap" font-size="9.5" fill="#fde68a" font-weight="700">Termination is the famous fault. LATENCY is the productive one — a dead dependency fails fast, a slow one holds every worker hostage.</text>
    <text x="390" y="478" text-anchor="middle" class="cap" font-size="8.5" fill="#fde68a">1 s of added latency on a 200-thread pool at 300 rps means the pool is 100% occupied and the whole service stops answering anything</text>
  </g>

  <!-- ============ PANEL C: THE BLAST-RADIUS LADDER ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="504" width="728" height="222" rx="10" fill="#0b1220" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="44" y="526" class="hd" fill="#c4b5fd">C. THE BLAST-RADIUS LADDER — climb one rung only when the guardrails at the current rung have actually been exercised</text>

    <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.35s" fill="freeze"/>
      <rect x="38" y="596" width="92" height="36" rx="6" class="node" stroke="#16a34a"/>
      <text x="84" y="611" text-anchor="middle" class="cap" font-size="8.5" fill="#6ee7b7" font-weight="700">DEV / LOCAL</text>
      <text x="84" y="623" text-anchor="middle" class="cap" font-size="8">synthetic load</text>
    </g>
    <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.35s" fill="freeze"/>
      <rect x="140" y="586" width="92" height="36" rx="6" class="node" stroke="#16a34a"/>
      <text x="186" y="601" text-anchor="middle" class="cap" font-size="8.5" fill="#6ee7b7" font-weight="700">STAGING</text>
      <text x="186" y="613" text-anchor="middle" class="cap" font-size="8">0 real users</text>
    </g>
    <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.35s" fill="freeze"/>
      <rect x="242" y="576" width="92" height="36" rx="6" class="node" stroke="#2563eb"/>
      <text x="288" y="591" text-anchor="middle" class="cap" font-size="8.5" fill="#93c5fd" font-weight="700">1 CANARY POD</text>
      <text x="288" y="603" text-anchor="middle" class="cap" font-size="8">1 of N replicas</text>
    </g>
    <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.35s" fill="freeze"/>
      <rect x="344" y="566" width="92" height="36" rx="6" class="node" stroke="#2563eb"/>
      <text x="390" y="581" text-anchor="middle" class="cap" font-size="8.5" fill="#93c5fd" font-weight="700">1% OF TRAFFIC</text>
      <text x="390" y="593" text-anchor="middle" class="cap" font-size="8">canary + control</text>
    </g>
    <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.35s" fill="freeze"/>
      <rect x="446" y="556" width="92" height="36" rx="6" class="node" stroke="#d97706"/>
      <text x="492" y="571" text-anchor="middle" class="cap" font-size="8.5" fill="#fbbf24" font-weight="700">ONE AZ</text>
      <text x="492" y="583" text-anchor="middle" class="cap" font-size="8">1/3 of a region</text>
    </g>
    <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.35s" fill="freeze"/>
      <rect x="548" y="546" width="92" height="36" rx="6" class="node" stroke="#d97706"/>
      <text x="594" y="561" text-anchor="middle" class="cap" font-size="8.5" fill="#fbbf24" font-weight="700">ONE CELL</text>
      <text x="594" y="573" text-anchor="middle" class="cap" font-size="8">bounded tenants</text>
    </g>
    <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="3.3s" dur="0.35s" fill="freeze"/>
      <rect x="650" y="536" width="92" height="36" rx="6" fill="#3a0f12" stroke="#dc2626" stroke-width="2.5"/>
      <text x="696" y="551" text-anchor="middle" class="cap" font-size="8.5" fill="#fca5a5" font-weight="700">ONE REGION</text>
      <text x="696" y="563" text-anchor="middle" class="cap" font-size="8" fill="#fca5a5">evacuation drill</text>
    </g>

    <line x1="130" y1="612" x2="138" y2="606" stroke="#c4b5fd" stroke-width="1.6" marker-end="url(#cha_arrowP)"/>
    <line x1="232" y1="602" x2="240" y2="596" stroke="#c4b5fd" stroke-width="1.6" marker-end="url(#cha_arrowP)"/>
    <line x1="334" y1="592" x2="342" y2="586" stroke="#c4b5fd" stroke-width="1.6" marker-end="url(#cha_arrowP)"/>
    <line x1="436" y1="582" x2="444" y2="576" stroke="#c4b5fd" stroke-width="1.6" marker-end="url(#cha_arrowP)"/>
    <line x1="538" y1="572" x2="546" y2="566" stroke="#c4b5fd" stroke-width="1.6" marker-end="url(#cha_arrowP)"/>
    <line x1="640" y1="562" x2="648" y2="556" stroke="#c4b5fd" stroke-width="1.6" marker-end="url(#cha_arrowP)"/>

    <rect x="38" y="642" width="704" height="30" rx="6" class="node" stroke="#d97706"/>
    <text x="390" y="656" text-anchor="middle" class="cap" font-size="8.5" fill="#fbbf24">EVERY RUNG: a kill switch tested first · abort criteria pre-declared as an SLO burn rate · an AUTOMATIC halt (AWS FIS stop condition on a CloudWatch alarm)</text>
    <text x="390" y="667" text-anchor="middle" class="cap" font-size="8.5">from rung 4 up you also need a CANARY plus an identical CONTROL — without a control group you cannot tell your fault from ordinary variance</text>

    <rect x="38" y="678" width="704" height="40" rx="7" fill="#0c2b3f" stroke="#2563eb" stroke-width="2"/>
    <text x="390" y="692" text-anchor="middle" class="cap" font-size="9" fill="#93c5fd" font-weight="700">NETFLIX ChAP (Chaos Automation Platform) — the industrialised version of rung 4</text>
    <text x="390" y="704" text-anchor="middle" class="cap" font-size="8.5" fill="#bfdbfe">route a small % of traffic into a CANARY cluster and an identical CONTROL cluster · inject the fault ONLY into the canary</text>
    <text x="390" y="715" text-anchor="middle" class="cap" font-size="8.5" fill="#bfdbfe">then compare the BUSINESS metric (stream starts per second) ⇒ statistically interpretable, and the exposure is bounded to that slice</text>
  </g>

  <!-- ============ CALLOUT ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="3.6s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="736" width="728" height="44" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="390" y="757" text-anchor="middle" class="hd">Every retry, timeout, circuit breaker, replica and failover in your design is an UNTESTED CLAIM until something exercises it.</text>
    <text x="390" y="772" text-anchor="middle" class="cap" fill="#5b21b6" font-size="10">failover code is the least-tested code in production — and it only ever runs when you are already in trouble</text>
  </g>
</svg>
