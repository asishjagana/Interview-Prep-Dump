<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="osibg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="osiar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .cap{fill:#e2e8f0;font-size:11px}
      .lbl{fill:#f8fafc;font-size:12px;font-weight:700}
      .lname{font-size:13px;font-weight:800}
      .det{fill:#cbd5e1;font-size:10px}
      .pdu{fill:#0f172a;font-size:10px;font-weight:800}
      .seg{fill:#f8fafc;font-size:9px;font-weight:700}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="760" height="560" rx="16" fill="url(#osibg)"/>
  <text x="30" y="34" class="t">OSI 7-layer model mapped to the TCP/IP stack</text>
  <text x="30" y="54" class="sub">a labeled stack + how data is encapsulated going down — the shared vocabulary for "where does this happen?"</text>

  <!-- column headers -->
  <text x="34" y="76" class="cap" fill="#94a3b8" font-weight="700">OSI LAYER · PROTOCOL · DEVICE</text>
  <text x="300" y="76" class="cap" fill="#94a3b8" font-weight="700">PDU / TCP-IP</text>
  <text x="440" y="76" class="cap" fill="#94a3b8" font-weight="700">ENCAPSULATION — headers added going DOWN, stripped going UP</text>

  <!-- L7 Application -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="30" y="84" width="255" height="48" rx="8" fill="#0b1220" stroke="#2563eb" stroke-width="2"/>
    <text x="44" y="104" class="lname" fill="#93c5fd">L7 · Application</text>
    <text x="44" y="123" class="det">HTTP · DNS · gRPC · app / L7 load balancer</text>
    <rect x="300" y="92" width="78" height="20" rx="5" fill="#93c5fd"/><text x="339" y="106" text-anchor="middle" class="pdu">DATA</text>
    <text x="300" y="127" class="det" fill="#93c5fd">TCP/IP: Application</text>
    <rect x="440" y="96" width="96" height="24" rx="4" fill="#16a34a"/><text x="488" y="112" text-anchor="middle" class="seg">DATA (App)</text>
    <text x="546" y="112" class="det" fill="#f87171">&#9668; L7 LB reads URL / headers / cookies</text>
  </g>

  <!-- L6 Presentation -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.5s" fill="freeze"/>
    <rect x="30" y="138" width="255" height="48" rx="8" fill="#0b1220" stroke="#3b82f6" stroke-width="2"/>
    <text x="44" y="158" class="lname" fill="#93c5fd">L6 · Presentation</text>
    <text x="44" y="177" class="det">encoding · compression · TLS encrypt/decrypt</text>
    <rect x="300" y="146" width="78" height="20" rx="5" fill="#93c5fd"/><text x="339" y="160" text-anchor="middle" class="pdu">DATA</text>
    <text x="300" y="181" class="det" fill="#93c5fd">TCP/IP: Application</text>
    <text x="440" y="166" class="det" fill="#fbbf24">TLS lives around here (L5&#8211;6-ish): wraps the app data before transport</text>
  </g>

  <!-- L5 Session -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.5s" fill="freeze"/>
    <rect x="30" y="192" width="255" height="48" rx="8" fill="#0b1220" stroke="#60a5fa" stroke-width="2"/>
    <text x="44" y="212" class="lname" fill="#93c5fd">L5 · Session</text>
    <text x="44" y="231" class="det">open / manage / close conversations · sockets</text>
    <rect x="300" y="200" width="78" height="20" rx="5" fill="#93c5fd"/><text x="339" y="214" text-anchor="middle" class="pdu">DATA</text>
    <text x="300" y="235" class="det" fill="#93c5fd">TCP/IP: Application</text>
    <text x="440" y="220" class="det" fill="#94a3b8">(TCP/IP folds L5&#8211;L7 into one "Application" layer)</text>
  </g>

  <!-- L4 Transport -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.5s" fill="freeze"/>
    <rect x="30" y="246" width="255" height="48" rx="8" fill="#0b1220" stroke="#16a34a" stroke-width="2.5"/>
    <text x="44" y="266" class="lname" fill="#6ee7b7">L4 · Transport</text>
    <text x="44" y="285" class="det">TCP / UDP · ports · firewall / L4 load balancer</text>
    <rect x="300" y="254" width="78" height="20" rx="5" fill="#6ee7b7"/><text x="339" y="268" text-anchor="middle" class="pdu">SEGMENT</text>
    <text x="300" y="289" class="det" fill="#6ee7b7">TCP/IP: Transport</text>
    <rect x="440" y="258" width="44" height="24" rx="4" fill="#0ea5e9"/><text x="462" y="274" text-anchor="middle" class="seg">TCP</text>
    <rect x="486" y="258" width="80" height="24" rx="4" fill="#16a34a"/><text x="526" y="274" text-anchor="middle" class="seg">DATA</text>
    <text x="574" y="274" class="det" fill="#f87171">&#9668; L4 LB routes by IP:port only</text>
  </g>

  <!-- L3 Network -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.5s" fill="freeze"/>
    <rect x="30" y="300" width="255" height="48" rx="8" fill="#0b1220" stroke="#d97706" stroke-width="2.5"/>
    <text x="44" y="320" class="lname" fill="#fbbf24">L3 · Network</text>
    <text x="44" y="339" class="det">IP · ICMP · addressing &amp; routing · router</text>
    <rect x="300" y="308" width="78" height="20" rx="5" fill="#fbbf24"/><text x="339" y="322" text-anchor="middle" class="pdu">PACKET</text>
    <text x="300" y="343" class="det" fill="#fbbf24">TCP/IP: Internet</text>
    <rect x="440" y="312" width="40" height="24" rx="4" fill="#d97706"/><text x="460" y="328" text-anchor="middle" class="seg">IP</text>
    <rect x="482" y="312" width="40" height="24" rx="4" fill="#0ea5e9"/><text x="502" y="328" text-anchor="middle" class="seg">TCP</text>
    <rect x="524" y="312" width="70" height="24" rx="4" fill="#16a34a"/><text x="559" y="328" text-anchor="middle" class="seg">DATA</text>
    <text x="602" y="328" class="det" fill="#94a3b8">= PACKET</text>
  </g>

  <!-- L2 Data Link -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.5s" fill="freeze"/>
    <rect x="30" y="354" width="255" height="48" rx="8" fill="#0b1220" stroke="#7c3aed" stroke-width="2"/>
    <text x="44" y="374" class="lname" fill="#c4b5fd">L2 · Data Link</text>
    <text x="44" y="393" class="det">Ethernet · MAC address · frames · switch</text>
    <rect x="300" y="362" width="78" height="20" rx="5" fill="#c4b5fd"/><text x="339" y="376" text-anchor="middle" class="pdu">FRAME</text>
    <text x="300" y="397" class="det" fill="#c4b5fd">TCP/IP: Link</text>
    <rect x="440" y="366" width="36" height="24" rx="4" fill="#7c3aed"/><text x="458" y="382" text-anchor="middle" class="seg">ETH</text>
    <rect x="478" y="366" width="30" height="24" rx="4" fill="#d97706"/><text x="493" y="382" text-anchor="middle" class="seg">IP</text>
    <rect x="510" y="366" width="34" height="24" rx="4" fill="#0ea5e9"/><text x="527" y="382" text-anchor="middle" class="seg">TCP</text>
    <rect x="546" y="366" width="52" height="24" rx="4" fill="#16a34a"/><text x="572" y="382" text-anchor="middle" class="seg">DATA</text>
    <rect x="600" y="366" width="34" height="24" rx="4" fill="#7c3aed"/><text x="617" y="382" text-anchor="middle" class="seg">FCS</text>
    <text x="642" y="382" class="det" fill="#94a3b8">= FRAME</text>
  </g>

  <!-- L1 Physical -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.5s" fill="freeze"/>
    <rect x="30" y="408" width="255" height="48" rx="8" fill="#0b1220" stroke="#64748b" stroke-width="2"/>
    <text x="44" y="428" class="lname" fill="#cbd5e1">L1 · Physical</text>
    <text x="44" y="447" class="det">cables · fiber · radio · voltages · hub / NIC</text>
    <rect x="300" y="416" width="78" height="20" rx="5" fill="#cbd5e1"/><text x="339" y="430" text-anchor="middle" class="pdu">BITS</text>
    <text x="300" y="451" class="det" fill="#cbd5e1">TCP/IP: Link</text>
    <text x="440" y="433" class="seg" fill="#64748b" font-size="12" letter-spacing="2">0101 0110 1001 1100 0011 &#8594;</text>
    <text x="440" y="450" class="det" fill="#94a3b8">signals on the wire / in the air</text>
  </g>

  <!-- callout -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.5s" fill="freeze"/>
    <rect x="30" y="470" width="700" height="72" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="380" y="493" text-anchor="middle" class="hd">Each layer only talks to the one directly above and below it.</text>
    <text x="380" y="513" text-anchor="middle" class="cap" fill="#166534">Going DOWN the sender: every layer wraps the payload in its own header (encapsulation). Going UP the receiver: every layer strips its header (decapsulation).</text>
    <text x="380" y="531" text-anchor="middle" class="cap" fill="#166534">The internet actually runs on TCP/IP (4 layers), but OSI (7 layers) is the vocabulary everyone shares: "it's a layer-3 problem", "L4 vs L7 LB".</text>
  </g>
</svg>
