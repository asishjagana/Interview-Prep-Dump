<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="obg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="oarR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#fca5a5"/></marker>
    <marker id="oarG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6ee7b7"/></marker>
    <marker id="oarB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#93c5fd"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .cap{fill:#e2e8f0;font-size:11px}
      .mut{fill:#94a3b8;font-size:10px}
      .lbl{fill:#f8fafc;font-size:12px;font-weight:700}
      .node{fill:#0b1220;stroke-width:2}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="760" height="600" rx="16" fill="url(#obg)"/>
  <text x="30" y="40" class="t">Transactional Outbox &amp; Inbox (the dual-write problem)</text>
  <text x="30" y="62" class="sub">no distributed txn spans DB + broker — so write both the row and the event in ONE local txn, then relay</text>

  <!-- ============ TOP: THE DUAL-WRITE PROBLEM (RED) ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="80" width="708" height="212" rx="10" fill="#0b1220" stroke="#dc2626" stroke-width="2.5"/>
    <text x="44" y="104" class="hd" fill="#fca5a5">A. THE DUAL-WRITE PROBLEM — two separate writes, no shared transaction</text>

    <!-- service -->
    <rect x="44" y="124" width="120" height="52" rx="8" class="node" stroke="#dc2626"/>
    <text x="104" y="146" text-anchor="middle" class="lbl" font-size="12">Service</text>
    <text x="104" y="164" text-anchor="middle" class="mut">handle request</text>

    <!-- DB -->
    <rect x="250" y="118" width="130" height="44" rx="8" class="node" stroke="#16a34a"/>
    <text x="315" y="139" text-anchor="middle" class="lbl" font-size="12">1. write DB</text>
    <text x="315" y="155" text-anchor="middle" class="cap" fill="#6ee7b7">committed &#10003;</text>

    <!-- broker -->
    <rect x="250" y="180" width="130" height="44" rx="8" class="node" stroke="#dc2626"/>
    <text x="315" y="201" text-anchor="middle" class="lbl" font-size="12">2. publish event</text>
    <text x="315" y="217" text-anchor="middle" class="cap" fill="#fca5a5">crash before send &#10007;</text>

    <!-- arrows -->
    <line x1="164" y1="142" x2="248" y2="140" stroke="#6ee7b7" stroke-width="2" marker-end="url(#oarG)"/>
    <line x1="164" y1="158" x2="248" y2="200" stroke="#fca5a5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#oarR)"/>

    <!-- divergence -->
    <rect x="452" y="118" width="264" height="106" rx="8" fill="#1a1220" stroke="#dc2626" stroke-width="2"/>
    <text x="584" y="140" text-anchor="middle" class="lbl" fill="#fca5a5" font-size="12">STATE &#8800; EVENTS (diverged)</text>
    <text x="468" y="162" class="cap">DB says: Order created</text>
    <text x="468" y="182" class="cap" fill="#fca5a5">Broker: no OrderCreated event</text>
    <text x="468" y="204" class="mut">downstream never ships the order</text>
    <line x1="380" y1="140" x2="450" y2="150" stroke="#6ee7b7" stroke-width="1.8" marker-end="url(#oarG)"/>
    <line x1="380" y1="202" x2="450" y2="188" stroke="#fca5a5" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#oarR)"/>

    <text x="44" y="252" class="cap" fill="#fca5a5">&#10007; 2PC/XA across DB + broker is slow, blocking, and often unsupported by the broker</text>
    <text x="44" y="272" class="cap" fill="#fbbf24">~ retry-after-commit can double-publish; publish-then-commit can lose the DB write — either way, inconsistent</text>
  </g>

  <!-- ============ BOTTOM: THE OUTBOX FIX (GREEN) ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="304" width="708" height="222" rx="10" fill="#0b1220" stroke="#16a34a" stroke-width="2.5"/>
    <text x="44" y="328" class="hd" fill="#6ee7b7">B. THE OUTBOX FIX — one local txn writes row + outbox row atomically; a relay publishes; inbox dedupes</text>

    <!-- single local txn box -->
    <rect x="44" y="344" width="184" height="150" rx="8" fill="#0d1a12" stroke="#16a34a" stroke-width="2"/>
    <text x="136" y="366" text-anchor="middle" class="lbl" fill="#6ee7b7" font-size="12">ONE LOCAL TRANSACTION</text>
    <rect x="60" y="378" width="152" height="44" rx="6" class="node" stroke="#334155"/>
    <text x="136" y="399" text-anchor="middle" class="cap">INSERT orders (row)</text>
    <text x="136" y="415" text-anchor="middle" class="mut">business state</text>
    <rect x="60" y="432" width="152" height="46" rx="6" class="node" stroke="#16a34a"/>
    <text x="136" y="453" text-anchor="middle" class="cap" fill="#6ee7b7">INSERT outbox (event)</text>
    <text x="136" y="469" text-anchor="middle" class="mut">OrderCreated + msg-id</text>

    <!-- relay -->
    <rect x="262" y="386" width="118" height="60" rx="8" class="node" stroke="#2563eb"/>
    <text x="321" y="408" text-anchor="middle" class="lbl" fill="#93c5fd" font-size="12">Message Relay</text>
    <text x="321" y="425" text-anchor="middle" class="mut">CDC (WAL tail)</text>
    <text x="321" y="439" text-anchor="middle" class="mut">or poller</text>
    <line x1="228" y1="455" x2="260" y2="430" stroke="#6ee7b7" stroke-width="2" marker-end="url(#oarG)"/>
    <text x="238" y="470" class="mut" font-size="9">reads outbox</text>

    <!-- broker -->
    <rect x="414" y="386" width="104" height="60" rx="8" class="node" stroke="#7c3aed"/>
    <text x="466" y="412" text-anchor="middle" class="lbl" fill="#c4b5fd" font-size="12">Broker</text>
    <text x="466" y="430" text-anchor="middle" class="mut">Kafka topic</text>
    <line x1="380" y1="416" x2="412" y2="416" stroke="#93c5fd" stroke-width="2" marker-end="url(#oarB)"/>
    <text x="374" y="378" class="mut" font-size="9">publish &#8805;1x</text>

    <!-- inbox / consumer -->
    <rect x="552" y="386" width="164" height="60" rx="8" class="node" stroke="#16a34a"/>
    <text x="634" y="408" text-anchor="middle" class="lbl" fill="#6ee7b7" font-size="12">Consumer Inbox</text>
    <text x="634" y="425" text-anchor="middle" class="mut">seen msg-id? skip : process</text>
    <text x="634" y="439" text-anchor="middle" class="mut">dedupe &#8594; effective exactly-once</text>
    <line x1="518" y1="416" x2="550" y2="416" stroke="#93c5fd" stroke-width="2" marker-end="url(#oarB)"/>

    <text x="44" y="514" class="cap" fill="#6ee7b7">&#10003; row + event commit together (atomic) &#8226; relay guarantees the event is eventually published &#8226; inbox absorbs duplicates</text>
  </g>

  <!-- ============ BOTTOM CALLOUT ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="538" width="708" height="50" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="380" y="560" text-anchor="middle" class="hd">One local txn makes state + event atomic; the relay publishes at-least-once; the idempotent inbox dedupes.</text>
    <text x="380" y="578" text-anchor="middle" class="cap" fill="#5b21b6" font-size="10">Outbox removes the dual write on the producer; Inbox removes duplicate effects on the consumer.</text>
  </g>
</svg>
