<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="vecbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="vecar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .nd{fill:#f8fafc;font-size:11px;font-weight:700}
      .cap{fill:#e2e8f0;font-size:11px}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="760" height="540" rx="16" fill="url(#vecbg)"/>
  <text x="30" y="40" class="t">Vector search: meaning as coordinates, nearest = most similar</text>
  <text x="30" y="62" class="sub">an embedding model turns text/images into points; search = find the nearest neighbors, approximately</text>

  <!-- embedding step -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="30" y="84" width="150" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="105" y="108" text-anchor="middle" class="hd">"puppy"</text>
    <text x="105" y="128" text-anchor="middle" class="cap" font-size="10">text / image</text>
    <path d="M182 114 L228 114" stroke="#94a3b8" marker-end="url(#vecar)"/>
    <rect x="230" y="84" width="150" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="305" y="106" text-anchor="middle" class="hd">EMBEDDING</text>
    <text x="305" y="124" text-anchor="middle" class="cap" font-size="10">model → vector</text>
    <text x="305" y="138" text-anchor="middle" class="cap" font-size="9">[0.2, -0.7, 0.1, …] (768-d)</text>
    <path d="M382 114 L428 114" stroke="#94a3b8" marker-end="url(#vecar)"/>
    <rect x="430" y="84" width="300" height="60" rx="10" fill="#0b1220" stroke="#2563eb" stroke-width="1.5"/>
    <text x="444" y="106" class="cap" font-size="11">similar MEANING → nearby vectors</text>
    <text x="444" y="126" class="cap" font-size="10">"puppy" ≈ "dog" ≈ "canine" — far from "car"</text>
  </g>

  <!-- vector space -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.5s" fill="freeze"/>
    <rect x="30" y="162" width="340" height="200" rx="10" fill="#0b1220" stroke="#16a34a" stroke-width="2"/>
    <text x="48" y="184" class="hd" fill="#6ee7b7">VECTOR SPACE (2-D shown; really 100s of dims)</text>
    <!-- cluster dogs -->
    <circle cx="130" cy="240" r="6" fill="#34d399"/><text x="140" y="244" class="cap" font-size="9">dog</text>
    <circle cx="155" cy="225" r="6" fill="#34d399"/><text x="165" y="229" class="cap" font-size="9">puppy</text>
    <circle cx="120" cy="265" r="6" fill="#34d399"/><text x="130" y="269" class="cap" font-size="9">canine</text>
    <!-- query -->
    <circle cx="140" cy="248" r="9" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/><text x="152" y="264" class="cap" font-size="9" fill="#fbbf24">query</text>
    <circle cx="140" cy="248" r="34" fill="none" stroke="#fbbf24" stroke-dasharray="4 3"/>
    <!-- cluster cars far -->
    <circle cx="300" cy="320" r="6" fill="#60a5fa"/><text x="250" y="324" class="cap" font-size="9">car</text>
    <circle cx="315" cy="335" r="6" fill="#60a5fa"/><text x="265" y="339" class="cap" font-size="9">engine</text>
    <text x="48" y="350" class="cap" font-size="9">nearest neighbors of query = semantic matches</text>
  </g>

  <!-- ANN index -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.5s" fill="freeze"/>
    <rect x="390" y="162" width="340" height="200" rx="10" fill="#0b1220" stroke="#7c3aed" stroke-width="2"/>
    <text x="408" y="184" class="hd" fill="#c4b5fd">ANN INDEX (HNSW) — don't compare all N</text>
    <text x="408" y="206" class="cap" font-size="10">exact kNN = O(N) — too slow at millions</text>
    <!-- hnsw layers -->
    <text x="408" y="230" class="cap" font-size="9">layer 2 (sparse, long hops)</text>
    <circle cx="430" cy="244" r="5" fill="#818cf8"/><circle cx="560" cy="244" r="5" fill="#818cf8"/><circle cx="680" cy="244" r="5" fill="#818cf8"/>
    <line x1="435" y1="244" x2="555" y2="244" stroke="#475569"/><line x1="565" y1="244" x2="675" y2="244" stroke="#475569"/>
    <text x="408" y="272" class="cap" font-size="9">layer 1</text>
    <circle cx="430" cy="286" r="4" fill="#a5b4fc"/><circle cx="490" cy="286" r="4" fill="#a5b4fc"/><circle cx="560" cy="286" r="4" fill="#a5b4fc"/><circle cx="620" cy="286" r="4" fill="#a5b4fc"/><circle cx="680" cy="286" r="4" fill="#a5b4fc"/>
    <line x1="434" y1="286" x2="486" y2="286" stroke="#475569"/><line x1="494" y1="286" x2="556" y2="286" stroke="#475569"/><line x1="564" y1="286" x2="616" y2="286" stroke="#475569"/><line x1="624" y1="286" x2="676" y2="286" stroke="#475569"/>
    <text x="408" y="312" class="cap" font-size="9">layer 0 (dense, all points)</text>
    <text x="408" y="340" class="cap" font-size="10" fill="#c4b5fd">greedy descend layers → O(log N), ~approximate</text>
    <text x="408" y="354" class="cap" font-size="9">also: IVF (cluster + probe), PQ (compress)</text>
  </g>

  <!-- recall vs latency -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.6s" fill="freeze"/>
    <rect x="30" y="380" width="700" height="76" rx="10" fill="#0b1220" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="48" y="404" class="hd" fill="#fbbf24">THE CORE TRADE-OFF — recall vs latency (the "A" in ANN)</text>
    <text x="48" y="426" class="cap" font-size="11">search more of the graph → higher RECALL (found the true nearest) but slower</text>
    <text x="48" y="444" class="cap" font-size="11">search less → faster but may miss some true neighbors · tune ef/nprobe per SLA</text>
  </g>

  <!-- rule -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="3.3s" dur="0.6s" fill="freeze"/>
    <rect x="30" y="470" width="700" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="380" y="497" text-anchor="middle" class="hd">Embed → store vectors → ANN nearest-neighbor search · powers semantic search &amp; RAG</text>
  </g>
</svg>
