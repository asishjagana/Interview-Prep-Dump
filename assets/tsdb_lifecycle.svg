<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="tsbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="tsar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .nd{fill:#f8fafc;font-size:11px;font-weight:700}
      .cap{fill:#e2e8f0;font-size:11px}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="760" height="520" rx="16" fill="url(#tsbg)"/>
  <text x="30" y="40" class="t">Time-series data: append-only, downsample, then expire</text>
  <text x="30" y="62" class="sub">timestamp is the primary axis — data only ever arrives newest, is read by range, and ages out</text>

  <!-- ingest -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="30" y="86" width="150" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="105" y="110" text-anchor="middle" class="hd">INGEST</text>
    <text x="105" y="128" text-anchor="middle" class="cap" font-size="10">millions of points/s</text>
    <text x="105" y="144" text-anchor="middle" class="cap" font-size="10">append-only writes</text>
  </g>

  <!-- data point structure -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.5s" fill="freeze"/>
    <rect x="210" y="82" width="520" height="52" rx="8" fill="#0b1220" stroke="#2563eb" stroke-width="1.5"/>
    <text x="224" y="102" class="cap" font-size="10">a point = </text>
    <rect x="290" y="90" width="120" height="36" rx="4" fill="#1e3a5f"/><text x="350" y="106" text-anchor="middle" class="nd" font-size="10">timestamp</text><text x="350" y="120" text-anchor="middle" class="cap" font-size="9">the axis</text>
    <rect x="418" y="90" width="150" height="36" rx="4" fill="#14532d"/><text x="493" y="106" text-anchor="middle" class="nd" font-size="10">tags (metadata)</text><text x="493" y="120" text-anchor="middle" class="cap" font-size="9">host, region — indexed</text>
    <rect x="576" y="90" width="140" height="36" rx="4" fill="#78350f"/><text x="646" y="106" text-anchor="middle" class="nd" font-size="10">fields (values)</text><text x="646" y="120" text-anchor="middle" class="cap" font-size="9">cpu=87.2</text>
  </g>

  <!-- storage: chunks by time -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.5s" fill="freeze"/>
    <path d="M182 120 L206 120" stroke="#94a3b8" marker-end="url(#tsar)"/>
    <text x="30" y="186" class="hd" fill="#93c5fd">STORAGE — partitioned into time chunks (columnar + delta/gorilla compression)</text>
    <rect x="30" y="196" width="150" height="48" rx="6" fill="#16a34a"/><text x="105" y="216" text-anchor="middle" class="nd">today (hot)</text><text x="105" y="232" text-anchor="middle" class="cap" font-size="9">raw, full res</text>
    <rect x="196" y="196" width="150" height="48" rx="6" fill="#15803d"/><text x="271" y="216" text-anchor="middle" class="nd">this week</text><text x="271" y="232" text-anchor="middle" class="cap" font-size="9">compressed ~10x</text>
    <rect x="362" y="196" width="150" height="48" rx="6" fill="#166534"/><text x="437" y="216" text-anchor="middle" class="nd">this month</text><text x="437" y="232" text-anchor="middle" class="cap" font-size="9">compressed ~90x</text>
    <rect x="528" y="196" width="200" height="48" rx="6" fill="#14532d"/><text x="628" y="216" text-anchor="middle" class="nd">older</text><text x="628" y="232" text-anchor="middle" class="cap" font-size="9">downsampled / archived</text>
  </g>

  <!-- downsample -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.6s" fill="freeze"/>
    <rect x="30" y="266" width="700" height="82" rx="10" fill="#0b1220" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="48" y="290" class="hd" fill="#fbbf24">DOWNSAMPLING — you don't need per-second data from last year</text>
    <text x="48" y="312" class="cap" font-size="11">raw 1s points → roll up to 1min avg/max after a week → 1hr after a month (continuous aggregate)</text>
    <text x="48" y="332" class="cap" font-size="11">keeps dashboards fast &amp; storage small; recent = high-res, old = low-res</text>
  </g>

  <!-- retention -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.6s" fill="freeze"/>
    <rect x="30" y="362" width="700" height="76" rx="10" fill="#0b1220" stroke="#dc2626" stroke-width="1.5"/>
    <text x="48" y="386" class="hd" fill="#fca5a5">RETENTION — drop old data by dropping whole chunks (cheap!)</text>
    <text x="48" y="408" class="cap" font-size="11">"keep raw 30d, 1min 1y, delete rest" → DROP the time chunk (no per-row DELETE, no tombstones)</text>
    <text x="48" y="428" class="cap" font-size="11">this is why time-chunk partitioning matters: expiry = O(1) chunk drop</text>
  </g>

  <!-- rule -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.6s" fill="freeze"/>
    <rect x="30" y="452" width="700" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="380" y="479" text-anchor="middle" class="hd">Append-heavy, range-read, time-ordered, auto-expiring — a general DB fights all four</text>
  </g>
</svg>
