<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="rplbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="rar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#f8fafc;font-size:14px;font-weight:800}
      .nl{fill:#0f172a;font-size:12px;font-weight:700}
      .cap{fill:#cbd5e1;font-size:11px}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="760" height="500" rx="16" fill="url(#rplbg)"/>
  <text x="30" y="40" class="t">Replication topologies — where writes are allowed</text>
  <text x="30" y="62" class="sub">copy data across nodes for availability, read scale &amp; locality — the topology sets the conflict risk</text>

  <!-- LEADER-FOLLOWER -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="24" y="82" width="236" height="200" rx="10" fill="#0b1220" stroke="#2563eb" stroke-width="2"/>
    <text x="40" y="106" class="hd" fill="#93c5fd">Leader–Follower</text>
    <text x="40" y="124" class="cap">1 writer, N readers</text>
    <rect x="98" y="136" width="88" height="34" rx="6" fill="#fbbf24"/><text x="142" y="158" text-anchor="middle" class="nl">Leader (W)</text>
    <rect x="40" y="216" width="60" height="30" rx="6" fill="#60a5fa"/><text x="70" y="236" text-anchor="middle" class="nl">R</text>
    <rect x="112" y="216" width="60" height="30" rx="6" fill="#60a5fa"/><text x="142" y="236" text-anchor="middle" class="nl">R</text>
    <rect x="184" y="216" width="60" height="30" rx="6" fill="#60a5fa"/><text x="214" y="236" text-anchor="middle" class="nl">R</text>
    <line x1="130" y1="170" x2="70" y2="216" stroke="#64748b" marker-end="url(#rar)"/>
    <line x1="142" y1="170" x2="142" y2="216" stroke="#64748b" marker-end="url(#rar)"/>
    <line x1="154" y1="170" x2="214" y2="216" stroke="#64748b" marker-end="url(#rar)"/>
    <text x="40" y="268" class="cap">✓ simple, read scale  ✗ write bottleneck, failover</text>
  </g>

  <!-- MULTI-LEADER -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.5s" fill="freeze"/>
    <rect x="268" y="82" width="224" height="200" rx="10" fill="#0b1220" stroke="#7c3aed" stroke-width="2"/>
    <text x="284" y="106" class="hd" fill="#c4b5fd">Multi-Leader</text>
    <text x="284" y="124" class="cap">many writers (per region)</text>
    <rect x="300" y="140" width="80" height="32" rx="6" fill="#818cf8"/><text x="340" y="161" text-anchor="middle" class="nl">NY (W)</text>
    <rect x="392" y="140" width="80" height="32" rx="6" fill="#818cf8"/><text x="432" y="161" text-anchor="middle" class="nl">LON (W)</text>
    <rect x="346" y="210" width="80" height="32" rx="6" fill="#818cf8"/><text x="386" y="231" text-anchor="middle" class="nl">TOK (W)</text>
    <line x1="340" y1="172" x2="380" y2="210" stroke="#64748b" marker-end="url(#rar)"/>
    <line x1="432" y1="172" x2="392" y2="210" stroke="#64748b" marker-end="url(#rar)"/>
    <line x1="380" y1="156" x2="392" y2="156" stroke="#64748b" marker-end="url(#rar)"/>
    <text x="284" y="266" class="cap">✓ regional writes, survive DC loss</text>
    <text x="284" y="280" class="cap" fill="#f87171">✗ write CONFLICTS to resolve</text>
  </g>

  <!-- LEADERLESS -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.5s" fill="freeze"/>
    <rect x="500" y="82" width="236" height="200" rx="10" fill="#0b1220" stroke="#16a34a" stroke-width="2"/>
    <text x="516" y="106" class="hd" fill="#6ee7b7">Leaderless (quorum)</text>
    <text x="516" y="124" class="cap">any node writes; R+W&gt;N</text>
    <rect x="540" y="140" width="52" height="30" rx="6" fill="#34d399"/><text x="566" y="160" text-anchor="middle" class="nl">N1</text>
    <rect x="644" y="140" width="52" height="30" rx="6" fill="#34d399"/><text x="670" y="160" text-anchor="middle" class="nl">N2</text>
    <rect x="592" y="216" width="52" height="30" rx="6" fill="#34d399"/><text x="618" y="236" text-anchor="middle" class="nl">N3</text>
    <line x1="566" y1="170" x2="618" y2="216" stroke="#64748b"/>
    <line x1="670" y1="170" x2="618" y2="216" stroke="#64748b"/>
    <line x1="592" y1="155" x2="644" y2="155" stroke="#64748b"/>
    <text x="516" y="266" class="cap">✓ extreme write availability</text>
    <text x="516" y="280" class="cap">✗ no global order, read-repair</text>
  </g>

  <!-- SYNC vs ASYNC -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.6s" fill="freeze"/>
    <rect x="24" y="300" width="712" height="86" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="40" y="324" class="hd" fill="#0f172a">SYNC vs ASYNC — the durability/latency dial</text>
    <text x="40" y="348" class="nl" font-weight="400">• Sync: leader waits for follower ACK → no data loss on failover, but slower &amp; blocks if follower down</text>
    <text x="40" y="368" class="nl" font-weight="400">• Async: leader ACKs immediately → fast, but a crash before replication LOSES the last writes</text>
    <text x="40" y="382" class="cap">Semi-sync: wait for ≥1 follower — the common compromise</text>
  </g>

  <!-- lag / split brain -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.6s" fill="freeze"/>
    <rect x="24" y="396" width="712" height="88" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="40" y="420" class="hd" fill="#0f172a">THE TWO HAZARDS</text>
    <text x="40" y="444" class="nl" font-weight="400">• Replication lag: read a stale follower right after a write → "my change vanished" (fix: read-your-writes)</text>
    <text x="40" y="466" class="nl" font-weight="400">• Split brain: two nodes both think they're leader, both accept writes (fix: consensus/quorum failover — Raft)</text>
  </g>
</svg>
