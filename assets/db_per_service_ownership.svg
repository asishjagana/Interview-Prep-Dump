<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="dpsbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="dpsR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#fca5a5"/></marker>
    <marker id="dpsG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6ee7b7"/></marker>
    <marker id="dpsB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#93c5fd"/></marker>
    <marker id="dpsV" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#c4b5fd"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .cap{fill:#e2e8f0;font-size:11px}
      .lbl{fill:#f8fafc;font-size:12px;font-weight:700}
      .node{fill:#0b1220;stroke-width:2}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="760" height="580" rx="16" fill="url(#dpsbg)"/>
  <text x="30" y="40" class="t">Database per Service &amp; Data Ownership</text>
  <text x="30" y="62" class="sub">each service privately owns its data — others reach it only through its API / events, never its tables</text>

  <!-- ============ LEFT: SHARED-DB ANTI-PATTERN ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="80" width="352" height="205" rx="10" fill="#0b1220" stroke="#dc2626" stroke-width="2.5"/>
    <text x="202" y="104" text-anchor="middle" class="hd" fill="#fca5a5">A. SHARED-DATABASE ANTI-PATTERN</text>
    <text x="202" y="120" text-anchor="middle" class="cap" font-size="10">every service reaches into ONE shared database</text>

    <!-- three services -->
    <rect x="42" y="134" width="92" height="34" rx="8" class="node" stroke="#dc2626"/>
    <text x="88" y="155" text-anchor="middle" class="lbl" font-size="11">Orders svc</text>
    <rect x="42" y="180" width="92" height="34" rx="8" class="node" stroke="#dc2626"/>
    <text x="88" y="201" text-anchor="middle" class="lbl" font-size="11">Customers svc</text>
    <rect x="42" y="226" width="92" height="34" rx="8" class="node" stroke="#dc2626"/>
    <text x="88" y="247" text-anchor="middle" class="lbl" font-size="11">Inventory svc</text>

    <!-- shared DB -->
    <rect x="256" y="158" width="102" height="78" rx="10" class="node" stroke="#dc2626" stroke-dasharray="5 3"/>
    <text x="307" y="192" text-anchor="middle" class="lbl" font-size="12" fill="#fca5a5">SHARED DB</text>
    <text x="307" y="210" text-anchor="middle" class="cap" font-size="9">one schema, all tables</text>

    <!-- tangled arrows into shared DB -->
    <line x1="134" y1="151" x2="254" y2="176" stroke="#fca5a5" stroke-width="1.8" marker-end="url(#dpsR)"/>
    <line x1="134" y1="197" x2="254" y2="197" stroke="#fca5a5" stroke-width="1.8" marker-end="url(#dpsR)"/>
    <line x1="134" y1="243" x2="254" y2="218" stroke="#fca5a5" stroke-width="1.8" marker-end="url(#dpsR)"/>

    <text x="42" y="278" class="cap" fill="#fca5a5">✗ schema change breaks everyone · hidden coupling · no independent deploy · lock contention</text>
  </g>

  <!-- ============ RIGHT: DATABASE PER SERVICE ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.5s" fill="freeze"/>
    <rect x="382" y="80" width="352" height="205" rx="10" fill="#0b1220" stroke="#16a34a" stroke-width="2.5"/>
    <text x="558" y="104" text-anchor="middle" class="hd" fill="#6ee7b7">B. DATABASE PER SERVICE</text>
    <text x="558" y="120" text-anchor="middle" class="cap" font-size="10">each service owns its own private store</text>

    <!-- pair 1 -->
    <rect x="398" y="134" width="96" height="34" rx="8" class="node" stroke="#16a34a"/>
    <text x="446" y="155" text-anchor="middle" class="lbl" font-size="11">Orders svc</text>
    <rect x="606" y="134" width="112" height="34" rx="8" class="node" stroke="#16a34a"/>
    <text x="662" y="150" text-anchor="middle" class="cap" font-size="9" fill="#6ee7b7">Orders DB</text>
    <text x="662" y="162" text-anchor="middle" class="cap" font-size="8">PostgreSQL</text>
    <line x1="494" y1="151" x2="604" y2="151" stroke="#6ee7b7" stroke-width="1.8" marker-end="url(#dpsG)"/>

    <!-- pair 2 -->
    <rect x="398" y="180" width="96" height="34" rx="8" class="node" stroke="#16a34a"/>
    <text x="446" y="201" text-anchor="middle" class="lbl" font-size="11">Customers svc</text>
    <rect x="606" y="180" width="112" height="34" rx="8" class="node" stroke="#16a34a"/>
    <text x="662" y="196" text-anchor="middle" class="cap" font-size="9" fill="#6ee7b7">Customers DB</text>
    <text x="662" y="208" text-anchor="middle" class="cap" font-size="8">MongoDB (polyglot)</text>
    <line x1="494" y1="197" x2="604" y2="197" stroke="#6ee7b7" stroke-width="1.8" marker-end="url(#dpsG)"/>

    <!-- pair 3 -->
    <rect x="398" y="226" width="96" height="34" rx="8" class="node" stroke="#16a34a"/>
    <text x="446" y="247" text-anchor="middle" class="lbl" font-size="11">Inventory svc</text>
    <rect x="606" y="226" width="112" height="34" rx="8" class="node" stroke="#16a34a"/>
    <text x="662" y="242" text-anchor="middle" class="cap" font-size="9" fill="#6ee7b7">Inventory DB</text>
    <text x="662" y="254" text-anchor="middle" class="cap" font-size="8">Redis / KV</text>
    <line x1="494" y1="243" x2="604" y2="243" stroke="#6ee7b7" stroke-width="1.8" marker-end="url(#dpsG)"/>

    <text x="398" y="278" class="cap" fill="#6ee7b7">✓ no cross-DB arrows — services talk via API / events; each picks its own store</text>
  </g>

  <!-- ============ CROSS-SERVICE QUERY OPTIONS ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="296" width="708" height="150" rx="10" fill="#0b1220" stroke="#7c3aed" stroke-width="2"/>
    <text x="44" y="320" class="hd" fill="#c4b5fd">C. THE HARD PART — a cross-service query (e.g. "order details" needs 3 services)</text>

    <!-- Option A: API Composition -->
    <rect x="44" y="332" width="330" height="98" rx="8" class="node" stroke="#2563eb"/>
    <text x="209" y="352" text-anchor="middle" class="lbl" font-size="12" fill="#93c5fd">API Composition</text>
    <text x="209" y="368" text-anchor="middle" class="cap" font-size="10">call each service, join results in memory</text>
    <rect x="60" y="378" width="70" height="26" rx="5" class="node" stroke="#334155"/>
    <text x="95" y="395" text-anchor="middle" class="cap" font-size="9">Customers</text>
    <rect x="174" y="378" width="60" height="26" rx="5" class="node" stroke="#334155"/>
    <text x="204" y="395" text-anchor="middle" class="cap" font-size="9">Orders</text>
    <rect x="278" y="378" width="70" height="26" rx="5" class="node" stroke="#334155"/>
    <text x="313" y="395" text-anchor="middle" class="cap" font-size="9">Products</text>
    <line x1="130" y1="391" x2="172" y2="391" stroke="#93c5fd" stroke-width="1.6" marker-end="url(#dpsB)"/>
    <line x1="234" y1="391" x2="276" y2="391" stroke="#93c5fd" stroke-width="1.6" marker-end="url(#dpsB)"/>
    <text x="209" y="422" text-anchor="middle" class="cap" font-size="10" fill="#fbbf24">simple · but 3 sequential ~20ms calls ≈ 60ms · N calls, in-memory join</text>

    <!-- Option B: Materialized view / CQRS -->
    <rect x="390" y="332" width="330" height="98" rx="8" class="node" stroke="#7c3aed"/>
    <text x="555" y="352" text-anchor="middle" class="lbl" font-size="12" fill="#c4b5fd">Materialized View / CQRS read model</text>
    <text x="555" y="368" text-anchor="middle" class="cap" font-size="10">pre-joined read model, synced via events / CDC</text>
    <rect x="406" y="378" width="120" height="26" rx="5" class="node" stroke="#334155"/>
    <text x="466" y="395" text-anchor="middle" class="cap" font-size="9">events / CDC stream</text>
    <rect x="584" y="378" width="120" height="26" rx="5" class="node" stroke="#7c3aed"/>
    <text x="644" y="395" text-anchor="middle" class="cap" font-size="9" fill="#c4b5fd">order-details view</text>
    <line x1="526" y1="391" x2="582" y2="391" stroke="#c4b5fd" stroke-width="1.6" marker-end="url(#dpsV)"/>
    <text x="555" y="422" text-anchor="middle" class="cap" font-size="10" fill="#6ee7b7">one ~5ms read · fast · but eventual consistency + more infra</text>
  </g>

  <!-- ============ BOTTOM CALLOUT ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="456" width="708" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="380" y="480" text-anchor="middle" class="hd">Ownership rule: one service owns each dataset — reach it only via its API or events, never its DB directly</text>
    <text x="380" y="500" text-anchor="middle" class="hd">You lose cross-service ACID &amp; foreign keys → Saga + eventual consistency; queries → compose or materialize</text>
    <text x="380" y="514" text-anchor="middle" class="cap" fill="#5b21b6" font-size="10">Define ownership boundaries along DDD bounded contexts; duplicate/denormalize data deliberately</text>
  </g>
</svg>
