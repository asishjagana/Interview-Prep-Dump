<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 792" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="img_bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="img_arrowG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6ee7b7"/></marker>
    <marker id="img_arrowR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#fca5a5"/></marker>
    <marker id="img_arrowB" markerWidth="9" markerHeight="9" refX="9" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#93c5fd"/></marker>
    <marker id="img_arrowA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#fbbf24"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .cap{fill:#e2e8f0;font-size:11px}
      .lbl{fill:#f8fafc;font-size:12px;font-weight:700}
      .mono{font-family:'Consolas','Courier New',monospace;font-size:10px;fill:#e2e8f0}
      .node{fill:#0b1220;stroke-width:2}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="780" height="792" rx="16" fill="url(#img_bg)"/>
  <text x="30" y="38" class="t">Container Registries &amp; Image Supply-Chain Security</text>
  <text x="30" y="58" class="sub">a tag is a mutable pointer · a digest is an identity · layers are append-only · the admission gate is where policy becomes enforcement</text>

  <!-- ============ PANEL A: ANATOMY OF AN IMAGE ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="72" width="728" height="200" rx="10" fill="#0b1220" stroke="#2563eb" stroke-width="2.5"/>
    <text x="44" y="94" class="hd" fill="#93c5fd">A. AN IMAGE IS A CONTENT-ADDRESSED DATA STRUCTURE — and that is the whole security story</text>

    <!-- A1: tag vs digest -->
    <rect x="44" y="104" width="250" height="158" rx="8" class="node" stroke="#334155"/>
    <text x="56" y="120" class="cap" font-size="10" font-weight="700" fill="#fbbf24">TAG → A MUTABLE POINTER</text>
    <rect x="56" y="128" width="80" height="22" rx="5" fill="#3a2a06" stroke="#d97706" stroke-width="2"/>
    <text x="96" y="143" text-anchor="middle" class="mono" font-size="9" fill="#fde68a">app:1.4</text>
    <line x1="138" y1="134" x2="156" y2="128" stroke="#6ee7b7" stroke-width="1.6" marker-end="url(#img_arrowG)"/>
    <rect x="160" y="116" width="124" height="20" rx="4" fill="#052e1a" stroke="#16a34a" stroke-width="1.8"/>
    <text x="222" y="130" text-anchor="middle" class="mono" font-size="8.5" fill="#bbf7d0">sha256:9f2c… ✓ scanned</text>
    <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.6s" fill="freeze"/>
      <line x1="138" y1="146" x2="156" y2="158" stroke="#fca5a5" stroke-width="1.6" stroke-dasharray="3,2" marker-end="url(#img_arrowR)"/>
      <rect x="160" y="148" width="124" height="20" rx="4" fill="#3a0f12" stroke="#dc2626" stroke-width="1.8"/>
      <text x="222" y="162" text-anchor="middle" class="mono" font-size="8.5" fill="#fecaca">sha256:b4d0… ✗ repushed</text>
    </g>
    <text x="56" y="186" class="cap" font-size="9" fill="#fca5a5">one tag, two different sets of bytes —</text>
    <text x="56" y="197" class="cap" font-size="9" fill="#fca5a5">so yesterday's scan result is void</text>
    <text x="56" y="216" class="cap" font-size="10" font-weight="700" fill="#6ee7b7">DIGEST → AN IMMUTABLE IDENTITY</text>
    <rect x="56" y="222" width="224" height="22" rx="5" fill="#052e1a" stroke="#16a34a" stroke-width="2"/>
    <text x="168" y="237" text-anchor="middle" class="mono" font-size="8.5" fill="#bbf7d0">app@sha256:9f2c…  ← deploy THIS</text>
    <text x="56" y="256" class="cap" font-size="9">the digest IS the hash of the manifest bytes</text>

    <!-- A2: anatomy + stranded secret -->
    <rect x="306" y="104" width="436" height="158" rx="8" class="node" stroke="#334155"/>
    <text x="318" y="120" class="cap" font-size="10" font-weight="700" fill="#93c5fd">MANIFEST → CONFIG → LAYERS  ·  a deleted secret is not deleted</text>

    <rect x="318" y="128" width="118" height="38" rx="6" fill="#0c2b3f" stroke="#2563eb" stroke-width="2"/>
    <text x="377" y="143" text-anchor="middle" class="cap" font-size="10" font-weight="700" fill="#93c5fd">MANIFEST</text>
    <text x="377" y="157" text-anchor="middle" class="cap" font-size="8">config digest + layer digests</text>
    <line x1="377" y1="168" x2="377" y2="176" stroke="#93c5fd" stroke-width="1.6" marker-end="url(#img_arrowB)"/>
    <rect x="318" y="178" width="118" height="38" rx="6" fill="#0c2b3f" stroke="#2563eb" stroke-width="2"/>
    <text x="377" y="193" text-anchor="middle" class="cap" font-size="10" font-weight="700" fill="#93c5fd">CONFIG</text>
    <text x="377" y="207" text-anchor="middle" class="cap" font-size="8">entrypoint · env · ARGs · diff_ids</text>

    <rect x="448" y="128" width="282" height="21" rx="4" class="node" stroke="#334155"/>
    <text x="454" y="142" class="mono" font-size="8.5">L1 a3f1…  FROM node:20-slim   (base OS)</text>
    <rect x="448" y="152" width="282" height="21" rx="4" fill="#3a0f12" stroke="#dc2626" stroke-width="2"/>
    <text x="454" y="166" class="mono" font-size="8.5" fill="#fecaca">L2 7c02…  RUN echo $TOKEN &gt; .npmrc ← SECRET</text>
    <rect x="448" y="176" width="282" height="21" rx="4" class="node" stroke="#334155"/>
    <text x="454" y="190" class="mono" font-size="8.5">L3 1e88…  RUN npm ci             (deps)</text>
    <rect x="448" y="200" width="282" height="21" rx="4" fill="#3a2a06" stroke="#d97706" stroke-width="2"/>
    <text x="454" y="214" class="mono" font-size="8.5" fill="#fde68a">L4 d40b…  RUN rm .npmrc  → a WHITEOUT file</text>
    <path d="M446,210 C434,198 434,174 446,164" fill="none" stroke="#fca5a5" stroke-width="1.6" stroke-dasharray="3,2" marker-end="url(#img_arrowR)"/>

    <text x="448" y="236" class="cap" font-size="9" fill="#fca5a5">docker save img | tar -x  →  layer 7c02… still contains the token, forever</text>
    <text x="448" y="250" class="cap" font-size="9" fill="#6ee7b7">fix: multi-stage build · BuildKit --mount=type=secret · never ARG a secret</text>
  </g>

  <!-- ============ PANEL B: THE SUPPLY CHAIN ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="284" width="728" height="238" rx="10" fill="#0b1220" stroke="#d97706" stroke-width="2.5"/>
    <text x="44" y="306" class="hd" fill="#fbbf24">B. THE SUPPLY CHAIN — the SLSA control at each hop (green), and the real attack it blocks (red)</text>

    <line x1="44" y1="316" x2="744" y2="316" stroke="#475569" stroke-width="1.5" marker-end="url(#img_arrowA)"/>
    <circle cx="99" cy="316" r="4.5" fill="#fbbf24">
      <animate attributeName="cx" values="99;217;335;453;571;689;99" dur="7s" begin="1.9s" repeatCount="indefinite"/>
    </circle>

    <rect x="44" y="326" width="110" height="40" rx="6" fill="#2e1065" stroke="#7c3aed" stroke-width="2"/>
    <text x="99" y="343" text-anchor="middle" class="cap" font-size="10" font-weight="700" fill="#c4b5fd">① SOURCE</text>
    <text x="99" y="357" text-anchor="middle" class="cap" font-size="8">commit + dependencies</text>
    <rect x="162" y="326" width="110" height="40" rx="6" fill="#0c2b3f" stroke="#2563eb" stroke-width="2"/>
    <text x="217" y="343" text-anchor="middle" class="cap" font-size="10" font-weight="700" fill="#93c5fd">② BUILD</text>
    <text x="217" y="357" text-anchor="middle" class="cap" font-size="8">CI runner + Dockerfile</text>
    <rect x="280" y="326" width="110" height="40" rx="6" fill="#0c2b3f" stroke="#2563eb" stroke-width="2"/>
    <text x="335" y="343" text-anchor="middle" class="cap" font-size="10" font-weight="700" fill="#93c5fd">③ SIGN + ATTEST</text>
    <text x="335" y="357" text-anchor="middle" class="cap" font-size="8">SBOM · provenance</text>
    <rect x="398" y="326" width="110" height="40" rx="6" fill="#0c2b3f" stroke="#2563eb" stroke-width="2"/>
    <text x="453" y="343" text-anchor="middle" class="cap" font-size="10" font-weight="700" fill="#93c5fd">④ REGISTRY</text>
    <text x="453" y="357" text-anchor="middle" class="cap" font-size="8">the distribution point</text>
    <rect x="516" y="326" width="110" height="40" rx="6" fill="#052e1a" stroke="#16a34a" stroke-width="2.5"/>
    <text x="571" y="343" text-anchor="middle" class="cap" font-size="10" font-weight="700" fill="#6ee7b7">⑤ ADMISSION</text>
    <text x="571" y="357" text-anchor="middle" class="cap" font-size="8">the enforcement point</text>
    <rect x="634" y="326" width="110" height="40" rx="6" fill="#0c2b3f" stroke="#2563eb" stroke-width="2"/>
    <text x="689" y="343" text-anchor="middle" class="cap" font-size="10" font-weight="700" fill="#93c5fd">⑥ RUNTIME</text>
    <text x="689" y="357" text-anchor="middle" class="cap" font-size="8">the pod, actually running</text>

    <!-- controls -->
    <rect x="44" y="374" width="110" height="54" rx="6" fill="#052e1a" stroke="#16a34a" stroke-width="1.8"/>
    <text x="50" y="390" class="cap" font-size="8" fill="#bbf7d0">✓ signed commits</text>
    <text x="50" y="403" class="cap" font-size="8" fill="#bbf7d0">✓ two-reviewer rule</text>
    <text x="50" y="416" class="cap" font-size="8" fill="#bbf7d0">✓ deps pinned by hash</text>
    <rect x="162" y="374" width="110" height="54" rx="6" fill="#052e1a" stroke="#16a34a" stroke-width="1.8"/>
    <text x="168" y="390" class="cap" font-size="8" fill="#bbf7d0">✓ ephemeral runner</text>
    <text x="168" y="403" class="cap" font-size="8" fill="#bbf7d0">✓ hermetic, no network</text>
    <text x="168" y="416" class="cap" font-size="8" fill="#bbf7d0">✓ digest-pinned base</text>
    <rect x="280" y="374" width="110" height="54" rx="6" fill="#052e1a" stroke="#16a34a" stroke-width="1.8"/>
    <text x="286" y="390" class="cap" font-size="8" fill="#bbf7d0">✓ cosign keyless OIDC</text>
    <text x="286" y="403" class="cap" font-size="8" fill="#bbf7d0">✓ in-toto provenance</text>
    <text x="286" y="416" class="cap" font-size="8" fill="#bbf7d0">✓ logged in Rekor</text>
    <rect x="398" y="374" width="110" height="54" rx="6" fill="#052e1a" stroke="#16a34a" stroke-width="1.8"/>
    <text x="404" y="390" class="cap" font-size="8" fill="#bbf7d0">✓ immutable tags</text>
    <text x="404" y="403" class="cap" font-size="8" fill="#bbf7d0">✓ private + pull-through</text>
    <text x="404" y="416" class="cap" font-size="8" fill="#bbf7d0">✓ RESCAN continuously</text>
    <rect x="516" y="374" width="110" height="54" rx="6" fill="#052e1a" stroke="#16a34a" stroke-width="2.5"/>
    <text x="522" y="390" class="cap" font-size="8" fill="#bbf7d0">✓ Kyverno verifyImages</text>
    <text x="522" y="403" class="cap" font-size="8" fill="#bbf7d0">✓ digest-pinned only</text>
    <text x="522" y="416" class="cap" font-size="8" fill="#bbf7d0">✓ our registry only</text>
    <rect x="634" y="374" width="110" height="54" rx="6" fill="#052e1a" stroke="#16a34a" stroke-width="1.8"/>
    <text x="640" y="390" class="cap" font-size="8" fill="#bbf7d0">✓ non-root, RO rootfs</text>
    <text x="640" y="403" class="cap" font-size="8" fill="#bbf7d0">✓ drop ALL caps</text>
    <text x="640" y="416" class="cap" font-size="8" fill="#bbf7d0">✓ Falco / eBPF detect</text>

    <!-- attacks -->
    <rect x="44" y="436" width="110" height="54" rx="6" fill="#3a0f12" stroke="#dc2626" stroke-width="1.8"/>
    <text x="50" y="452" class="cap" font-size="8" fill="#fecaca">xz-utils CVE-2024-3094:</text>
    <text x="50" y="465" class="cap" font-size="8" fill="#fecaca">a backdoor hidden in</text>
    <text x="50" y="478" class="cap" font-size="8" fill="#fecaca">release build scripts</text>
    <rect x="162" y="436" width="110" height="54" rx="6" fill="#3a0f12" stroke="#dc2626" stroke-width="1.8"/>
    <text x="168" y="452" class="cap" font-size="8" fill="#fecaca">SolarWinds 2020:</text>
    <text x="168" y="465" class="cap" font-size="8" fill="#fecaca">build server owned,</text>
    <text x="168" y="478" class="cap" font-size="8" fill="#fecaca">the source stayed clean</text>
    <rect x="280" y="436" width="110" height="54" rx="6" fill="#3a0f12" stroke="#dc2626" stroke-width="1.8"/>
    <text x="286" y="452" class="cap" font-size="8" fill="#fecaca">Codecov 2021: a CI</text>
    <text x="286" y="465" class="cap" font-size="8" fill="#fecaca">uploader script swapped</text>
    <text x="286" y="478" class="cap" font-size="8" fill="#fecaca">— nothing verified it</text>
    <rect x="398" y="436" width="110" height="54" rx="6" fill="#3a0f12" stroke="#dc2626" stroke-width="1.8"/>
    <text x="404" y="452" class="cap" font-size="8" fill="#fecaca">typosquatted + crypto-</text>
    <text x="404" y="465" class="cap" font-size="8" fill="#fecaca">mining public images;</text>
    <text x="404" y="478" class="cap" font-size="8" fill="#fecaca">a tag repointed later</text>
    <rect x="516" y="436" width="110" height="54" rx="6" fill="#3a0f12" stroke="#dc2626" stroke-width="1.8"/>
    <text x="522" y="452" class="cap" font-size="8" fill="#fecaca">an unsigned :latest</text>
    <text x="522" y="465" class="cap" font-size="8" fill="#fecaca">from docker.io lands in</text>
    <text x="522" y="478" class="cap" font-size="8" fill="#fecaca">prod — nobody checked</text>
    <rect x="634" y="436" width="110" height="54" rx="6" fill="#3a0f12" stroke="#dc2626" stroke-width="1.8"/>
    <text x="640" y="452" class="cap" font-size="8" fill="#fecaca">Log4Shell: a signed,</text>
    <text x="640" y="465" class="cap" font-size="8" fill="#fecaca">zero-CVE-yesterday image</text>
    <text x="640" y="478" class="cap" font-size="8" fill="#fecaca">is still exploitable today</text>

    <rect x="44" y="496" width="700" height="20" rx="5" class="node" stroke="#7c3aed"/>
    <text x="394" y="510" text-anchor="middle" class="cap" font-size="9" fill="#c4b5fd">SLSA ladder — L1 provenance exists · L2 a hosted builder signs it · L3 hardened builder, non-falsifiable provenance · (v0.1 L4) two-party review + hermetic reproducible build</text>
  </g>

  <!-- ============ PANEL C: THE ADMISSION GATE ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="534" width="728" height="190" rx="10" fill="#0b1220" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="44" y="556" class="hd" fill="#c4b5fd">C. THE ADMISSION GATE — five questions asked before a single container starts</text>

    <rect x="44" y="568" width="152" height="46" rx="7" fill="#2e1065" stroke="#7c3aed" stroke-width="2"/>
    <text x="120" y="586" text-anchor="middle" class="cap" font-size="10" font-weight="700" fill="#c4b5fd">a Pod spec reaches</text>
    <text x="120" y="600" text-anchor="middle" class="cap" font-size="10" font-weight="700" fill="#c4b5fd">the API server</text>
    <text x="120" y="634" class="cap" font-size="9" fill="#fbbf24" text-anchor="middle">validating webhook</text>
    <text x="120" y="648" class="cap" font-size="9" text-anchor="middle" fill="#94a3b8">Kyverno · Gatekeeper ·</text>
    <text x="120" y="660" class="cap" font-size="9" text-anchor="middle" fill="#94a3b8">Sigstore policy-controller</text>
    <line x1="198" y1="591" x2="210" y2="580" stroke="#c4b5fd" stroke-width="1.8" marker-end="url(#img_arrowB)"/>

    <rect x="214" y="568" width="330" height="22" rx="5" class="node" stroke="#334155"/>
    <text x="222" y="583" class="cap" font-size="9.5">1 · signed by OUR OIDC identity?  (cosign verify + Rekor)</text>
    <rect x="214" y="594" width="330" height="22" rx="5" class="node" stroke="#334155"/>
    <text x="222" y="609" class="cap" font-size="9.5">2 · pulled from registry.acme.io, not docker.io?</text>
    <rect x="214" y="620" width="330" height="22" rx="5" class="node" stroke="#334155"/>
    <text x="222" y="635" class="cap" font-size="9.5">3 · provenance attests this builder, repo and commit?</text>
    <rect x="214" y="646" width="330" height="22" rx="5" class="node" stroke="#334155"/>
    <text x="222" y="661" class="cap" font-size="9.5">4 · scan policy: no fixable CRITICAL, VEX-adjusted?</text>
    <rect x="214" y="672" width="330" height="22" rx="5" class="node" stroke="#334155"/>
    <text x="222" y="687" class="cap" font-size="9.5">5 · digest-pinned, runAsNonRoot, caps dropped?</text>

    <line x1="548" y1="579" x2="560" y2="588" stroke="#fca5a5" stroke-width="1.6" marker-end="url(#img_arrowR)"/>
    <line x1="548" y1="605" x2="560" y2="598" stroke="#fca5a5" stroke-width="1.6" marker-end="url(#img_arrowR)"/>
    <line x1="548" y1="631" x2="560" y2="606" stroke="#fca5a5" stroke-width="1.6" marker-end="url(#img_arrowR)"/>
    <line x1="548" y1="657" x2="560" y2="614" stroke="#fca5a5" stroke-width="1.6" marker-end="url(#img_arrowR)"/>
    <rect x="564" y="568" width="178" height="60" rx="7" fill="#3a0f12" stroke="#dc2626" stroke-width="2.5"/>
    <text x="653" y="586" text-anchor="middle" class="lbl" font-size="12" fill="#fca5a5">✗ REJECT</text>
    <text x="653" y="601" text-anchor="middle" class="cap" font-size="8.5" fill="#fecaca">any NO ⇒ the Pod never exists</text>
    <text x="653" y="613" text-anchor="middle" class="cap" font-size="8.5" fill="#fecaca">the message must name the rule,</text>
    <text x="653" y="623" text-anchor="middle" class="cap" font-size="8.5" fill="#fecaca">or someone will just delete it</text>

    <line x1="548" y1="683" x2="560" y2="662" stroke="#6ee7b7" stroke-width="2" marker-end="url(#img_arrowG)"/>
    <rect x="564" y="636" width="178" height="42" rx="7" fill="#052e1a" stroke="#16a34a" stroke-width="2.5"/>
    <text x="653" y="654" text-anchor="middle" class="lbl" font-size="12" fill="#6ee7b7">✓ ADMIT</text>
    <text x="653" y="669" text-anchor="middle" class="cap" font-size="8.5" fill="#bbf7d0">tag is mutated to its digest on the way in</text>

    <rect x="564" y="684" width="178" height="30" rx="6" fill="#3a2a06" stroke="#d97706" stroke-width="2"/>
    <text x="653" y="697" text-anchor="middle" class="cap" font-size="8.5" fill="#fde68a">fail-closed + a down webhook</text>
    <text x="653" y="708" text-anchor="middle" class="cap" font-size="8.5" fill="#fde68a">= no writes at all. Exempt bootstrap.</text>

    <rect x="214" y="700" width="330" height="18" rx="5" class="node" stroke="#475569"/>
    <text x="379" y="713" text-anchor="middle" class="cap" font-size="8.5" fill="#94a3b8">gates 1–3 verify PROVENANCE · gate 4 verifies CONTENT · gate 5 limits BLAST RADIUS</text>
  </g>

  <!-- ============ CALLOUT ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="736" width="728" height="44" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="390" y="757" text-anchor="middle" class="hd">A tag is a promise. A digest is a fact. Sign the fact, attest how you built it, refuse everything else.</text>
    <text x="390" y="772" text-anchor="middle" class="cap" fill="#5b21b6" font-size="10">signed + zero known CVEs is necessary and nowhere near sufficient — runtime detection is the other half of the job</text>
  </g>
</svg>
