<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 776" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="gto_bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="gto_arrG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6ee7b7"/></marker>
    <marker id="gto_arrR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#fca5a5"/></marker>
    <marker id="gto_arrA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#fbbf24"/></marker>
    <marker id="gto_arrB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#93c5fd"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .cap{fill:#e2e8f0;font-size:11px}
      .lbl{fill:#f8fafc;font-size:12px;font-weight:700}
      .mono{font-family:'Consolas','Courier New',monospace;font-size:10px;fill:#e2e8f0}
      .node{fill:#0b1220;stroke-width:2}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="780" height="776" rx="16" fill="url(#gto_bg)"/>
  <text x="30" y="38" class="t">GitOps, Helm &amp; Argo CD — git as the source of truth</text>
  <text x="30" y="58" class="sub">the argument is not "YAML in git" — it is which side of the cluster wall the credential lives on</text>

  <!-- ============ PANEL A: PUSH vs PULL, AND THE CREDENTIAL DIRECTION ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="72" width="728" height="196" rx="10" fill="#0b1220" stroke="#2563eb" stroke-width="2.5"/>
    <text x="44" y="94" class="hd" fill="#93c5fd">A. PUSH vs PULL — the arrow that crosses the cluster wall decides your blast radius</text>

    <rect x="42" y="104" width="344" height="154" rx="8" fill="#3a0f12" stroke="#dc2626" stroke-width="2.5"/>
    <text x="56" y="122" class="cap" font-size="11" font-weight="700" fill="#fca5a5">① PUSH CI/CD — the pipeline reaches IN</text>
    <rect x="54" y="134" width="64" height="32" rx="6" class="node" stroke="#334155"/>
    <text x="86" y="154" text-anchor="middle" class="cap" font-size="10">git</text>
    <line x1="120" y1="150" x2="128" y2="150" stroke="#fca5a5" stroke-width="1.8" marker-end="url(#gto_arrR)"/>
    <rect x="132" y="130" width="104" height="40" rx="6" class="node" stroke="#dc2626"/>
    <text x="184" y="146" text-anchor="middle" class="cap" font-size="10" font-weight="700" fill="#fca5a5">CI runner</text>
    <text x="184" y="160" text-anchor="middle" class="mono" font-size="9" fill="#fecaca">cluster-admin creds</text>
    <line x1="254" y1="112" x2="254" y2="250" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="254" y="252" text-anchor="middle" class="cap" font-size="8" fill="#fbbf24">CLUSTER WALL</text>
    <line x1="240" y1="150" x2="268" y2="150" stroke="#fca5a5" stroke-width="2.2" marker-end="url(#gto_arrR)"/>
    <circle r="3.5" cy="150" fill="#fecaca"><animate attributeName="cx" values="240;266" dur="1.6s" repeatCount="indefinite"/></circle>
    <rect x="272" y="130" width="104" height="40" rx="6" class="node" stroke="#dc2626"/>
    <text x="324" y="146" text-anchor="middle" class="cap" font-size="10" font-weight="700" fill="#fca5a5">prod cluster</text>
    <text x="324" y="160" text-anchor="middle" class="mono" font-size="9" fill="#fecaca">kube-api reachable</text>
    <text x="56" y="188" class="cap" font-size="9" fill="#fecaca">✗ the kubeconfig lives OUTSIDE the cluster, in CI secrets</text>
    <text x="56" y="202" class="cap" font-size="9" fill="#fecaca">✗ kube-api must be reachable from the CI network</text>
    <text x="56" y="216" class="cap" font-size="9" fill="#fecaca">✗ one compromised runner ⇒ every cluster it can reach</text>
    <text x="56" y="230" class="cap" font-size="9" fill="#fecaca">✗ apply once, then hope — nothing watches for drift</text>
    <text x="56" y="245" class="cap" font-size="9" font-weight="700" fill="#fca5a5">SolarWinds / Codecov class: the pipeline IS the target</text>

    <rect x="396" y="104" width="344" height="154" rx="8" fill="#052e1a" stroke="#16a34a" stroke-width="2.5"/>
    <text x="410" y="122" class="cap" font-size="11" font-weight="700" fill="#6ee7b7">② GitOps PULL — the cluster reaches OUT</text>
    <rect x="410" y="134" width="66" height="32" rx="6" class="node" stroke="#334155"/>
    <text x="443" y="150" text-anchor="middle" class="cap" font-size="10">git repo</text>
    <text x="443" y="161" text-anchor="middle" class="cap" font-size="8">+ OCI registry</text>
    <line x1="506" y1="112" x2="506" y2="250" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="506" y="252" text-anchor="middle" class="cap" font-size="8" fill="#fbbf24">CLUSTER WALL</text>
    <line x1="520" y1="150" x2="480" y2="150" stroke="#6ee7b7" stroke-width="2.2" marker-end="url(#gto_arrG)"/>
    <circle r="3.5" cy="150" fill="#bbf7d0"><animate attributeName="cx" values="518;482" dur="1.6s" repeatCount="indefinite"/></circle>
    <rect x="524" y="126" width="112" height="48" rx="6" fill="#0b1220" stroke="#16a34a" stroke-width="2.5"/>
    <text x="580" y="143" text-anchor="middle" class="cap" font-size="10" font-weight="700" fill="#6ee7b7">Argo CD / Flux</text>
    <text x="580" y="156" text-anchor="middle" class="cap" font-size="9" fill="#bbf7d0">agent, in-cluster</text>
    <text x="580" y="168" text-anchor="middle" class="mono" font-size="8" fill="#bbf7d0">ServiceAccount RBAC</text>
    <line x1="640" y1="150" x2="654" y2="150" stroke="#6ee7b7" stroke-width="1.8" marker-end="url(#gto_arrG)"/>
    <rect x="658" y="130" width="74" height="40" rx="6" class="node" stroke="#16a34a"/>
    <text x="695" y="146" text-anchor="middle" class="cap" font-size="10" font-weight="700" fill="#6ee7b7">kube-api</text>
    <text x="695" y="160" text-anchor="middle" class="mono" font-size="9" fill="#bbf7d0">private</text>
    <text x="410" y="188" class="cap" font-size="9" fill="#bbf7d0">✓ cluster credentials NEVER leave the cluster</text>
    <text x="410" y="202" class="cap" font-size="9" fill="#bbf7d0">✓ zero inbound rules — works behind NAT / air-gapped-ish</text>
    <text x="410" y="216" class="cap" font-size="9" fill="#bbf7d0">✓ CI needs only: write a git commit, push an image</text>
    <text x="410" y="230" class="cap" font-size="9" fill="#bbf7d0">✓ continuous reconcile ⇒ drift is reverted AND observable</text>
    <text x="410" y="245" class="cap" font-size="9" font-weight="700" fill="#6ee7b7">revoke access = delete one ServiceAccount binding</text>
  </g>

  <!-- ============ PANEL B: THE RENDER-AND-APPLY CHAIN ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="280" width="728" height="196" rx="10" fill="#0b1220" stroke="#d97706" stroke-width="2.5"/>
    <text x="44" y="302" class="hd" fill="#fbbf24">B. THE RENDER-AND-APPLY CHAIN — and the loop that turns "YAML in git" into GitOps</text>

    <rect x="44" y="316" width="104" height="46" rx="7" fill="#2e1065" stroke="#7c3aed" stroke-width="2"/>
    <text x="96" y="334" text-anchor="middle" class="cap" font-size="10" fill="#c4b5fd" font-weight="700">config repo</text>
    <text x="96" y="349" text-anchor="middle" class="mono" font-size="9" fill="#ddd6fe">a git SHA</text>
    <line x1="150" y1="339" x2="158" y2="339" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#gto_arrA)"/>

    <rect x="162" y="316" width="104" height="46" rx="7" class="node" stroke="#334155"/>
    <text x="214" y="334" text-anchor="middle" class="cap" font-size="10" font-weight="700">values.yaml</text>
    <text x="214" y="349" text-anchor="middle" class="cap" font-size="9">or overlay patch</text>
    <line x1="268" y1="339" x2="276" y2="339" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#gto_arrA)"/>

    <rect x="280" y="316" width="112" height="46" rx="7" fill="#052e1a" stroke="#16a34a" stroke-width="2.5"/>
    <text x="336" y="334" text-anchor="middle" class="cap" font-size="10" fill="#6ee7b7" font-weight="700">RENDERED</text>
    <text x="336" y="349" text-anchor="middle" class="cap" font-size="9" fill="#bbf7d0">plain manifests</text>
    <line x1="394" y1="339" x2="402" y2="339" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#gto_arrA)"/>

    <rect x="406" y="316" width="104" height="46" rx="7" class="node" stroke="#2563eb"/>
    <text x="458" y="334" text-anchor="middle" class="cap" font-size="10" fill="#93c5fd" font-weight="700">kube-api</text>
    <text x="458" y="349" text-anchor="middle" class="cap" font-size="9" fill="#bfdbfe">server-side apply</text>
    <line x1="512" y1="339" x2="520" y2="339" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#gto_arrA)"/>

    <rect x="524" y="316" width="100" height="46" rx="7" class="node" stroke="#2563eb"/>
    <text x="574" y="334" text-anchor="middle" class="cap" font-size="10" fill="#93c5fd" font-weight="700">LIVE state</text>
    <text x="574" y="349" text-anchor="middle" class="mono" font-size="9" fill="#bfdbfe">etcd + webhooks</text>
    <line x1="626" y1="339" x2="634" y2="339" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#gto_arrA)"/>

    <rect x="638" y="316" width="102" height="46" rx="7" fill="#3a2a05" stroke="#d97706" stroke-width="2.5"/>
    <text x="689" y="334" text-anchor="middle" class="cap" font-size="10" fill="#fbbf24" font-weight="700">DIFF</text>
    <text x="689" y="349" text-anchor="middle" class="cap" font-size="9" fill="#fde68a">desired vs live</text>

    <path d="M689 364 L689 400 L336 400 L336 366" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#gto_arrA)"/>
    <text x="512" y="394" text-anchor="middle" class="cap" font-size="9" fill="#fde68a">the reconcile loop — this is principle #4, and the only one that makes it GitOps</text>
    <text x="399" y="418" text-anchor="middle" class="cap" font-size="10" fill="#fbbf24">OutOfSync → Syncing → Synced / Degraded &#160;·&#160; poll every 180 s by default, webhook ≈ instant &#160;·&#160; selfHeal reverts <tspan class="mono" font-size="9">kubectl edit</tspan></text>

    <rect x="44" y="428" width="340" height="40" rx="7" class="node" stroke="#7c3aed"/>
    <text x="56" y="444" class="cap" font-size="9" fill="#c4b5fd" font-weight="700">SYNC WAVES (ordering, because YAML has no dependencies)</text>
    <text x="56" y="459" class="cap" font-size="9">-1 CRDs/ns → 0 config/secrets → 1 Deployments → 2 Jobs · wait for HEALTHY</text>

    <rect x="396" y="428" width="344" height="40" rx="7" class="node" stroke="#16a34a"/>
    <text x="408" y="444" class="cap" font-size="9" fill="#6ee7b7" font-weight="700">HEALTH ≠ SYNCED — and the gap is the whole value</text>
    <text x="408" y="459" class="cap" font-size="9">built-in for Deployment/Service/Ingress · custom Lua for any CRD</text>
  </g>

  <!-- ============ PANEL C: PROMOTION + THE SECRETS LADDER ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="488" width="728" height="214" rx="10" fill="#0b1220" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="44" y="510" class="hd" fill="#c4b5fd">C. PROMOTION IS A PULL REQUEST — directories per environment, and the secrets ladder</text>

    <rect x="42" y="520" width="356" height="172" rx="8" class="node" stroke="#7c3aed"/>
    <text x="54" y="538" class="cap" font-size="10" font-weight="700" fill="#c4b5fd">ONE repo, one branch (main), a directory per env</text>
    <text x="54" y="556" class="mono" font-size="9" fill="#ddd6fe">config-repo/</text>
    <text x="54" y="570" class="mono" font-size="9" fill="#ddd6fe">├─ base/                    chart or kustomize base</text>
    <text x="54" y="584" class="mono" font-size="9" fill="#bbf7d0">├─ envs/dev/    app@sha256:a1b2c3…   ← auto</text>
    <text x="54" y="598" class="mono" font-size="9" fill="#bbf7d0">├─ envs/stage/  app@sha256:a1b2c3…   ← auto</text>
    <text x="54" y="612" class="mono" font-size="9" fill="#fde68a">└─ envs/prod/   app@sha256:9f8e7d…   ← PR + review</text>
    <text x="54" y="634" class="cap" font-size="9" fill="#bbf7d0">✓ promotion = ONE LINE changed, in one reviewable PR</text>
    <text x="54" y="648" class="cap" font-size="9" fill="#bbf7d0">✓ the merge SHA becomes your deploy audit trail, for free</text>
    <text x="54" y="662" class="cap" font-size="9" fill="#bbf7d0">✓ revert = <tspan class="mono" font-size="9">git revert</tspan> — the rollback path is the deploy path</text>
    <rect x="54" y="670" width="332" height="16" rx="4" fill="#3a0f12" stroke="#dc2626" stroke-width="1.5"/>
    <text x="220" y="682" text-anchor="middle" class="cap" font-size="9" fill="#fca5a5">✗ branch-per-environment: merge drift + cherry-pick hell</text>

    <rect x="408" y="520" width="332" height="172" rx="8" class="node" stroke="#2563eb"/>
    <text x="420" y="538" class="cap" font-size="10" font-weight="700" fill="#93c5fd">SECRETS: you cannot commit plaintext — the ladder</text>

    <rect x="418" y="546" width="312" height="30" rx="5" fill="#0c2b3f" stroke="#2563eb" stroke-width="1.8"/>
    <text x="428" y="559" class="cap" font-size="10" fill="#93c5fd">1 · Sealed Secrets — public-key encrypt, in-cluster decrypt</text>
    <text x="428" y="571" class="cap" font-size="8" fill="#bfdbfe">simple · but the private key is a cluster-shaped single point of loss</text>

    <rect x="418" y="582" width="312" height="30" rx="5" fill="#0c2b3f" stroke="#2563eb" stroke-width="1.8"/>
    <text x="428" y="595" class="cap" font-size="10" fill="#93c5fd">2 · SOPS + age / KMS — encrypted values live in the repo</text>
    <text x="428" y="607" class="cap" font-size="8" fill="#bfdbfe">reviewable diffs · but rotation means rewriting git history-adjacent files</text>

    <rect x="418" y="618" width="312" height="30" rx="5" fill="#052e1a" stroke="#16a34a" stroke-width="2.5"/>
    <text x="428" y="631" class="cap" font-size="10" fill="#6ee7b7" font-weight="700">3 ★ External Secrets Operator — git holds only a REFERENCE</text>
    <text x="428" y="643" class="cap" font-size="8" fill="#bbf7d0">Vault / ASM / GSM stays the owner · rotation is free · usual best answer</text>

    <rect x="418" y="654" width="312" height="30" rx="5" fill="#0c2b3f" stroke="#2563eb" stroke-width="1.8"/>
    <text x="428" y="667" class="cap" font-size="10" fill="#93c5fd">4 · Secrets Store CSI — mounted at pod start, no k8s Secret</text>
    <text x="428" y="679" class="cap" font-size="8" fill="#bfdbfe">never lands in etcd · but the pod must restart to pick up a rotation</text>
  </g>

  <!-- ============ CALLOUT ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="714" width="728" height="46" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="390" y="736" text-anchor="middle" class="hd">Git holds intent. The cluster holds reality. GitOps is the loop that keeps them equal.</text>
    <text x="390" y="752" text-anchor="middle" class="cap" fill="#5b21b6" font-size="10">Kubernetes-shaped things reconcile beautifully · databases, DNS and IAM still need Terraform or Crossplane</text>
  </g>
</svg>
