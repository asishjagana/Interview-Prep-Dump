<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="tlsbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="tlar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="tlarR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#f87171"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .cap{fill:#e2e8f0;font-size:11px}
      .lbl{fill:#f8fafc;font-size:12px;font-weight:700}
      .msg{fill:#cbd5e1;font-size:10px}
      .rtt{fill:#fbbf24;font-size:10px;font-weight:700}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="760" height="560" rx="16" fill="url(#tlsbg)"/>
  <text x="30" y="40" class="t">TLS handshake: every round-trip is real first-byte latency</text>
  <text x="30" y="62" class="sub">on top of TCP's own 1-RTT (SYN/SYN-ACK) — so 1.2 ≈ 3 RTT to first byte, 1.3 ≈ 2 RTT, QUIC+0-RTT ≈ 1</text>

  <!-- LANE 1: TLS 1.2 -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="30" y="78" width="700" height="176" rx="10" fill="#0b1220" stroke="#dc2626" stroke-width="2"/>
    <text x="46" y="99" class="hd" fill="#fca5a5">TLS 1.2 — TWO round-trips before app data (~2-RTT)</text>
    <text x="110" y="118" text-anchor="middle" class="lbl" fill="#93c5fd">CLIENT</text>
    <text x="650" y="118" text-anchor="middle" class="lbl" fill="#6ee7b7">SERVER</text>
    <line x1="110" y1="124" x2="110" y2="246" stroke="#334155" stroke-width="1.5"/>
    <line x1="650" y1="124" x2="650" y2="246" stroke="#334155" stroke-width="1.5"/>
    <!-- RTT 1 -->
    <text x="380" y="140" text-anchor="middle" class="msg">ClientHello (cipher list)</text>
    <line x1="112" y1="145" x2="648" y2="145" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#tlar)"/>
    <text x="380" y="163" text-anchor="middle" class="msg">ServerHello + Certificate + ServerKeyExchange</text>
    <line x1="648" y1="168" x2="112" y2="168" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#tlar)"/>
    <text x="700" y="157" text-anchor="end" class="rtt">◄ RTT 1 ►</text>
    <!-- RTT 2 -->
    <text x="380" y="192" text-anchor="middle" class="msg">ClientKeyExchange (ECDHE) + Finished</text>
    <line x1="112" y1="197" x2="648" y2="197" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#tlar)"/>
    <text x="380" y="215" text-anchor="middle" class="msg">ChangeCipherSpec + Finished</text>
    <line x1="648" y1="220" x2="112" y2="220" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#tlar)"/>
    <text x="700" y="209" text-anchor="end" class="rtt">◄ RTT 2 ►</text>
    <text x="380" y="242" text-anchor="middle" class="cap" fill="#6ee7b7">→ Application Data (only now, after 2 RTT)</text>
  </g>

  <!-- LANE 2: TLS 1.3 -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.5s" fill="freeze"/>
    <rect x="30" y="262" width="700" height="120" rx="10" fill="#0b1220" stroke="#16a34a" stroke-width="2.5"/>
    <text x="46" y="283" class="hd" fill="#6ee7b7">TLS 1.3 — ONE round-trip (1-RTT), weak ciphers removed</text>
    <line x1="110" y1="290" x2="110" y2="374" stroke="#334155" stroke-width="1.5"/>
    <line x1="650" y1="290" x2="650" y2="374" stroke="#334155" stroke-width="1.5"/>
    <text x="380" y="306" text-anchor="middle" class="msg">ClientHello + key_share (guesses the group up front)</text>
    <line x1="112" y1="311" x2="648" y2="311" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#tlar)"/>
    <text x="380" y="329" text-anchor="middle" class="msg">ServerHello + key_share + Certificate + Finished</text>
    <line x1="648" y1="334" x2="112" y2="334" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#tlar)"/>
    <text x="700" y="323" text-anchor="end" class="rtt">◄ RTT 1 ►</text>
    <text x="380" y="358" text-anchor="middle" class="cap" fill="#6ee7b7">→ Finished + Application Data (one RTT saved vs 1.2)</text>
    <line x1="112" y1="363" x2="648" y2="363" stroke="#6ee7b7" stroke-width="1.5" marker-end="url(#tlar)"/>
  </g>

  <!-- LANE 3: 0-RTT resumption -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.5s" fill="freeze"/>
    <rect x="30" y="390" width="700" height="88" rx="10" fill="#0b1220" stroke="#2563eb" stroke-width="2"/>
    <text x="46" y="411" class="hd" fill="#93c5fd">0-RTT resumption — reuse a pre-shared key (PSK), send data in flight #1</text>
    <line x1="110" y1="418" x2="110" y2="470" stroke="#334155" stroke-width="1.5"/>
    <line x1="650" y1="418" x2="650" y2="470" stroke="#334155" stroke-width="1.5"/>
    <text x="380" y="434" text-anchor="middle" class="msg">ClientHello + PSK + early_data (Application Data!)</text>
    <line x1="112" y1="439" x2="648" y2="439" stroke="#f87171" stroke-width="1.5" marker-end="url(#tlarR)"/>
    <text x="380" y="459" text-anchor="middle" class="cap" fill="#93c5fd">→ 0 RTT to first byte — but early_data is REPLAYABLE</text>
    <text x="380" y="473" text-anchor="middle" class="msg" fill="#fca5a5">⚠ replay risk: only for idempotent, non-mutating requests</text>
  </g>

  <!-- BOTTOM CALLOUT -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.5s" fill="freeze"/>
    <rect x="30" y="486" width="700" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="380" y="509" text-anchor="middle" class="hd">Every RTT saved is ~real ms off first-byte latency, multiplied across every new connection</text>
    <text x="380" y="529" text-anchor="middle" class="cap" fill="#166534">TCP+TLS1.2 ≈ 3 RTT · TCP+TLS1.3 ≈ 2 RTT · QUIC+0-RTT ≈ 1 RTT — at 100ms RTT that is 300ms → 200ms → 100ms</text>
  </g>
</svg>
