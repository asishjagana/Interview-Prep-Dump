<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="cpbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .note{fill:#94a3b8;font-size:12px}
      .h{font-size:14px;font-weight:700}
      .bad{fill:#fca5a5;font-size:13px;font-weight:700}
      .good{fill:#86efac;font-size:13px;font-weight:700}
      .lbl{fill:#e2e8f0;font-size:11px;font-weight:600}
      .dblbl{fill:#e2e8f0;font-size:13px;font-weight:700}
    </style>
  </defs>
  <rect width="760" height="420" rx="16" fill="url(#cpbg)"/>
  <text x="30" y="38" class="t">Connection Pool: Lease/Return vs. a Fresh Handshake Every Time</text>

  <line x1="380" y1="58" x2="380" y2="345" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>

  <text x="205" y="76" text-anchor="middle" class="h" fill="#f87171">NO POOL — fresh connection per request</text>
  <text x="565" y="76" text-anchor="middle" class="h" fill="#34d399">WITH POOL — reuse a warm connection</text>

  <!-- ================= PANEL 1: NO POOL ================= -->

  <!-- handshake step boxes -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.12;0.16;0.76;0.80;1" dur="8s" repeatCount="indefinite"/>
    <rect x="45" y="95" width="100" height="34" rx="6" fill="#3b1d1d" stroke="#f87171" stroke-width="2"/>
    <text x="95" y="116" text-anchor="middle" class="lbl">TCP SYN/ACK</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.26;0.76;0.80;1" dur="8s" repeatCount="indefinite"/>
    <rect x="155" y="95" width="100" height="34" rx="6" fill="#3b1d1d" stroke="#f87171" stroke-width="2"/>
    <text x="205" y="116" text-anchor="middle" class="lbl">TLS handshake</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.36;0.76;0.80;1" dur="8s" repeatCount="indefinite"/>
    <rect x="265" y="95" width="100" height="34" rx="6" fill="#3b1d1d" stroke="#f87171" stroke-width="2"/>
    <text x="315" y="116" text-anchor="middle" class="lbl">DB auth</text>
  </g>

  <!-- DB box (panel 1) -->
  <rect x="145" y="210" width="100" height="50" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="195" y="240" text-anchor="middle" class="dblbl">DB</text>

  <!-- request dot travelling: spawn -> handshake -> DB -> handshake -> destroyed -->
  <circle r="8" fill="#818cf8" cx="55" cy="300" opacity="0">
    <animate attributeName="cx" values="55;55;195;195;195;195;195;55;55" keyTimes="0;0.01;0.12;0.44;0.56;0.60;0.72;0.80;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="300;300;160;160;235;235;160;300;300" keyTimes="0;0.01;0.12;0.44;0.56;0.60;0.72;0.80;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;1;1;1;1;0;0" keyTimes="0;0.01;0.12;0.44;0.56;0.60;0.72;0.80;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <text x="55" y="316" text-anchor="middle" class="note">client request</text>

  <!-- torn-down flash -->
  <text x="205" y="82" text-anchor="middle" fill="#f87171" font-size="11" font-weight="700" opacity="0">✕ connection destroyed — redo it all next time
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.80;0.83;0.90;0.93;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <text x="205" y="335" text-anchor="middle" class="bad">50-100ms per request just for setup</text>

  <!-- ================= PANEL 2: WITH POOL ================= -->

  <text x="495" y="88" text-anchor="middle" class="note" fill="#93c5fd">POOL — 4 warm connections</text>
  <rect x="410" y="95" width="170" height="110" rx="10" fill="#0b1220" stroke="#334155" stroke-width="2"/>

  <!-- static idle slots -->
  <rect x="495" y="108" width="65" height="35" rx="6" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <rect x="420" y="153" width="65" height="35" rx="6" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <rect x="495" y="153" width="65" height="35" rx="6" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>

  <!-- animated connection (leased/returned) -->
  <rect width="65" height="35" rx="6" x="420" y="108" fill="#1e293b" stroke="#60a5fa" stroke-width="2">
    <animate attributeName="x" values="420;420;420;420;605;605;420;420;420;420;420;605;605;420;420;420" keyTimes="0;0.002;0.09;0.15;0.27;0.30;0.39;0.45;0.452;0.54;0.60;0.72;0.75;0.84;0.90;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="108;108;108;205;127;127;205;108;108;108;205;127;127;205;108;108" keyTimes="0;0.002;0.09;0.15;0.27;0.30;0.39;0.45;0.452;0.54;0.60;0.72;0.75;0.84;0.90;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#1e293b;#1e293b;#1e293b;#14532d;#14532d;#14532d;#14532d;#1e293b;#1e293b;#1e293b;#14532d;#14532d;#14532d;#14532d;#1e293b;#1e293b" keyTimes="0;0.002;0.09;0.15;0.27;0.30;0.39;0.45;0.452;0.54;0.60;0.72;0.75;0.84;0.90;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#60a5fa;#60a5fa;#60a5fa;#34d399;#34d399;#34d399;#34d399;#60a5fa;#60a5fa;#60a5fa;#34d399;#34d399;#34d399;#34d399;#60a5fa;#60a5fa" keyTimes="0;0.002;0.09;0.15;0.27;0.30;0.39;0.45;0.452;0.54;0.60;0.72;0.75;0.84;0.90;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- DB box (panel 2) -->
  <rect x="615" y="115" width="80" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="655" y="150" text-anchor="middle" class="dblbl">DB</text>

  <!-- request dot travelling: spawn -> lease point -> DB -> lease point -> served -->
  <circle r="8" fill="#818cf8" cx="410" cy="280" opacity="0">
    <animate attributeName="cx" values="410;410;450;450;650;650;450;450;410;450;450;650;650;450;450;410" keyTimes="0;0.002;0.09;0.15;0.27;0.30;0.39;0.45;0.452;0.54;0.60;0.72;0.75;0.84;0.90;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="280;280;230;230;145;145;230;230;280;230;230;145;145;230;230;280" keyTimes="0;0.002;0.09;0.15;0.27;0.30;0.39;0.45;0.452;0.54;0.60;0.72;0.75;0.84;0.90;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;1;1;1;1;0;1;1;1;1;1;1;0;0" keyTimes="0;0.002;0.09;0.15;0.27;0.30;0.39;0.45;0.452;0.54;0.60;0.72;0.75;0.84;0.90;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <text x="410" y="296" text-anchor="middle" class="note">client request</text>

  <text x="565" y="335" text-anchor="middle" class="good">~0ms setup — connection already warm</text>

  <!-- Footer -->
  <rect x="30" y="358" width="700" height="46" rx="10" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <text x="46" y="378" class="note" fill="#e2e8f0">Pooling amortizes the ~50-100ms TCP + TLS + auth handshake across thousands of requests by keeping</text>
  <text x="46" y="396" class="note">connections warm and reused — the no-pool path pays that full setup tax again on every single request.</text>
</svg>
