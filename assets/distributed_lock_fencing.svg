<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="dlbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="dlG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6ee7b7"/></marker>
    <marker id="dlB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#93c5fd"/></marker>
    <marker id="dlV" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#c4b5fd"/></marker>
    <marker id="dlR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#fca5a5"/></marker>
    <marker id="dlA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#fbbf24"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .cap{fill:#e2e8f0;font-size:11px}
      .lbl{fill:#f8fafc;font-size:12px;font-weight:700}
      .node{fill:#0b1220;stroke-width:2}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="760" height="600" rx="16" fill="url(#dlbg)"/>
  <text x="30" y="38" class="t">Distributed Locking &amp; Fencing Tokens</text>
  <text x="30" y="58" class="sub">a lock alone isn't safe — a paused holder collides with the new one; fencing tokens + consensus fix it</text>

  <!-- ============ TOP: NORMAL LOCK ACQUISITION ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="72" width="708" height="94" rx="10" fill="#0b1220" stroke="#16a34a" stroke-width="2.5"/>
    <text x="44" y="94" class="hd" fill="#6ee7b7">A. NORMAL LOCK ACQUISITION</text>
    <text x="44" y="110" class="cap" font-size="10">grant carries a monotonically increasing fencing token</text>

    <rect x="44" y="120" width="120" height="36" rx="8" class="node" stroke="#2563eb"/>
    <text x="104" y="142" text-anchor="middle" class="lbl" font-size="11">Client</text>

    <rect x="300" y="114" width="200" height="48" rx="8" class="node" stroke="#16a34a"/>
    <text x="400" y="132" text-anchor="middle" class="lbl" font-size="11">Lock Service</text>
    <text x="400" y="150" text-anchor="middle" class="cap" font-size="10">etcd / ZooKeeper / Redis (Raft/ZAB quorum)</text>

    <rect x="596" y="120" width="120" height="36" rx="8" class="node" stroke="#7c3aed"/>
    <text x="656" y="137" text-anchor="middle" class="lbl" fill="#c4b5fd" font-size="11">granted</text>
    <text x="656" y="150" text-anchor="middle" class="cap" font-size="9">token = 33, lease 30s</text>

    <line x1="164" y1="138" x2="298" y2="138" stroke="#93c5fd" stroke-width="2" marker-end="url(#dlB)"/>
    <text x="230" y="130" text-anchor="middle" class="cap" font-size="9" fill="#93c5fd">acquire(L)</text>
    <line x1="500" y1="138" x2="594" y2="138" stroke="#6ee7b7" stroke-width="2" marker-end="url(#dlG)"/>
  </g>

  <!-- ============ MIDDLE: FENCING-TOKEN TIMELINE ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="178" width="708" height="248" rx="10" fill="#0b1220" stroke="#d97706" stroke-width="2.5"/>
    <text x="44" y="200" class="hd" fill="#fbbf24">B. THE FENCING-TOKEN SCENARIO (timeline) — why a lock alone is unsafe</text>

    <!-- swimlane labels -->
    <text x="60" y="238" class="cap" fill="#fca5a5" font-size="11" font-weight="700">Client 1</text>
    <text x="60" y="300" class="cap" fill="#93c5fd" font-size="11" font-weight="700">Client 2</text>
    <text x="60" y="372" class="cap" fill="#c4b5fd" font-size="11" font-weight="700">Storage</text>
    <text x="60" y="386" class="cap" fill="#94a3b8" font-size="8">(checks token)</text>

    <!-- timeline axis -->
    <line x1="118" y1="404" x2="712" y2="404" stroke="#334155" stroke-width="1.5" marker-end="url(#dlB)"/>
    <text x="712" y="420" text-anchor="end" class="cap" font-size="9" fill="#94a3b8">time →</text>

    <!-- Client 1: acquire token 33 -->
    <rect x="118" y="214" width="118" height="32" rx="7" class="node" stroke="#16a34a"/>
    <text x="177" y="234" text-anchor="middle" class="cap" fill="#6ee7b7" font-size="10">acquire → token 33</text>

    <!-- GC pause (amber) -->
    <rect x="244" y="214" width="150" height="32" rx="7" fill="#3a2a0a" stroke="#d97706" stroke-width="2"/>
    <text x="319" y="230" text-anchor="middle" class="cap" fill="#fbbf24" font-size="10">GC PAUSE</text>
    <text x="319" y="242" text-anchor="middle" class="cap" fill="#fbbf24" font-size="8">(stop-the-world)</text>

    <!-- lease expires marker -->
    <line x1="400" y1="210" x2="400" y2="410" stroke="#d97706" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="400" y="208" text-anchor="middle" class="cap" fill="#fbbf24" font-size="9">lease expires</text>

    <!-- Client 1 wakes, stale write -->
    <rect x="500" y="214" width="150" height="32" rx="7" class="node" stroke="#dc2626"/>
    <text x="575" y="230" text-anchor="middle" class="cap" fill="#fca5a5" font-size="10">wakes — thinks it owns</text>
    <text x="575" y="242" text-anchor="middle" class="cap" fill="#fca5a5" font-size="9">write(x), token 33</text>

    <!-- Client 2: acquire token 34 -->
    <rect x="410" y="280" width="130" height="32" rx="7" class="node" stroke="#2563eb"/>
    <text x="475" y="300" text-anchor="middle" class="cap" fill="#93c5fd" font-size="10">acquire → token 34</text>

    <!-- Client 2 write accepted -->
    <rect x="560" y="280" width="150" height="32" rx="7" class="node" stroke="#16a34a"/>
    <text x="635" y="297" text-anchor="middle" class="cap" fill="#6ee7b7" font-size="10">write(x), token 34</text>
    <text x="635" y="308" text-anchor="middle" class="cap" fill="#6ee7b7" font-size="8">→ ACCEPTED</text>

    <!-- Storage boxes -->
    <rect x="560" y="342" width="150" height="30" rx="7" class="node" stroke="#16a34a"/>
    <text x="635" y="361" text-anchor="middle" class="cap" fill="#6ee7b7" font-size="10">✓ 34 ≥ max → OK</text>

    <rect x="118" y="342" width="360" height="30" rx="7" fill="#3a0f12" stroke="#dc2626" stroke-width="2.5"/>
    <text x="298" y="361" text-anchor="middle" class="lbl" fill="#fca5a5" font-size="11">✗ REJECT token 33  (33 &lt; 34, high-water mark)</text>

    <!-- arrows: C2 acquire -> write -->
    <line x1="540" y1="296" x2="558" y2="296" stroke="#6ee7b7" stroke-width="1.8" marker-end="url(#dlG)"/>
    <!-- C2 write -> storage accepted -->
    <line x1="635" y1="312" x2="635" y2="340" stroke="#6ee7b7" stroke-width="1.8" marker-end="url(#dlG)"/>
    <!-- C1 stale write -> storage reject -->
    <line x1="540" y1="240" x2="470" y2="340" stroke="#fca5a5" stroke-width="2" marker-end="url(#dlR)"/>
  </g>

  <!-- ============ BOTTOM: LEADER ELECTION ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="438" width="708" height="86" rx="10" fill="#0b1220" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="44" y="460" class="hd" fill="#c4b5fd">C. LEADER ELECTION — N candidates, one wins via consensus / lowest ephemeral node</text>

    <rect x="44" y="472" width="96" height="40" rx="8" class="node" stroke="#334155"/>
    <text x="92" y="490" text-anchor="middle" class="cap" font-size="10">candidate A</text>
    <text x="92" y="503" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">seq 001</text>

    <rect x="150" y="472" width="96" height="40" rx="8" class="node" stroke="#334155"/>
    <text x="198" y="490" text-anchor="middle" class="cap" font-size="10">candidate B</text>
    <text x="198" y="503" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">seq 002</text>

    <rect x="256" y="472" width="96" height="40" rx="8" class="node" stroke="#334155"/>
    <text x="304" y="490" text-anchor="middle" class="cap" font-size="10">candidate C</text>
    <text x="304" y="503" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">seq 003</text>

    <rect x="410" y="470" width="150" height="44" rx="8" class="node" stroke="#16a34a"/>
    <text x="485" y="488" text-anchor="middle" class="lbl" fill="#6ee7b7" font-size="11">LEADER = A</text>
    <text x="485" y="503" text-anchor="middle" class="cap" font-size="9">lowest seq wins + fences writes</text>

    <rect x="596" y="470" width="120" height="44" rx="8" class="node" stroke="#2563eb"/>
    <text x="656" y="488" text-anchor="middle" class="cap" fill="#93c5fd" font-size="10">B, C follow</text>
    <text x="656" y="503" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">watch node below</text>

    <line x1="352" y1="492" x2="408" y2="492" stroke="#6ee7b7" stroke-width="2" marker-end="url(#dlG)"/>
    <line x1="560" y1="492" x2="594" y2="492" stroke="#93c5fd" stroke-width="2" marker-end="url(#dlB)"/>
  </g>

  <!-- ============ BOTTOM CALLOUT ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="536" width="708" height="50" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="380" y="559" text-anchor="middle" class="hd">A lock alone isn't safe — fencing tokens stop a stale holder</text>
    <text x="380" y="577" text-anchor="middle" class="cap" fill="#5b21b6" font-size="10">correctness needs a consensus-backed store (etcd/ZooKeeper via Raft/ZAB) + monotonic tokens the resource checks</text>
  </g>
</svg>
