<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .lbl{fill:#0f172a;font-size:15px;font-weight:700}
      .ex{fill:#1e293b;font-size:12px}
      .lyr{opacity:0}
    </style>
  </defs>
  <rect width="720" height="420" rx="16" fill="url(#rbg)"/>
  <text x="30" y="42" class="t">The Requirements Pyramid</text>

  <!-- Top: Constraints -->
  <g class="lyr"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <polygon points="360,75 280,150 440,150" fill="#f87171"/>
    <text x="360" y="125" text-anchor="middle" class="lbl">Constraints</text>
  </g>
  <text x="470" y="120" class="ex lyr" fill="#fca5a5"><animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.5s" fill="freeze"/>GDPR · budget · "AWS only" · mobile-first</text>

  <!-- Middle: Non-Functional -->
  <g class="lyr"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.5s" fill="freeze"/>
    <polygon points="280,152 440,152 510,250 210,250" fill="#fbbf24"/>
    <text x="360" y="210" text-anchor="middle" class="lbl">Non-Functional</text>
  </g>
  <text x="540" y="205" class="ex lyr" fill="#fcd34d"><animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.5s" fill="freeze"/>latency · availability</text>
  <text x="540" y="222" class="ex lyr" fill="#fcd34d"><animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.5s" fill="freeze"/>scalability · durability</text>

  <!-- Base: Functional -->
  <g class="lyr"><animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.5s" fill="freeze"/>
    <polygon points="210,252 510,252 580,360 140,360" fill="#34d399"/>
    <text x="360" y="315" text-anchor="middle" class="lbl">Functional ("what it does")</text>
  </g>
  <text x="360" y="338" text-anchor="middle" class="ex lyr" fill="#065f46"><animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.5s" fill="freeze"/>"User can post a tweet · follow people · view a feed"</text>

  <text x="360" y="395" text-anchor="middle" fill="#94a3b8" font-size="13" class="lyr"><animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.5s" fill="freeze"/>Define the base first — but the higher layers decide your architecture.</text>
</svg>
