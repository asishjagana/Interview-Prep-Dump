<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="patbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="pa" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#fbbf24"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .col{fill:#0f172a;font-size:15px;font-weight:700}
      .pat{fill:#e2e8f0;font-size:12px}
      .sub{fill:#0f172a;font-size:10px;font-style:italic}
      .note{fill:#94a3b8;font-size:12px}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="760" height="440" rx="16" fill="url(#patbg)"/>
  <text x="30" y="38" class="t">GoF Design Patterns — three families of intent</text>
  <text x="30" y="60" class="note">Creational = how objects are made · Structural = how they compose · Behavioral = how they collaborate</text>

  <!-- Creational column (purple) -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.6s" fill="freeze"/>
    <rect x="30" y="80" width="222" height="290" rx="12" fill="#0b1220" stroke="#818cf8" stroke-width="2"/>
    <rect x="30" y="80" width="222" height="42" rx="12" fill="#818cf8"/>
    <text x="141" y="108" text-anchor="middle" class="col">CREATIONAL</text>
    <text x="141" y="140" text-anchor="middle" class="sub" fill="#c7d2fe">flexible object creation</text>
    <rect x="48" y="156" width="186" height="52" rx="6" fill="#312e81"/>
    <text x="60" y="176" class="pat" font-weight="700">Singleton</text><text x="60" y="196" class="pat" font-size="10">one shared instance</text>
    <rect x="48" y="218" width="186" height="52" rx="6" fill="#312e81"/>
    <text x="60" y="238" class="pat" font-weight="700">Factory</text><text x="60" y="258" class="pat" font-size="10">pick the class at runtime</text>
    <rect x="48" y="280" width="186" height="52" rx="6" fill="#312e81"/>
    <text x="60" y="300" class="pat" font-weight="700">Builder</text><text x="60" y="320" class="pat" font-size="10">assemble step by step</text>
  </g>

  <!-- Structural column (blue) -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.6s" fill="freeze"/>
    <rect x="268" y="80" width="222" height="290" rx="12" fill="#0b1220" stroke="#60a5fa" stroke-width="2"/>
    <rect x="268" y="80" width="222" height="42" rx="12" fill="#60a5fa"/>
    <text x="379" y="108" text-anchor="middle" class="col">STRUCTURAL</text>
    <text x="379" y="140" text-anchor="middle" class="sub" fill="#bfdbfe">compose into bigger shapes</text>
    <rect x="286" y="156" width="186" height="52" rx="6" fill="#1e3a5f"/>
    <text x="298" y="176" class="pat" font-weight="700">Adapter</text><text x="298" y="196" class="pat" font-size="10">make incompatible fit</text>
    <rect x="286" y="218" width="186" height="52" rx="6" fill="#1e3a5f"/>
    <text x="298" y="238" class="pat" font-weight="700">Decorator</text><text x="298" y="258" class="pat" font-size="10">add behavior by wrapping</text>
    <rect x="286" y="280" width="186" height="52" rx="6" fill="#1e3a5f"/>
    <text x="298" y="300" class="pat" font-weight="700">Facade</text><text x="298" y="320" class="pat" font-size="10">one simple front door</text>
  </g>

  <!-- Behavioral column (green) -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.6s" fill="freeze"/>
    <rect x="506" y="80" width="224" height="290" rx="12" fill="#0b1220" stroke="#34d399" stroke-width="2"/>
    <rect x="506" y="80" width="224" height="42" rx="12" fill="#34d399"/>
    <text x="618" y="108" text-anchor="middle" class="col">BEHAVIORAL</text>
    <text x="618" y="140" text-anchor="middle" class="sub" fill="#a7f3d0">how objects collaborate</text>
    <rect x="524" y="152" width="188" height="40" rx="6" fill="#064e3b"/>
    <text x="536" y="168" class="pat" font-weight="700">Strategy</text><text x="536" y="184" class="pat" font-size="10">swap algorithm at runtime</text>
    <rect x="524" y="198" width="188" height="40" rx="6" fill="#064e3b"/>
    <text x="536" y="214" class="pat" font-weight="700">Observer</text><text x="536" y="230" class="pat" font-size="10">notify subscribers of change</text>
    <rect x="524" y="244" width="188" height="40" rx="6" fill="#064e3b"/>
    <text x="536" y="260" class="pat" font-weight="700">State</text><text x="536" y="276" class="pat" font-size="10">behavior varies by state</text>
    <rect x="524" y="290" width="188" height="40" rx="6" fill="#064e3b"/>
    <text x="536" y="306" class="pat" font-weight="700">Command</text><text x="536" y="322" class="pat" font-size="10">wrap a request as an object</text>
  </g>

  <!-- collaboration arrow: Factory builds a Strategy -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.6s" fill="freeze"/>
    <path d="M234,244 C420,244 400,172 522,172" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#pa)"/>
    <text x="379" y="358" text-anchor="middle" class="pat" fill="#fbbf24" font-size="11">patterns combine — a Factory can build the right Strategy</text>
  </g>

  <rect x="30" y="384" width="700" height="42" rx="10" fill="#0b1220" stroke="#334155" class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.6s" fill="freeze"/></rect>
  <text x="46" y="402" fill="#86efac" font-size="12">✓ name the intent, not the boilerplate — reach for a pattern when real variation exists.</text>
  <text x="46" y="419" fill="#fca5a5" font-size="12">✗ don't force a pattern onto a 10-line script — over-engineering is the #1 misuse.</text>
</svg>
