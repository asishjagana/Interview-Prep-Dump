<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="avbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .h{fill:#e2e8f0;font-size:15px;font-weight:700}
      .box{fill:#1e293b;stroke:#475569;stroke-width:2}
      .bl{fill:#e2e8f0;font-size:13px;font-weight:600}
      .res{font-size:15px;font-weight:700}
      .note{fill:#94a3b8;font-size:12px}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="760" height="420" rx="16" fill="url(#avbg)"/>
  <text x="30" y="38" class="t">Availability Math: dependencies multiply, redundancy adds nines</text>

  <!-- SERIES -->
  <text x="30" y="78" class="h" fill="#f87171">⛓️ In series (a request needs ALL of them) → multiply</text>
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="60" y="95" width="110" height="50" rx="8" class="box"/><text x="115" y="118" text-anchor="middle" class="bl">A</text><text x="115" y="136" text-anchor="middle" class="note">99.9%</text>
    <line x1="170" y1="120" x2="210" y2="120" stroke="#64748b" stroke-width="2"/>
    <rect x="210" y="95" width="110" height="50" rx="8" class="box"/><text x="265" y="118" text-anchor="middle" class="bl">B</text><text x="265" y="136" text-anchor="middle" class="note">99.9%</text>
    <line x1="320" y1="120" x2="360" y2="120" stroke="#64748b" stroke-width="2"/>
    <rect x="360" y="95" width="110" height="50" rx="8" class="box"/><text x="415" y="118" text-anchor="middle" class="bl">C</text><text x="415" y="136" text-anchor="middle" class="note">99.9%</text>
  </g>
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.6s" fill="freeze"/>
    <text x="500" y="116" class="note">0.999 × 0.999 × 0.999 =</text>
    <text x="500" y="138" class="res" fill="#f87171">99.7%  ↓ (worse than any single part!)</text>
  </g>

  <!-- PARALLEL -->
  <text x="30" y="210" class="h" fill="#34d399">🔀 In parallel (redundant — ANY one suffices) → 1 − (failures multiplied)</text>
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.5s" fill="freeze"/>
    <line x1="60" y1="270" x2="110" y2="270" stroke="#64748b" stroke-width="2"/>
    <rect x="110" y="232" width="150" height="40" rx="8" class="box"/><text x="185" y="257" text-anchor="middle" class="bl">Replica 1 · 99%</text>
    <rect x="110" y="288" width="150" height="40" rx="8" class="box"/><text x="185" y="313" text-anchor="middle" class="bl">Replica 2 · 99%</text>
    <line x1="60" y1="252" x2="60" y2="308" stroke="#64748b" stroke-width="2"/>
    <line x1="60" y1="252" x2="110" y2="252" stroke="#64748b" stroke-width="2"/>
    <line x1="60" y1="308" x2="110" y2="308" stroke="#64748b" stroke-width="2"/>
    <line x1="260" y1="252" x2="310" y2="252" stroke="#64748b" stroke-width="2"/>
    <line x1="260" y1="308" x2="310" y2="308" stroke="#64748b" stroke-width="2"/>
    <line x1="310" y1="252" x2="310" y2="308" stroke="#64748b" stroke-width="2"/>
    <line x1="310" y1="280" x2="350" y2="280" stroke="#64748b" stroke-width="2"/>
    <circle cx="360" cy="280" r="6" fill="#34d399"/>
  </g>
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.6s" fill="freeze"/>
    <text x="400" y="274" class="note">1 − (0.01 × 0.01) =</text>
    <text x="400" y="296" class="res" fill="#34d399">99.99%  ↑ (two cheap parts → four nines)</text>
  </g>

  <rect x="30" y="350" width="700" height="52" rx="10" fill="#0b1220" stroke="#334155" class="fade"><animate attributeName="opacity" from="0" to="1" begin="3.3s" dur="0.6s" fill="freeze"/></rect>
  <text x="46" y="374" fill="#e2e8f0" font-size="13" class="fade"><animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.5s" fill="freeze"/>Lesson: a chain is only as available as the product of its links — every dependency you add LOWERS</text>
  <text x="46" y="392" fill="#e2e8f0" font-size="13" class="fade"><animate attributeName="opacity" from="0" to="1" begin="3.7s" dur="0.5s" fill="freeze"/>availability. The only way back up is redundancy (parallel paths) and removing hard dependencies.</text>
</svg>
