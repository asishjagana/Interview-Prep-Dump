<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 630" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="pkbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="pkG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6ee7b7"/></marker>
    <marker id="pkB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#93c5fd"/></marker>
    <marker id="pkV" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#c4b5fd"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .cap{fill:#e2e8f0;font-size:11px}
      .lbl{fill:#f8fafc;font-size:12px;font-weight:700}
      .node{fill:#0b1220;stroke-width:2}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="760" height="630" rx="16" fill="url(#pkbg)"/>
  <text x="30" y="38" class="t">PKI &amp; TLS Certificates</text>
  <text x="30" y="58" class="sub">a certificate is a signed statement "this public key belongs to this name" — trust flows down a chain, and expiry is an outage</text>

  <!-- ============ PANEL A: CHAIN OF TRUST ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="72" width="708" height="178" rx="10" fill="#0b1220" stroke="#16a34a" stroke-width="2.5"/>
    <text x="44" y="94" class="hd" fill="#6ee7b7">A. THE CHAIN OF TRUST — verification walks upward until it reaches a key you already trust</text>
    <text x="44" y="109" class="cap" font-size="10">only the ROOT is pre-installed; everything else must be proved by a signature</text>

    <rect x="44" y="118" width="180" height="70" rx="8" class="node" stroke="#16a34a"/>
    <text x="134" y="137" text-anchor="middle" class="lbl" fill="#6ee7b7" font-size="11">ROOT CA</text>
    <text x="134" y="152" text-anchor="middle" class="cap" font-size="9">self-signed, 10–20 yr</text>
    <text x="134" y="165" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">pre-installed in the OS /</text>
    <text x="134" y="177" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">browser TRUST STORE, key offline</text>

    <rect x="270" y="118" width="180" height="70" rx="8" class="node" stroke="#2563eb"/>
    <text x="360" y="137" text-anchor="middle" class="lbl" fill="#93c5fd" font-size="11">INTERMEDIATE CA</text>
    <text x="360" y="152" text-anchor="middle" class="cap" font-size="9">1–5 yr, online signer</text>
    <text x="360" y="165" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">the sacrificial layer — revoke</text>
    <text x="360" y="177" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">it without burning the root</text>

    <rect x="496" y="118" width="220" height="70" rx="8" class="node" stroke="#7c3aed"/>
    <text x="606" y="137" text-anchor="middle" class="lbl" fill="#c4b5fd" font-size="11">LEAF (your server cert)</text>
    <text x="606" y="152" text-anchor="middle" class="cap" font-size="9">X.509: subject, SAN=api.example.com,</text>
    <text x="606" y="165" text-anchor="middle" class="cap" font-size="9">public key, notBefore/notAfter, EKU</text>
    <text x="606" y="177" text-anchor="middle" class="cap" font-size="9" fill="#fbbf24">90 days (Let's Encrypt) — auto-renew</text>

    <line x1="226" y1="153" x2="266" y2="153" stroke="#6ee7b7" stroke-width="2" marker-end="url(#pkG)"/>
    <text x="246" y="146" text-anchor="middle" class="cap" font-size="8" fill="#6ee7b7">signs</text>
    <line x1="452" y1="153" x2="492" y2="153" stroke="#93c5fd" stroke-width="2" marker-end="url(#pkB)"/>
    <text x="472" y="146" text-anchor="middle" class="cap" font-size="8" fill="#93c5fd">signs</text>

    <rect x="44" y="200" width="672" height="40" rx="7" fill="#0b2545" stroke="#2563eb" stroke-width="2"/>
    <text x="380" y="217" text-anchor="middle" class="cap" font-size="10" font-weight="700" fill="#93c5fd">what the client actually verifies, in order:</text>
    <text x="380" y="232" text-anchor="middle" class="cap" font-size="10">signature chain up to a trusted root · notBefore ≤ now ≤ notAfter · SAN matches the hostname · not revoked · keyUsage/EKU · CT SCTs present</text>
  </g>

  <!-- ============ PANEL B: REVOCATION ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="262" width="708" height="140" rx="10" fill="#0b1220" stroke="#d97706" stroke-width="2.5"/>
    <text x="44" y="284" class="hd" fill="#fbbf24">B. REVOCATION — the hardest unsolved problem in PKI ("this cert is void before it expires")</text>

    <rect x="44" y="296" width="164" height="68" rx="7" fill="#3a0f12" stroke="#dc2626" stroke-width="2"/>
    <text x="126" y="314" text-anchor="middle" class="cap" fill="#fca5a5" font-size="11" font-weight="700">CRL</text>
    <text x="126" y="329" text-anchor="middle" class="cap" font-size="9">download a big list</text>
    <text x="126" y="342" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">stale, megabytes,</text>
    <text x="126" y="355" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">largely abandoned</text>

    <rect x="220" y="296" width="164" height="68" rx="7" fill="#3a2a0a" stroke="#d97706" stroke-width="2"/>
    <text x="302" y="314" text-anchor="middle" class="cap" fill="#fbbf24" font-size="11" font-weight="700">OCSP (client asks CA)</text>
    <text x="302" y="329" text-anchor="middle" class="cap" font-size="9">live status per cert</text>
    <text x="302" y="342" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">privacy leak + latency;</text>
    <text x="302" y="355" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">soft-fail = useless</text>

    <rect x="396" y="296" width="164" height="68" rx="7" fill="#0b2545" stroke="#2563eb" stroke-width="2"/>
    <text x="478" y="314" text-anchor="middle" class="cap" fill="#93c5fd" font-size="11" font-weight="700">OCSP stapling</text>
    <text x="478" y="329" text-anchor="middle" class="cap" font-size="9">server attaches a signed,</text>
    <text x="478" y="342" text-anchor="middle" class="cap" font-size="9">timestamped proof</text>
    <text x="478" y="355" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">no client→CA call</text>

    <rect x="572" y="296" width="144" height="68" rx="7" fill="#052e1a" stroke="#16a34a" stroke-width="2.5"/>
    <text x="644" y="314" text-anchor="middle" class="cap" fill="#6ee7b7" font-size="11" font-weight="700">SHORT-LIVED certs</text>
    <text x="644" y="329" text-anchor="middle" class="cap" font-size="9">expiry IS revocation</text>
    <text x="644" y="342" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">6 days–90 days</text>
    <text x="644" y="355" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">where the web is going</text>

    <text x="380" y="384" text-anchor="middle" class="cap" font-size="10" fill="#fbbf24">browsers soft-fail revocation checks (a blocked check must not break the web), so a short lifetime is the only revocation you can rely on</text>
  </g>

  <!-- ============ PANEL C: ACME LIFECYCLE ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="414" width="708" height="140" rx="10" fill="#0b1220" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="44" y="436" class="hd" fill="#c4b5fd">C. ACME — automated issuance and renewal (Let's Encrypt), because humans forget</text>

    <rect x="44" y="448" width="128" height="56" rx="7" class="node" stroke="#334155"/>
    <text x="108" y="466" text-anchor="middle" class="cap" font-size="10" font-weight="700">① order</text>
    <text x="108" y="480" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">"I want a cert for</text>
    <text x="108" y="492" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">api.example.com"</text>

    <rect x="184" y="448" width="128" height="56" rx="7" class="node" stroke="#7c3aed"/>
    <text x="248" y="466" text-anchor="middle" class="cap" fill="#c4b5fd" font-size="10" font-weight="700">② challenge</text>
    <text x="248" y="480" text-anchor="middle" class="cap" font-size="9">HTTP-01 / DNS-01 /</text>
    <text x="248" y="492" text-anchor="middle" class="cap" font-size="9">TLS-ALPN-01</text>

    <rect x="324" y="448" width="128" height="56" rx="7" class="node" stroke="#2563eb"/>
    <text x="388" y="466" text-anchor="middle" class="cap" fill="#93c5fd" font-size="10" font-weight="700">③ CA validates</text>
    <text x="388" y="480" text-anchor="middle" class="cap" font-size="9">proves you control</text>
    <text x="388" y="492" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">the NAME, not identity</text>

    <rect x="464" y="448" width="128" height="56" rx="7" class="node" stroke="#16a34a"/>
    <text x="528" y="466" text-anchor="middle" class="cap" fill="#6ee7b7" font-size="10" font-weight="700">④ cert issued</text>
    <text x="528" y="480" text-anchor="middle" class="cap" font-size="9">90-day lifetime</text>
    <text x="528" y="492" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">logged to CT</text>

    <rect x="604" y="448" width="112" height="56" rx="7" fill="#3a2a0a" stroke="#d97706" stroke-width="2"/>
    <text x="660" y="466" text-anchor="middle" class="cap" fill="#fbbf24" font-size="10" font-weight="700">⑤ renew @ 60d</text>
    <text x="660" y="480" text-anchor="middle" class="cap" font-size="9">30-day safety margin</text>
    <text x="660" y="492" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">+ alert at 21d</text>

    <line x1="172" y1="476" x2="182" y2="476" stroke="#c4b5fd" stroke-width="1.6" marker-end="url(#pkV)"/>
    <line x1="312" y1="476" x2="322" y2="476" stroke="#c4b5fd" stroke-width="1.6" marker-end="url(#pkV)"/>
    <line x1="452" y1="476" x2="462" y2="476" stroke="#93c5fd" stroke-width="1.6" marker-end="url(#pkB)"/>
    <line x1="592" y1="476" x2="602" y2="476" stroke="#6ee7b7" stroke-width="1.6" marker-end="url(#pkG)"/>

    <rect x="44" y="514" width="672" height="28" rx="7" fill="#3a0f12" stroke="#dc2626" stroke-width="2"/>
    <text x="380" y="532" text-anchor="middle" class="cap" fill="#fca5a5" font-size="10" font-weight="700">miss step ⑤ and every client hard-fails at once — expired certs have taken down Microsoft Teams, Spotify, Ericsson (LTE), and Cisco</text>
  </g>

  <!-- ============ CALLOUT ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="566" width="708" height="50" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="380" y="589" text-anchor="middle" class="hd">TLS gives you encryption; PKI is what tells you *who* you encrypted to</text>
    <text x="380" y="607" text-anchor="middle" class="cap" fill="#5b21b6" font-size="10">chain to a trusted root · check the SAN, not the CN · automate renewal (ACME) · expiry is the #1 real-world TLS outage</text>
  </g>
</svg>
