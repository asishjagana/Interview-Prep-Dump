<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="sgbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="sgG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6ee7b7"/></marker>
    <marker id="sgB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#93c5fd"/></marker>
    <marker id="sgV" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#c4b5fd"/></marker>
    <marker id="sgR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#fca5a5"/></marker>
    <marker id="sgGr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .cap{fill:#e2e8f0;font-size:11px}
      .lbl{fill:#f8fafc;font-size:12px;font-weight:700}
      .node{fill:#0b1220;stroke-width:2}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="760" height="600" rx="16" fill="url(#sgbg)"/>
  <text x="30" y="40" class="t">Saga: Orchestration vs Choreography</text>
  <text x="30" y="62" class="sub">a sequence of local transactions; a failure triggers compensating transactions that undo prior steps</text>

  <!-- ============ LEFT: ORCHESTRATION ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="80" width="352" height="258" rx="10" fill="#0b1220" stroke="#2563eb" stroke-width="2.5"/>
    <text x="202" y="104" text-anchor="middle" class="hd" fill="#93c5fd">A. ORCHESTRATION (central brain)</text>
    <text x="202" y="120" text-anchor="middle" class="cap" font-size="10">orchestrator issues commands and tracks saga state</text>

    <!-- orchestrator -->
    <rect x="40" y="152" width="98" height="150" rx="8" class="node" stroke="#2563eb"/>
    <text x="89" y="212" text-anchor="middle" class="lbl" font-size="11">Saga</text>
    <text x="89" y="228" text-anchor="middle" class="lbl" font-size="11">Orchestrator</text>
    <text x="89" y="246" text-anchor="middle" class="cap" font-size="9">state machine</text>

    <!-- services -->
    <rect x="208" y="134" width="150" height="30" rx="6" class="node" stroke="#334155"/>
    <text x="283" y="153" text-anchor="middle" class="cap" font-size="10">Order service</text>
    <rect x="208" y="176" width="150" height="30" rx="6" class="node" stroke="#334155"/>
    <text x="283" y="195" text-anchor="middle" class="cap" font-size="10">Payment service</text>
    <rect x="208" y="218" width="150" height="30" rx="6" class="node" stroke="#334155"/>
    <text x="283" y="237" text-anchor="middle" class="cap" font-size="10">Inventory service</text>
    <rect x="208" y="260" width="150" height="30" rx="6" class="node" stroke="#334155"/>
    <text x="283" y="279" text-anchor="middle" class="cap" font-size="10">Shipping service</text>

    <!-- command arrows -->
    <line x1="138" y1="176" x2="206" y2="146" stroke="#93c5fd" stroke-width="1.8" marker-end="url(#sgB)"/>
    <line x1="138" y1="192" x2="206" y2="188" stroke="#93c5fd" stroke-width="1.8" marker-end="url(#sgB)"/>
    <line x1="138" y1="208" x2="206" y2="230" stroke="#93c5fd" stroke-width="1.8" marker-end="url(#sgB)"/>
    <line x1="138" y1="224" x2="206" y2="272" stroke="#93c5fd" stroke-width="1.8" marker-end="url(#sgB)"/>
    <text x="168" y="152" class="cap" fill="#93c5fd" font-size="10">1</text>
    <text x="168" y="188" class="cap" fill="#93c5fd" font-size="10">2</text>
    <text x="168" y="224" class="cap" fill="#93c5fd" font-size="10">3</text>
    <text x="168" y="256" class="cap" fill="#93c5fd" font-size="10">4</text>
    <!-- ack (dashed back) -->
    <line x1="206" y1="158" x2="140" y2="238" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#sgGr)"/>
    <text x="150" y="296" class="cap" fill="#94a3b8" font-size="9">acks / replies back to orchestrator</text>
  </g>

  <!-- ============ RIGHT: CHOREOGRAPHY ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.5s" fill="freeze"/>
    <rect x="382" y="80" width="352" height="258" rx="10" fill="#0b1220" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="558" y="104" text-anchor="middle" class="hd" fill="#c4b5fd">B. CHOREOGRAPHY (no central brain)</text>
    <text x="558" y="120" text-anchor="middle" class="cap" font-size="10">each service reacts to an event and emits the next</text>

    <rect x="470" y="138" width="176" height="30" rx="6" class="node" stroke="#7c3aed"/>
    <text x="558" y="157" text-anchor="middle" class="cap" font-size="10">Order service</text>
    <rect x="470" y="188" width="176" height="30" rx="6" class="node" stroke="#7c3aed"/>
    <text x="558" y="207" text-anchor="middle" class="cap" font-size="10">Payment service</text>
    <rect x="470" y="238" width="176" height="30" rx="6" class="node" stroke="#7c3aed"/>
    <text x="558" y="257" text-anchor="middle" class="cap" font-size="10">Inventory service</text>
    <rect x="470" y="288" width="176" height="30" rx="6" class="node" stroke="#7c3aed"/>
    <text x="558" y="307" text-anchor="middle" class="cap" font-size="10">Shipping service</text>

    <line x1="558" y1="168" x2="558" y2="186" stroke="#c4b5fd" stroke-width="1.8" marker-end="url(#sgV)"/>
    <line x1="558" y1="218" x2="558" y2="236" stroke="#c4b5fd" stroke-width="1.8" marker-end="url(#sgV)"/>
    <line x1="558" y1="268" x2="558" y2="286" stroke="#c4b5fd" stroke-width="1.8" marker-end="url(#sgV)"/>
    <text x="654" y="181" class="cap" fill="#c4b5fd" font-size="9">OrderCreated</text>
    <text x="654" y="231" class="cap" fill="#c4b5fd" font-size="9">PaymentDone</text>
    <text x="654" y="281" class="cap" fill="#c4b5fd" font-size="9">StockReserved</text>
    <text x="474" y="332" class="cap" fill="#94a3b8" font-size="9">events flow on a broker — no orchestrator to crash</text>
  </g>

  <!-- ============ BOTTOM: COMPENSATION CHAIN ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="352" width="708" height="150" rx="10" fill="#0b1220" stroke="#dc2626" stroke-width="2"/>
    <text x="44" y="374" class="hd" fill="#fca5a5">C. COMPENSATING TRANSACTIONS — you cannot roll back committed local txns, so you compensate forward</text>

    <!-- forward (green) -->
    <rect x="44" y="388" width="150" height="38" rx="8" class="node" stroke="#16a34a"/>
    <text x="119" y="405" text-anchor="middle" class="lbl" font-size="11">Order created</text>
    <text x="119" y="419" text-anchor="middle" class="cap" fill="#6ee7b7" font-size="9">local commit</text>
    <rect x="214" y="388" width="150" height="38" rx="8" class="node" stroke="#16a34a"/>
    <text x="289" y="405" text-anchor="middle" class="lbl" font-size="11">Payment charged</text>
    <text x="289" y="419" text-anchor="middle" class="cap" fill="#6ee7b7" font-size="9">local commit</text>
    <rect x="384" y="388" width="150" height="38" rx="8" class="node" stroke="#16a34a"/>
    <text x="459" y="405" text-anchor="middle" class="lbl" font-size="11">Inventory reserved</text>
    <text x="459" y="419" text-anchor="middle" class="cap" fill="#6ee7b7" font-size="9">local commit</text>
    <rect x="554" y="388" width="150" height="38" rx="8" class="node" stroke="#dc2626"/>
    <text x="629" y="405" text-anchor="middle" class="lbl" font-size="11">Shipping</text>
    <text x="629" y="419" text-anchor="middle" class="cap" fill="#fca5a5" font-size="9">✗ FAILS</text>
    <line x1="196" y1="407" x2="212" y2="407" stroke="#6ee7b7" stroke-width="2" marker-end="url(#sgG)"/>
    <line x1="366" y1="407" x2="382" y2="407" stroke="#6ee7b7" stroke-width="2" marker-end="url(#sgG)"/>
    <line x1="536" y1="407" x2="552" y2="407" stroke="#6ee7b7" stroke-width="2" marker-end="url(#sgG)"/>

    <!-- fail drop -->
    <line x1="629" y1="426" x2="629" y2="450" stroke="#fca5a5" stroke-width="2" marker-end="url(#sgR)"/>

    <!-- reverse (red) -->
    <rect x="554" y="452" width="150" height="38" rx="8" class="node" stroke="#dc2626"/>
    <text x="629" y="469" text-anchor="middle" class="lbl" font-size="11">Cancel Shipping</text>
    <text x="629" y="483" text-anchor="middle" class="cap" fill="#fca5a5" font-size="9">compensate</text>
    <rect x="384" y="452" width="150" height="38" rx="8" class="node" stroke="#dc2626"/>
    <text x="459" y="469" text-anchor="middle" class="lbl" font-size="11">Release Inventory</text>
    <text x="459" y="483" text-anchor="middle" class="cap" fill="#fca5a5" font-size="9">compensate</text>
    <rect x="214" y="452" width="150" height="38" rx="8" class="node" stroke="#dc2626"/>
    <text x="289" y="469" text-anchor="middle" class="lbl" font-size="11">Refund Payment</text>
    <text x="289" y="483" text-anchor="middle" class="cap" fill="#fca5a5" font-size="9">compensate</text>
    <rect x="44" y="452" width="150" height="38" rx="8" class="node" stroke="#dc2626"/>
    <text x="119" y="469" text-anchor="middle" class="lbl" font-size="11">Cancel Order</text>
    <text x="119" y="483" text-anchor="middle" class="cap" fill="#fca5a5" font-size="9">compensate</text>
    <line x1="552" y1="471" x2="536" y2="471" stroke="#fca5a5" stroke-width="2" marker-end="url(#sgR)"/>
    <line x1="382" y1="471" x2="366" y2="471" stroke="#fca5a5" stroke-width="2" marker-end="url(#sgR)"/>
    <line x1="212" y1="471" x2="196" y2="471" stroke="#fca5a5" stroke-width="2" marker-end="url(#sgR)"/>
  </g>

  <!-- ============ BOTTOM CALLOUT ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="512" width="708" height="76" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="380" y="536" text-anchor="middle" class="hd">Orchestration = a coordinator drives &amp; tracks; Choreography = services react to events</text>
    <text x="380" y="556" text-anchor="middle" class="hd">A failed step fires compensating transactions that semantically undo prior steps in reverse</text>
    <text x="380" y="574" text-anchor="middle" class="cap" fill="#5b21b6" font-size="10">No 2PC locks: each step commits locally, then compensation undoes it (refund, release, cancel)</text>
  </g>
</svg>
