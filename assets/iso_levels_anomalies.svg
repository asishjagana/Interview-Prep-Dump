<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="isobg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:12px;font-weight:800}
      .cell{fill:#e2e8f0;font-size:11px}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="760" height="520" rx="16" fill="url(#isobg)"/>
  <text x="30" y="40" class="t">Isolation levels: stronger = fewer anomalies, less concurrency</text>
  <text x="30" y="62" class="sub">each level permits a set of read anomalies; pick the weakest level that forbids the ones you can't tolerate</text>

  <!-- table -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.6s" fill="freeze"/>
    <!-- header row -->
    <rect x="30" y="86" width="220" height="40" rx="4" fill="#334155"/><text x="42" y="111" class="cell" font-weight="700">Isolation level</text>
    <rect x="254" y="86" width="120" height="40" rx="4" fill="#334155"/><text x="266" y="104" class="cell" font-weight="700" font-size="10">Dirty read</text>
    <rect x="378" y="86" width="120" height="40" rx="4" fill="#334155"/><text x="390" y="104" class="cell" font-weight="700" font-size="10">Non-repeatable</text>
    <rect x="502" y="86" width="110" height="40" rx="4" fill="#334155"/><text x="514" y="104" class="cell" font-weight="700" font-size="10">Phantom</text>
    <rect x="616" y="86" width="114" height="40" rx="4" fill="#334155"/><text x="628" y="104" class="cell" font-weight="700" font-size="10">Write skew</text>

    <!-- Read Uncommitted -->
    <rect x="30" y="130" width="220" height="40" rx="4" fill="#7f1d1d"/><text x="42" y="155" class="cell">Read Uncommitted</text>
    <rect x="254" y="130" width="120" height="40" rx="4" fill="#991b1b"/><text x="314" y="155" text-anchor="middle" class="cell">✗ possible</text>
    <rect x="378" y="130" width="120" height="40" rx="4" fill="#991b1b"/><text x="438" y="155" text-anchor="middle" class="cell">✗ possible</text>
    <rect x="502" y="130" width="110" height="40" rx="4" fill="#991b1b"/><text x="557" y="155" text-anchor="middle" class="cell">✗ possible</text>
    <rect x="616" y="130" width="114" height="40" rx="4" fill="#991b1b"/><text x="673" y="155" text-anchor="middle" class="cell">✗ possible</text>

    <!-- Read Committed -->
    <rect x="30" y="174" width="220" height="40" rx="4" fill="#78350f"/><text x="42" y="199" class="cell">Read Committed</text>
    <rect x="254" y="174" width="120" height="40" rx="4" fill="#166534"/><text x="314" y="199" text-anchor="middle" class="cell">✓ prevented</text>
    <rect x="378" y="174" width="120" height="40" rx="4" fill="#991b1b"/><text x="438" y="199" text-anchor="middle" class="cell">✗ possible</text>
    <rect x="502" y="174" width="110" height="40" rx="4" fill="#991b1b"/><text x="557" y="199" text-anchor="middle" class="cell">✗ possible</text>
    <rect x="616" y="174" width="114" height="40" rx="4" fill="#991b1b"/><text x="673" y="199" text-anchor="middle" class="cell">✗ possible</text>

    <!-- Repeatable Read / Snapshot -->
    <rect x="30" y="218" width="220" height="40" rx="4" fill="#713f12"/><text x="42" y="237" class="cell">Repeatable Read /</text><text x="42" y="251" class="cell" font-size="10">Snapshot (MVCC)</text>
    <rect x="254" y="218" width="120" height="40" rx="4" fill="#166534"/><text x="314" y="243" text-anchor="middle" class="cell">✓ prevented</text>
    <rect x="378" y="218" width="120" height="40" rx="4" fill="#166534"/><text x="438" y="243" text-anchor="middle" class="cell">✓ prevented</text>
    <rect x="502" y="218" width="110" height="40" rx="4" fill="#166534"/><text x="557" y="243" text-anchor="middle" class="cell">✓ (in PG)</text>
    <rect x="616" y="218" width="114" height="40" rx="4" fill="#991b1b"/><text x="673" y="243" text-anchor="middle" class="cell">✗ possible</text>

    <!-- Serializable -->
    <rect x="30" y="262" width="220" height="40" rx="4" fill="#14532d"/><text x="42" y="287" class="cell">Serializable</text>
    <rect x="254" y="262" width="120" height="40" rx="4" fill="#166534"/><text x="314" y="287" text-anchor="middle" class="cell">✓</text>
    <rect x="378" y="262" width="120" height="40" rx="4" fill="#166534"/><text x="438" y="287" text-anchor="middle" class="cell">✓</text>
    <rect x="502" y="262" width="110" height="40" rx="4" fill="#166534"/><text x="557" y="287" text-anchor="middle" class="cell">✓</text>
    <rect x="616" y="262" width="114" height="40" rx="4" fill="#166534"/><text x="673" y="287" text-anchor="middle" class="cell">✓ prevented</text>
  </g>

  <!-- arrow stronger -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.5s" fill="freeze"/>
    <text x="15" y="200" class="sub" transform="rotate(-90 15 200)">weaker → stronger (more isolation)</text>
  </g>

  <!-- MVCC explanation -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.6s" fill="freeze"/>
    <rect x="30" y="318" width="700" height="96" rx="10" fill="#0b1220" stroke="#2563eb" stroke-width="1.5"/>
    <text x="48" y="342" class="hd" fill="#93c5fd" font-size="13">MVCC — how modern DBs isolate without blocking reads</text>
    <text x="48" y="364" class="cell">each write creates a NEW version stamped with a transaction id; readers see the SNAPSHOT valid at their start</text>
    <text x="48" y="384" class="cell">→ readers never block writers, writers never block readers (only writer-writer conflicts wait)</text>
    <text x="48" y="404" class="cell" font-size="10">old versions kept until no txn needs them → VACUUM/purge cleans "dead tuples"</text>
  </g>

  <!-- write skew -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.6s" fill="freeze"/>
    <rect x="30" y="424" width="700" height="52" rx="10" fill="#0b1220" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="48" y="446" class="hd" fill="#fbbf24">WRITE SKEW — snapshot isolation's blind spot</text>
    <text x="48" y="466" class="cell" font-size="11">two txns read the same data, each updates a DIFFERENT row based on it → both valid alone, invariant broken together (only Serializable stops it)</text>
  </g>

  <!-- rule -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.6s" fill="freeze"/>
    <rect x="30" y="484" width="700" height="28" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="380" y="503" text-anchor="middle" class="hd">Pick the weakest level that forbids the anomalies your data can't tolerate</text>
  </g>
</svg>
