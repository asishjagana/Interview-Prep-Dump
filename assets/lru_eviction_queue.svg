<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="lrubg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .note{fill:#94a3b8;font-size:12px}
      .h{font-size:14px;font-weight:700}
      .node{fill:#1e293b;stroke:#475569;stroke-width:2}
      .klbl{fill:#e2e8f0;font-size:22px;font-weight:700}
      .sublbl{fill:#94a3b8;font-size:10px}
      .cap{font-size:15px;font-weight:700}
    </style>
  </defs>
  <rect width="760" height="420" rx="16" fill="url(#lrubg)"/>
  <text x="30" y="38" class="t">LRU Eviction — HashMap + Doubly Linked List</text>
  <text x="30" y="62" class="note">Each box is a node in the recency-ordered list; a hashmap (not pictured) maps key → node pointer for O(1) lookup.</text>

  <!-- animated scene: fades out briefly at the loop boundary to mask the reset snap -->
  <g id="scene">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.90;0.94;1" dur="8s" repeatCount="indefinite"/>

    <!-- phase captions -->
    <text x="380" y="100" text-anchor="middle" class="cap" fill="#93c5fd">Capacity-4 list: [D, C, B, A] — A is LRU, next to be evicted
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.09;0.10;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="380" y="100" text-anchor="middle" class="cap" fill="#86efac">ACCESS B — hit! unlink + relink to the MRU head (O(1), no scan)
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.09;0.10;0.39;0.40;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="380" y="100" text-anchor="middle" class="cap" fill="#fbbf24">INSERT E — over capacity: drop the tail (A), O(1)
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.39;0.40;0.89;0.90;1" dur="8s" repeatCount="indefinite"/>
    </text>

    <!-- end labels -->
    <text x="110" y="150" text-anchor="middle" class="h" fill="#34d399">MRU (head)</text>
    <text x="500" y="150" text-anchor="middle" class="h" fill="#f87171">LRU (tail — evict here)</text>

    <!-- box E: new key, enters from above once capacity is exceeded -->
    <g transform="translate(60,-90)">
      <animateTransform attributeName="transform" type="translate" values="60,-90;60,-90;60,-90;60,-90;60,170;60,170;60,-90;60,-90" keyTimes="0;0.10;0.24;0.40;0.56;0.90;0.94;1" dur="8s" repeatCount="indefinite"/>
      <rect width="100" height="70" rx="10" fill="#1e1b3a" stroke="#818cf8" stroke-width="2">
        <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;0.10;0.24;0.40;0.56;0.90;0.94;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="50" y="38" text-anchor="middle" class="klbl" fill="#c7d2fe">E
        <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;0.10;0.24;0.40;0.56;0.90;0.94;1" dur="8s" repeatCount="indefinite"/>
      </text>
      <text x="50" y="58" text-anchor="middle" class="sublbl" fill="#a5b4fc">new
        <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;0.10;0.24;0.40;0.56;0.90;0.94;1" dur="8s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- box D -->
    <g transform="translate(60,170)">
      <animateTransform attributeName="transform" type="translate" values="60,170;60,170;190,170;190,170;320,170;320,170;60,170;60,170" keyTimes="0;0.10;0.24;0.40;0.56;0.90;0.94;1" dur="8s" repeatCount="indefinite"/>
      <rect width="100" height="70" rx="10" class="node"/>
      <text x="50" y="38" text-anchor="middle" class="klbl">D</text>
      <text x="50" y="58" text-anchor="middle" class="sublbl">node</text>
    </g>

    <!-- box C -->
    <g transform="translate(190,170)">
      <animateTransform attributeName="transform" type="translate" values="190,170;190,170;320,170;320,170;450,170;450,170;190,170;190,170" keyTimes="0;0.10;0.24;0.40;0.56;0.90;0.94;1" dur="8s" repeatCount="indefinite"/>
      <rect width="100" height="70" rx="10" class="node"/>
      <text x="50" y="38" text-anchor="middle" class="klbl">C</text>
      <text x="50" y="58" text-anchor="middle" class="sublbl">node</text>
    </g>

    <!-- box B: gets accessed (cache hit) and jumps to MRU -->
    <g transform="translate(320,170)">
      <animateTransform attributeName="transform" type="translate" values="320,170;320,170;60,170;60,170;190,170;190,170;320,170;320,170" keyTimes="0;0.10;0.24;0.40;0.56;0.90;0.94;1" dur="8s" repeatCount="indefinite"/>
      <rect width="100" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2">
        <animate attributeName="stroke" values="#475569;#fbbf24;#fbbf24;#475569;#475569;#475569;#475569;#475569" keyTimes="0;0.10;0.24;0.40;0.56;0.90;0.94;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="50" y="38" text-anchor="middle" class="klbl">B</text>
      <text x="50" y="58" text-anchor="middle" class="sublbl">node</text>
    </g>

    <!-- box A: LRU tail — evicted when E is inserted past capacity -->
    <g transform="translate(450,170)">
      <animateTransform attributeName="transform" type="translate" values="450,170;450,170;450,170;450,170;820,170;820,170;450,170;450,170" keyTimes="0;0.10;0.24;0.40;0.56;0.90;0.94;1" dur="8s" repeatCount="indefinite"/>
      <rect width="100" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2">
        <animate attributeName="opacity" values="1;1;1;1;0;0;1;1" keyTimes="0;0.10;0.24;0.40;0.56;0.90;0.94;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="50" y="38" text-anchor="middle" class="klbl">A
        <animate attributeName="opacity" values="1;1;1;1;0;0;1;1" keyTimes="0;0.10;0.24;0.40;0.56;0.90;0.94;1" dur="8s" repeatCount="indefinite"/>
      </text>
      <text x="50" y="58" text-anchor="middle" class="sublbl">node
        <animate attributeName="opacity" values="1;1;1;1;0;0;1;1" keyTimes="0;0.10;0.24;0.40;0.56;0.90;0.94;1" dur="8s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- EVICTED flash -->
    <text x="660" y="150" text-anchor="middle" fill="#f87171" font-size="16" font-weight="700" opacity="0">EVICTED
      <animate attributeName="opacity" values="0;0;1;0;1;0;0;0" keyTimes="0;0.40;0.43;0.46;0.49;0.52;0.56;1" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>

  <rect x="30" y="356" width="700" height="48" rx="10" fill="#0b1220" stroke="#334155"/>
  <text x="46" y="377" class="note" fill="#e2e8f0">LRU is O(1): a hashmap (key → node pointer) finds any node instantly, and a doubly linked list keeps recency</text>
  <text x="46" y="395" class="note">order O(1) too — access = unlink + relink to the front, eviction = drop the tail. No scanning, ever.</text>
</svg>
