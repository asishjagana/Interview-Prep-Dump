<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="cdnbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .note{fill:#94a3b8;font-size:12px}
      .h{font-size:14px;font-weight:700}
      .node{fill:#1e293b;stroke:#475569;stroke-width:2}
    </style>
  </defs>
  <rect width="760" height="410" rx="16" fill="url(#cdnbg)"/>
  <text x="30" y="38" class="t">CDN Pull-Through Cache Fill: pay the origin trip once, serve locally forever after</text>

  <!-- phase headline, toggles between the two phases -->
  <text x="30" y="64" class="h" fill="#f87171">Phase 1 — First request: MISS (cold edge)
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.78;0.79;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="30" y="64" class="h" fill="#34d399" opacity="0">Phase 2 — Second request: HIT (warm edge)
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.79;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <!-- User -->
  <rect x="20" y="90" width="110" height="90" rx="12" class="node"/>
  <text x="75" y="122" text-anchor="middle" class="h" fill="#e2e8f0">User</text>
  <text x="75" y="152" text-anchor="middle" font-size="22">🧑</text>

  <!-- Edge PoP -->
  <rect x="190" y="80" width="170" height="110" rx="12" class="node"/>
  <text x="275" y="105" text-anchor="middle" class="h" fill="#e2e8f0">Edge PoP (Tokyo)</text>
  <g opacity="1">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.62;0.63;1" dur="8s" repeatCount="indefinite"/>
    <rect x="225" y="140" width="100" height="26" rx="5" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="275" y="157" text-anchor="middle" class="note">cache: empty</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.63;1" dur="8s" repeatCount="indefinite"/>
    <rect x="215" y="140" width="120" height="26" rx="5" fill="#14532d" stroke="#34d399" stroke-width="1.5"/>
    <text x="275" y="157" text-anchor="middle" class="note" fill="#bbf7d0">cache: FILLED ✓</text>
  </g>

  <!-- Origin -->
  <g opacity="1">
    <animate attributeName="opacity" values="1;1;0.45;0.45" keyTimes="0;0.79;0.80;1" dur="8s" repeatCount="indefinite"/>
    <rect x="580" y="90" width="170" height="90" rx="12" class="node"/>
    <text x="665" y="122" text-anchor="middle" class="h" fill="#e2e8f0">Origin (US)</text>
    <text x="665" y="152" text-anchor="middle" font-size="20">🗄️</text>
  </g>
  <text x="665" y="172" text-anchor="middle" class="note" fill="#94a3b8" opacity="0">idle — not contacted
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.79;0.80;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <!-- travel lines -->
  <line x1="130" y1="135" x2="190" y2="135" stroke="#475569" stroke-width="3"/>
  <line x1="360" y1="135" x2="580" y2="135" stroke="#475569" stroke-width="3"/>

  <!-- segment labels -->
  <text x="470" y="118" text-anchor="middle" class="note" fill="#fbbf24" opacity="0">150ms round trip
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.05;0.65;0.66;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="160" y="118" text-anchor="middle" class="note" fill="#60a5fa" opacity="0">8ms round trip
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.78;0.79;0.86;0.87;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <!-- Dot 1: forward request, User -> Edge -> Origin (MISS travels all the way) -->
  <circle r="8" cx="75" cy="135" fill="#818cf8" opacity="1">
    <animate attributeName="cx" values="75;275;275;665;665" keyTimes="0;0.05;0.08;0.33;0.36" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;1;1;0" keyTimes="0;0.05;0.08;0.33;0.36" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Dot 2: response, Origin -> Edge (fills cache) -> User -->
  <circle r="8" cx="665" cy="135" fill="#34d399" opacity="0">
    <animate attributeName="cx" values="665;665;665;275;275;75;75" keyTimes="0;0.36;0.38;0.63;0.66;0.71;0.73" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;1;1;0" keyTimes="0;0.36;0.38;0.63;0.66;0.71;0.73" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Dot 3: second request, User -> Edge (HIT, bounces back instantly, never reaches Origin) -->
  <circle r="8" cx="75" cy="135" fill="#34d399" opacity="0">
    <animate attributeName="cx" values="75;75;275;275;75;75" keyTimes="0;0.80;0.815;0.825;0.84;0.855" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;1;1;0" keyTimes="0;0.80;0.815;0.825;0.84;0.855" dur="8s" repeatCount="indefinite"/>
  </circle>

  <rect x="30" y="350" width="700" height="46" rx="10" fill="#0b1220" stroke="#334155"/>
  <text x="46" y="370" class="note" fill="#e2e8f0">The first request per PoP pays the full edge to origin round trip to fill the cache (a cold miss) —</text>
  <text x="46" y="388" class="note">every request after that, at that same PoP, is served locally in milliseconds. Patient once, instant forever after.</text>
</svg>
