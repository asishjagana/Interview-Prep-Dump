<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="csbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .note{fill:#94a3b8;font-size:12px}
      .h{font-size:14px;font-weight:700}
    </style>
  </defs>
  <rect width="760" height="410" rx="16" fill="url(#csbg)"/>
  <text x="30" y="38" class="t">Cache Stampede vs. Request Coalescing (Single-Flight)</text>
  <line x1="380" y1="58" x2="380" y2="335" stroke="#334155" stroke-width="2"/>
  <text x="195" y="62" text-anchor="middle" class="h" fill="#f87171">WITHOUT coalescing — thundering herd</text>
  <text x="565" y="62" text-anchor="middle" class="h" fill="#34d399">WITH coalescing — single-flight</text>

  <!-- PANEL 1: no coalescing -->
  <rect x="150" y="78" width="120" height="38" rx="8" fill="#14532d" stroke="#34d399" stroke-width="2">
    <animate attributeName="fill" values="#14532d;#14532d;#7f1d1d;#7f1d1d;#7f1d1d;#14532d" keyTimes="0;0.1;0.15;0.85;0.95;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#34d399;#34d399;#f87171;#f87171;#f87171;#34d399" keyTimes="0;0.1;0.15;0.85;0.95;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="210" y="102" text-anchor="middle" class="note" fill="#e2e8f0">hot key K</text>
  <text x="210" y="131" text-anchor="middle" fill="#f87171" font-size="12" font-weight="700" opacity="0">TTL EXPIRED
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.15;0.85;0.95;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <circle cx="70" cy="150" r="7" fill="#60a5fa">
    <animate attributeName="cx" values="70;70;210;210;210;70" keyTimes="0;0.1;0.35;0.85;0.95;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="150;150;270;270;270;150" keyTimes="0;0.1;0.35;0.85;0.95;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="110" cy="150" r="7" fill="#60a5fa">
    <animate attributeName="cx" values="110;110;210;210;210;110" keyTimes="0;0.1;0.35;0.85;0.95;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="150;150;270;270;270;150" keyTimes="0;0.1;0.35;0.85;0.95;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="150" r="7" fill="#60a5fa">
    <animate attributeName="cx" values="150;150;210;210;210;150" keyTimes="0;0.1;0.35;0.85;0.95;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="150;150;270;270;270;150" keyTimes="0;0.1;0.35;0.85;0.95;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="190" cy="150" r="7" fill="#60a5fa">
    <animate attributeName="cx" values="190;190;210;210;210;190" keyTimes="0;0.1;0.35;0.85;0.95;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="150;150;270;270;270;150" keyTimes="0;0.1;0.35;0.85;0.95;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="230" cy="150" r="7" fill="#60a5fa">
    <animate attributeName="cx" values="230;230;210;210;210;230" keyTimes="0;0.1;0.35;0.85;0.95;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="150;150;270;270;270;150" keyTimes="0;0.1;0.35;0.85;0.95;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <rect x="140" y="250" width="140" height="45" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2">
    <animate attributeName="fill" values="#1e293b;#1e293b;#7f1d1d;#7f1d1d;#7f1d1d;#1e293b" keyTimes="0;0.1;0.35;0.85;0.95;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#475569;#475569;#f87171;#f87171;#f87171;#475569" keyTimes="0;0.1;0.35;0.85;0.95;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="210" y="277" text-anchor="middle" class="h" fill="#e2e8f0">DATABASE</text>
  <text x="210" y="312" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="700" opacity="0">⚠ OVERLOAD: 5 queries at once
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.4;0.85;0.95;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <!-- PANEL 2: single-flight coalescing -->
  <rect x="520" y="78" width="120" height="38" rx="8" fill="#14532d" stroke="#34d399" stroke-width="2">
    <animate attributeName="fill" values="#14532d;#14532d;#7f1d1d;#7f1d1d;#7f1d1d;#14532d" keyTimes="0;0.1;0.15;0.85;0.95;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#34d399;#34d399;#f87171;#f87171;#f87171;#34d399" keyTimes="0;0.1;0.15;0.85;0.95;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="580" y="102" text-anchor="middle" class="note" fill="#e2e8f0">hot key K</text>
  <text x="580" y="131" text-anchor="middle" fill="#f87171" font-size="12" font-weight="700" opacity="0">TTL EXPIRED
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.15;0.85;0.95;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <rect x="545" y="150" width="70" height="28" rx="6" fill="#422006" stroke="#fbbf24" stroke-width="2"/>
  <text x="580" y="169" text-anchor="middle" font-size="11" font-weight="700" fill="#fde68a">🔒 WAIT</text>

  <circle cx="460" cy="150" r="7" fill="#fbbf24">
    <animate attributeName="cx" values="460;460;580;580;580;460" keyTimes="0;0.1;0.25;0.55;0.85;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="150;150;164;164;185;150" keyTimes="0;0.1;0.25;0.55;0.85;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#fbbf24;#fbbf24;#fbbf24;#fbbf24;#34d399;#34d399" keyTimes="0;0.1;0.25;0.55;0.85;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="150" r="7" fill="#fbbf24">
    <animate attributeName="cx" values="500;500;580;580;580;500" keyTimes="0;0.1;0.25;0.55;0.85;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="150;150;164;164;185;150" keyTimes="0;0.1;0.25;0.55;0.85;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#fbbf24;#fbbf24;#fbbf24;#fbbf24;#34d399;#34d399" keyTimes="0;0.1;0.25;0.55;0.85;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="660" cy="150" r="7" fill="#fbbf24">
    <animate attributeName="cx" values="660;660;580;580;580;660" keyTimes="0;0.1;0.25;0.55;0.85;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="150;150;164;164;185;150" keyTimes="0;0.1;0.25;0.55;0.85;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#fbbf24;#fbbf24;#fbbf24;#fbbf24;#34d399;#34d399" keyTimes="0;0.1;0.25;0.55;0.85;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="150" r="7" fill="#fbbf24">
    <animate attributeName="cx" values="700;700;580;580;580;700" keyTimes="0;0.1;0.25;0.55;0.85;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="150;150;164;164;185;150" keyTimes="0;0.1;0.25;0.55;0.85;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#fbbf24;#fbbf24;#fbbf24;#fbbf24;#34d399;#34d399" keyTimes="0;0.1;0.25;0.55;0.85;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <circle cx="580" cy="150" r="8" fill="#34d399">
    <animate attributeName="cy" values="150;150;270;270;185;185;150" keyTimes="0;0.1;0.35;0.45;0.55;0.85;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <rect x="510" y="250" width="140" height="45" rx="10" fill="#14532d" stroke="#34d399" stroke-width="2">
    <animate attributeName="fill" values="#14532d;#14532d;#1e40af;#14532d;#14532d" keyTimes="0;0.3;0.4;0.5;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="580" y="277" text-anchor="middle" class="h" fill="#dcfce7">DATABASE</text>
  <text x="580" y="312" text-anchor="middle" fill="#bbf7d0" font-size="11" font-weight="700">1 query total — stays calm</text>

  <text x="580" y="230" text-anchor="middle" fill="#bbf7d0" font-size="11" opacity="0">✓ 1 result shared with all 5 waiters
    <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.1;0.5;0.55;0.9;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <rect x="30" y="352" width="700" height="46" rx="10" fill="#0b1220" stroke="#334155"/>
  <text x="46" y="372" class="note" fill="#e2e8f0">Request coalescing (single-flight) collapses N concurrent cache misses into exactly 1 origin request —</text>
  <text x="46" y="390" class="note">the other N-1 requests wait and share that one result, so the database never sees the thundering herd in the left panel.</text>
</svg>
