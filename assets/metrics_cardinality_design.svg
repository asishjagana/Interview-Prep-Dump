<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 700" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="mcbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="mcG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6ee7b7"/></marker>
    <marker id="mcR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#fca5a5"/></marker>
    <marker id="mcB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#93c5fd"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .cap{fill:#e2e8f0;font-size:11px}
      .lbl{fill:#f8fafc;font-size:12px;font-weight:700}
      .mono{font-family:'Consolas','Courier New',monospace;font-size:10px;fill:#e2e8f0}
      .node{fill:#0b1220;stroke-width:2}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="780" height="700" rx="16" fill="url(#mcbg)"/>
  <text x="30" y="38" class="t">Metrics Design &amp; Cardinality</text>
  <text x="30" y="58" class="sub">pick the instrument by the question you'll ask · series = the PRODUCT of label value counts</text>

  <!-- ============ PANEL A: THE FOUR INSTRUMENTS ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="72" width="728" height="150" rx="10" fill="#0b1220" stroke="#2563eb" stroke-width="2.5"/>
    <text x="44" y="94" class="hd" fill="#93c5fd">A. THE FOUR INSTRUMENTS — and whether they survive being added up across a fleet</text>

    <rect x="44" y="104" width="168" height="104" rx="8" class="node" stroke="#16a34a"/>
    <text x="128" y="122" text-anchor="middle" class="lbl" fill="#6ee7b7" font-size="11">COUNTER</text>
    <polyline points="60,166 88,158 116,150 144,142 172,128 196,120" fill="none" stroke="#6ee7b7" stroke-width="2"/>
    <text x="128" y="182" text-anchor="middle" class="cap" font-size="9">only goes up · resets to 0 on restart</text>
    <text x="128" y="194" text-anchor="middle" class="mono" font-size="9" fill="#bbf7d0">rate(x_total[5m])</text>
    <text x="128" y="204" text-anchor="middle" class="cap" font-size="9" fill="#6ee7b7">✓ sums across instances</text>

    <rect x="224" y="104" width="168" height="104" rx="8" class="node" stroke="#2563eb"/>
    <text x="308" y="122" text-anchor="middle" class="lbl" fill="#93c5fd" font-size="11">GAUGE</text>
    <polyline points="240,160 262,140 284,168 306,132 328,158 350,144 372,164" fill="none" stroke="#93c5fd" stroke-width="2"/>
    <text x="308" y="182" text-anchor="middle" class="cap" font-size="9">a value right now · up and down</text>
    <text x="308" y="194" text-anchor="middle" class="mono" font-size="9" fill="#bfdbfe">queue_depth, mem_bytes</text>
    <text x="308" y="204" text-anchor="middle" class="cap" font-size="9" fill="#fbbf24">⚠ sum? avg? depends on meaning</text>

    <rect x="404" y="104" width="168" height="104" rx="8" fill="#052e1a" stroke="#16a34a" stroke-width="2.5"/>
    <text x="488" y="122" text-anchor="middle" class="lbl" fill="#6ee7b7" font-size="11">HISTOGRAM</text>
    <rect x="424" y="150" width="16" height="18" fill="#34d399"/>
    <rect x="446" y="140" width="16" height="28" fill="#34d399"/>
    <rect x="468" y="132" width="16" height="36" fill="#34d399"/>
    <rect x="490" y="146" width="16" height="22" fill="#34d399"/>
    <rect x="512" y="156" width="16" height="12" fill="#34d399"/>
    <rect x="534" y="161" width="16" height="7" fill="#34d399"/>
    <text x="488" y="182" text-anchor="middle" class="cap" font-size="9">cumulative buckets are ADDABLE</text>
    <text x="488" y="194" text-anchor="middle" class="mono" font-size="9" fill="#bbf7d0">sum by(le) → histogram_quantile</text>
    <text x="488" y="204" text-anchor="middle" class="cap" font-size="9" fill="#fbbf24">cost: 1 series PER BUCKET</text>

    <rect x="584" y="104" width="170" height="104" rx="8" fill="#3a0f12" stroke="#dc2626" stroke-width="2.5"/>
    <text x="669" y="122" text-anchor="middle" class="lbl" fill="#fca5a5" font-size="11">SUMMARY</text>
    <text x="669" y="146" text-anchor="middle" class="mono" font-size="10" fill="#fecaca">{quantile="0.99"} 0.42</text>
    <text x="669" y="164" text-anchor="middle" class="cap" font-size="9" fill="#fca5a5">quantile computed IN the process</text>
    <text x="669" y="182" text-anchor="middle" class="cap" font-size="10" fill="#fca5a5" font-weight="700">✗ cannot be aggregated</text>
    <text x="669" y="196" text-anchor="middle" class="cap" font-size="9" fill="#fecaca">avg(p99 of A, p99 of B) is not</text>
    <text x="669" y="206" text-anchor="middle" class="cap" font-size="9" fill="#fecaca">the fleet p99 — it's nothing at all</text>
  </g>

  <!-- ============ PANEL B: CARDINALITY IS A PRODUCT ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="234" width="728" height="216" rx="10" fill="#0b1220" stroke="#d97706" stroke-width="2.5"/>
    <text x="44" y="256" class="hd" fill="#fbbf24">B. CARDINALITY MULTIPLIES — humans add, time series databases multiply</text>

    <rect x="44" y="268" width="86" height="34" rx="6" class="node" stroke="#334155"/>
    <text x="87" y="283" text-anchor="middle" class="cap" font-size="10">route</text>
    <text x="87" y="296" text-anchor="middle" class="lbl" font-size="12" fill="#93c5fd">40</text>
    <text x="140" y="290" text-anchor="middle" class="lbl" font-size="14">×</text>
    <rect x="152" y="268" width="86" height="34" rx="6" class="node" stroke="#334155"/>
    <text x="195" y="283" text-anchor="middle" class="cap" font-size="10">status</text>
    <text x="195" y="296" text-anchor="middle" class="lbl" font-size="12" fill="#93c5fd">5</text>
    <text x="248" y="290" text-anchor="middle" class="lbl" font-size="14">×</text>
    <rect x="260" y="268" width="86" height="34" rx="6" class="node" stroke="#334155"/>
    <text x="303" y="283" text-anchor="middle" class="cap" font-size="10">method</text>
    <text x="303" y="296" text-anchor="middle" class="lbl" font-size="12" fill="#93c5fd">4</text>
    <text x="356" y="290" text-anchor="middle" class="lbl" font-size="14">×</text>
    <rect x="368" y="268" width="86" height="34" rx="6" class="node" stroke="#334155"/>
    <text x="411" y="283" text-anchor="middle" class="cap" font-size="10">pod</text>
    <text x="411" y="296" text-anchor="middle" class="lbl" font-size="12" fill="#93c5fd">20</text>
    <text x="464" y="290" text-anchor="middle" class="lbl" font-size="14">=</text>
    <rect x="480" y="264" width="274" height="42" rx="7" fill="#052e1a" stroke="#16a34a" stroke-width="2.5"/>
    <text x="617" y="281" text-anchor="middle" class="lbl" fill="#6ee7b7" font-size="12">16,000 series ≈ 128 MB RAM</text>
    <text x="617" y="297" text-anchor="middle" class="cap" font-size="9" fill="#6ee7b7">healthy — bounded, and every label is queried</text>

    <rect x="44" y="318" width="410" height="42" rx="7" fill="#3a0f12" stroke="#dc2626" stroke-width="2"/>
    <text x="249" y="336" text-anchor="middle" class="cap" font-size="11" fill="#fca5a5">…now add one innocent label: <tspan class="mono" fill="#fecaca">user_id</tspan> (2,000,000 values)</text>
    <text x="249" y="352" text-anchor="middle" class="cap" font-size="10" fill="#fca5a5">16,000 × 2,000,000 = 32,000,000,000 series</text>
    <line x1="458" y1="339" x2="476" y2="339" stroke="#fca5a5" stroke-width="2" marker-end="url(#mcR)"/>
    <rect x="480" y="318" width="274" height="42" rx="7" fill="#3a0f12" stroke="#dc2626" stroke-width="2.5"/>
    <text x="617" y="336" text-anchor="middle" class="lbl" fill="#fca5a5" font-size="12">OOM — during the incident</text>
    <text x="617" y="352" text-anchor="middle" class="cap" font-size="9" fill="#fca5a5">rule of thumb: ~8 KB of RAM per ACTIVE series</text>

    <rect x="44" y="372" width="350" height="66" rx="7" class="node" stroke="#dc2626"/>
    <text x="56" y="390" class="cap" font-size="10" font-weight="700" fill="#fca5a5">The classic bombs</text>
    <text x="56" y="405" class="cap" font-size="9">user_id · email · order_id · session_id · full URL path</text>
    <text x="56" y="418" class="cap" font-size="9">error message text · timestamps · IP address</text>
    <text x="56" y="431" class="cap" font-size="9" fill="#fbbf24">CHURN: pod name / container ID — every deploy mints new series</text>

    <rect x="406" y="372" width="348" height="66" rx="7" class="node" stroke="#16a34a"/>
    <text x="418" y="390" class="cap" font-size="10" font-weight="700" fill="#6ee7b7">The fixes, in order of leverage</text>
    <text x="418" y="405" class="cap" font-size="9">templatize: /users/12345 → /users/:id (+ allowlist)</text>
    <text x="418" y="418" class="cap" font-size="9">bucket it: customer_id → customer_tier (3 values)</text>
    <text x="418" y="431" class="cap" font-size="9">top-50 tenants + "other" · labeldrop churny k8s labels</text>
  </g>

  <!-- ============ PANEL C: SHOULD THIS BE A LABEL? ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="462" width="728" height="172" rx="10" fill="#0b1220" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="44" y="484" class="hd" fill="#c4b5fd">C. "SHOULD THIS FIELD BE A LABEL?" — the question to ask in every code review</text>

    <rect x="44" y="496" width="150" height="46" rx="7" fill="#2e1065" stroke="#7c3aed" stroke-width="2"/>
    <text x="119" y="516" text-anchor="middle" class="cap" font-size="11" fill="#c4b5fd" font-weight="700">a field you want</text>
    <text x="119" y="530" text-anchor="middle" class="cap" font-size="11" fill="#c4b5fd" font-weight="700">to attach</text>

    <rect x="228" y="490" width="176" height="26" rx="6" class="node" stroke="#334155"/>
    <text x="316" y="507" text-anchor="middle" class="cap" font-size="10">bounded (&lt;~100) AND grouped by?</text>
    <rect x="228" y="524" width="176" height="26" rx="6" class="node" stroke="#334155"/>
    <text x="316" y="541" text-anchor="middle" class="cap" font-size="10">unbounded, need the request?</text>
    <rect x="228" y="558" width="176" height="26" rx="6" class="node" stroke="#334155"/>
    <text x="316" y="575" text-anchor="middle" class="cap" font-size="10">never actually queried?</text>

    <line x1="196" y1="512" x2="224" y2="503" stroke="#c4b5fd" stroke-width="1.8" marker-end="url(#mcB)"/>
    <line x1="196" y1="519" x2="224" y2="537" stroke="#c4b5fd" stroke-width="1.8" marker-end="url(#mcB)"/>
    <line x1="196" y1="526" x2="224" y2="571" stroke="#c4b5fd" stroke-width="1.8" marker-end="url(#mcB)"/>

    <rect x="428" y="488" width="326" height="30" rx="6" fill="#052e1a" stroke="#16a34a" stroke-width="2"/>
    <text x="591" y="507" text-anchor="middle" class="cap" font-size="10" fill="#6ee7b7">✅ METRIC LABEL — cheap, aggregatable, alertable</text>

    <rect x="428" y="522" width="326" height="30" rx="6" fill="#0c2b3f" stroke="#2563eb" stroke-width="2"/>
    <text x="591" y="535" text-anchor="middle" class="cap" font-size="10" fill="#93c5fd">✅ TRACE + LOG, linked by an EXEMPLAR on the bucket</text>
    <text x="591" y="547" text-anchor="middle" class="cap" font-size="9" fill="#93c5fd">click the slow bucket → the actual request · costs ZERO series</text>

    <rect x="428" y="556" width="326" height="30" rx="6" fill="#3a0f12" stroke="#dc2626" stroke-width="2"/>
    <text x="591" y="575" text-anchor="middle" class="cap" font-size="10" fill="#fca5a5">✗ DROP IT — an unqueried label is pure cost, forever</text>

    <line x1="408" y1="503" x2="424" y2="503" stroke="#6ee7b7" stroke-width="1.8" marker-end="url(#mcG)"/>
    <line x1="408" y1="537" x2="424" y2="537" stroke="#93c5fd" stroke-width="1.8" marker-end="url(#mcB)"/>
    <line x1="408" y1="571" x2="424" y2="571" stroke="#fca5a5" stroke-width="1.8" marker-end="url(#mcR)"/>

    <rect x="44" y="596" width="710" height="26" rx="6" class="node" stroke="#334155"/>
    <text x="399" y="613" text-anchor="middle" class="cap" font-size="10">RED for services (Rate · Errors · Duration — the symptom users feel) &#160;·&#160; USE for resources (Utilization · Saturation · Errors — the cause inside the box)</text>
  </g>

  <!-- ============ CALLOUT ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="644" width="728" height="42" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="390" y="664" text-anchor="middle" class="hd">Samples are ~1.3–2 bytes. Series are ~8 KB of RAM. Add columns freely; add rows on purpose.</text>
    <text x="390" y="679" text-anchor="middle" class="cap" fill="#5b21b6" font-size="10">the only monitoring failure that really matters is the one where the monitoring is what failed</text>
  </g>
</svg>
