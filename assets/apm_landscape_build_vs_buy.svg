<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 730" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="apbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="apP" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#c4b5fd"/></marker>
    <marker id="apG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6ee7b7"/></marker>
    <marker id="apB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#93c5fd"/></marker>
    <marker id="apA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#fbbf24"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .cap{fill:#e2e8f0;font-size:11px}
      .lbl{fill:#f8fafc;font-size:12px;font-weight:700}
      .mono{font-family:'Consolas','Courier New',monospace;font-size:10px;fill:#e2e8f0}
      .node{fill:#0b1220;stroke-width:2}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="780" height="730" rx="16" fill="url(#apbg)"/>
  <text x="30" y="38" class="t">APM &amp; Observability Tooling — build, buy, or the seam between</text>
  <text x="30" y="58" class="sub">you're not choosing a tool, you're choosing a cost curve and an exit cost</text>

  <!-- ============ PANEL A: THREE LAYERS ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="72" width="728" height="176" rx="10" fill="#0b1220" stroke="#2563eb" stroke-width="2.5"/>
    <text x="44" y="94" class="hd" fill="#93c5fd">A. THREE LAYERS VENDORS SOLD AS ONE — and the seam that makes the third replaceable</text>

    <rect x="44" y="104" width="710" height="32" rx="7" fill="#2e1065" stroke="#7c3aed" stroke-width="2"/>
    <text x="58" y="124" class="cap" font-size="11" font-weight="700" fill="#c4b5fd">① INSTRUMENTATION</text>
    <text x="200" y="118" class="cap" font-size="10">OpenTelemetry SDKs + auto-instrumentation &#160;·&#160; vendor agents (bytecode injection) &#160;·&#160; eBPF zero-code</text>
    <text x="200" y="131" class="cap" font-size="9" fill="#c4b5fd">the STICKY layer — whatever you write here is what a migration would have to rewrite</text>

    <rect x="44" y="142" width="710" height="32" rx="7" fill="#2e1065" stroke="#7c3aed" stroke-width="2"/>
    <text x="58" y="162" class="cap" font-size="11" font-weight="700" fill="#c4b5fd">② PIPELINE</text>
    <text x="200" y="156" class="cap" font-size="10">OTel Collector &#160;·&#160; Vector &#160;·&#160; Fluent Bit &#160;·&#160; Cribl</text>
    <text x="200" y="169" class="cap" font-size="9" fill="#6ee7b7">own this: sampling, redaction, per-team quotas and routing all live here, centrally</text>

    <rect x="44" y="180" width="350" height="56" rx="7" fill="#052e1a" stroke="#16a34a" stroke-width="2"/>
    <text x="58" y="198" class="cap" font-size="11" font-weight="700" fill="#6ee7b7">③ BACKEND — open source</text>
    <text x="58" y="213" class="cap" font-size="9">Prometheus/Mimir/VictoriaMetrics · Loki/ClickHouse/OpenSearch</text>
    <text x="58" y="225" class="cap" font-size="9">Tempo/Jaeger · Pyroscope · Grafana · SigNoz (all-in-one)</text>

    <rect x="404" y="180" width="350" height="56" rx="7" fill="#0c2b3f" stroke="#2563eb" stroke-width="2"/>
    <text x="418" y="198" class="cap" font-size="11" font-weight="700" fill="#93c5fd">③ BACKEND — commercial</text>
    <text x="418" y="213" class="cap" font-size="9">Datadog · Dynatrace · New Relic · Splunk · Honeycomb · Elastic</text>
    <text x="418" y="225" class="cap" font-size="9">Grafana Cloud · Chronosphere · CloudWatch / Azure Monitor / GCP Ops</text>

    <line x1="399" y1="176" x2="399" y2="180" stroke="#6ee7b7" stroke-width="2"/>
    <text x="399" y="176" text-anchor="middle" class="cap" font-size="9" fill="#6ee7b7" font-weight="700">↕ if ① is OTel, ③ is a config change</text>
  </g>

  <!-- ============ PANEL B: PRICING CLIFFS + TCO ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="260" width="728" height="216" rx="10" fill="#0b1220" stroke="#d97706" stroke-width="2.5"/>
    <text x="44" y="282" class="hd" fill="#fbbf24">B. EVERY PRICING MODEL HAS A CLIFF — pick the one whose cliff you won't hit</text>

    <rect x="44" y="292" width="330" height="20" rx="4" class="node" stroke="#334155"/>
    <text x="56" y="306" class="cap" font-size="10">per HOST &#160;→&#160; <tspan fill="#fca5a5">containers + autoscaling bill you at peak</tspan></text>
    <rect x="44" y="316" width="330" height="20" rx="4" class="node" stroke="#334155"/>
    <text x="56" y="330" class="cap" font-size="10">per GB INGESTED &#160;→&#160; <tspan fill="#fca5a5">one team turns on DEBUG</tspan></text>
    <rect x="44" y="340" width="330" height="20" rx="4" class="node" stroke="#334155"/>
    <text x="56" y="354" class="cap" font-size="10">per CUSTOM METRIC &#160;→&#160; <tspan fill="#fca5a5">a label is a purchase order</tspan></text>
    <rect x="44" y="364" width="330" height="20" rx="4" class="node" stroke="#334155"/>
    <text x="56" y="378" class="cap" font-size="10">per USER &#160;→&#160; <tspan fill="#fca5a5">taxes the access you actually want</tspan></text>
    <rect x="44" y="388" width="330" height="20" rx="4" class="node" stroke="#334155"/>
    <text x="56" y="402" class="cap" font-size="10">per SESSION (RUM) &#160;→&#160; <tspan fill="#fca5a5">consumer-scale front ends</tspan></text>
    <rect x="44" y="412" width="330" height="20" rx="4" fill="#052e1a" stroke="#16a34a" stroke-width="1.8"/>
    <text x="56" y="426" class="cap" font-size="10" fill="#6ee7b7">per EVENT &#160;→&#160; at least it makes SAMPLING the lever</text>
    <rect x="44" y="436" width="330" height="20" rx="4" fill="#3a2a0a" stroke="#d97706" stroke-width="1.8"/>
    <text x="56" y="450" class="cap" font-size="10" fill="#fbbf24">SELF-HOSTED &#160;→&#160; 2–4 permanent engineers, plus their pager</text>

    <text x="406" y="306" class="cap" font-size="10" font-weight="700" fill="#fbbf24">Worked TCO — 200 hosts · 5 TB logs/mo · 2M series</text>
    <text x="406" y="320" class="cap" font-size="9" fill="#94a3b8">monthly, list prices before the usual 30–60% enterprise discount</text>

    <text x="406" y="342" class="cap" font-size="10">BUY</text>
    <rect x="446" y="332" width="230" height="16" rx="3" fill="#60a5fa"/>
    <text x="684" y="345" class="cap" font-size="10" fill="#93c5fd">$35–50k</text>
    <text x="446" y="360" class="cap" font-size="8" fill="#94a3b8">infra $3.6k · APM $7.2k · metrics $1k · logs $15–25k · RUM $5–10k</text>

    <text x="406" y="386" class="cap" font-size="10">BUILD</text>
    <rect x="446" y="376" width="52" height="16" rx="3" fill="#34d399"/>
    <rect x="498" y="376" width="230" height="16" rx="3" fill="#f87171"/>
    <text x="472" y="404" text-anchor="middle" class="cap" font-size="8" fill="#6ee7b7">infra $6–12k</text>
    <text x="613" y="404" text-anchor="middle" class="cap" font-size="8" fill="#fca5a5">2–4 FTE loaded ≈ $33–83k — the real cost</text>

    <rect x="406" y="414" width="330" height="42" rx="6" fill="#052e1a" stroke="#16a34a" stroke-width="2"/>
    <text x="571" y="431" text-anchor="middle" class="cap" font-size="10" fill="#6ee7b7" font-weight="700">HYBRID: vendor for traces+metrics, self-host the logs</text>
    <text x="571" y="447" text-anchor="middle" class="cap" font-size="9" fill="#6ee7b7">removes 40–70% of the bill and changes nobody's workflow</text>
  </g>

  <!-- ============ PANEL C: DUAL-SHIP MIGRATION ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="488" width="728" height="172" rx="10" fill="#0b1220" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="44" y="510" class="hd" fill="#c4b5fd">C. THE ESCAPE HATCH — dual-ship through a collector you own</text>

    <rect x="44" y="522" width="140" height="70" rx="7" class="node" stroke="#334155"/>
    <text x="114" y="546" text-anchor="middle" class="cap" font-size="10" font-weight="700">500 services</text>
    <text x="114" y="562" text-anchor="middle" class="cap" font-size="9">OTel SDK +</text>
    <text x="114" y="574" text-anchor="middle" class="cap" font-size="9">auto-instrumentation</text>

    <rect x="212" y="522" width="160" height="70" rx="7" fill="#2e1065" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="292" y="542" text-anchor="middle" class="cap" font-size="10" font-weight="700" fill="#c4b5fd">OTel Collector</text>
    <text x="292" y="557" text-anchor="middle" class="cap" font-size="9" fill="#c4b5fd">tail sampling · redaction</text>
    <text x="292" y="569" text-anchor="middle" class="cap" font-size="9" fill="#c4b5fd">per-team quotas · routing</text>
    <text x="292" y="583" text-anchor="middle" class="cap" font-size="8" fill="#fbbf24">tier-0: HA it, monitor its drop counters</text>

    <rect x="424" y="510" width="152" height="30" rx="6" fill="#0c2b3f" stroke="#2563eb" stroke-width="2"/>
    <text x="500" y="529" text-anchor="middle" class="cap" font-size="10" fill="#93c5fd">incumbent vendor — traces + metrics</text>

    <rect x="424" y="546" width="152" height="30" rx="6" fill="#3a2a0a" stroke="#d97706" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="500" y="560" text-anchor="middle" class="cap" font-size="10" fill="#fbbf24">candidate backend</text>
    <text x="500" y="571" text-anchor="middle" class="cap" font-size="8" fill="#fbbf24">same data, 4–8 weeks — the only honest eval</text>

    <rect x="424" y="582" width="152" height="30" rx="6" fill="#052e1a" stroke="#16a34a" stroke-width="2"/>
    <text x="500" y="596" text-anchor="middle" class="cap" font-size="10" fill="#6ee7b7">self-hosted logs → Loki / ClickHouse</text>
    <text x="500" y="607" text-anchor="middle" class="cap" font-size="8" fill="#6ee7b7">+ S3 archive at $0.023/GB·mo</text>

    <line x1="186" y1="557" x2="208" y2="557" stroke="#c4b5fd" stroke-width="2" marker-end="url(#apP)"/>
    <line x1="374" y1="550" x2="420" y2="527" stroke="#93c5fd" stroke-width="2" marker-end="url(#apB)"/>
    <line x1="374" y1="559" x2="420" y2="561" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#apA)"/>
    <line x1="374" y1="568" x2="420" y2="594" stroke="#6ee7b7" stroke-width="2" marker-end="url(#apG)"/>

    <rect x="604" y="522" width="150" height="70" rx="7" class="node" stroke="#334155"/>
    <text x="679" y="542" text-anchor="middle" class="cap" font-size="10" font-weight="700">one pane of glass</text>
    <text x="679" y="558" text-anchor="middle" class="cap" font-size="9">metric → exemplar → trace</text>
    <text x="679" y="570" text-anchor="middle" class="cap" font-size="9">→ logs → profile</text>
    <text x="679" y="584" text-anchor="middle" class="cap" font-size="8" fill="#94a3b8">this correlation IS the product</text>
    <line x1="580" y1="525" x2="600" y2="545" stroke="#93c5fd" stroke-width="1.6" marker-end="url(#apB)"/>
    <line x1="580" y1="597" x2="600" y2="572" stroke="#6ee7b7" stroke-width="1.6" marker-end="url(#apG)"/>

    <rect x="44" y="602" width="710" height="44" rx="7" fill="#3a0f12" stroke="#dc2626" stroke-width="2"/>
    <text x="399" y="620" text-anchor="middle" class="cap" font-size="10" fill="#fca5a5" font-weight="700">Datadog's own 2021 shareholder letter disclosed a $65M/year single-customer contract — usage pricing compounds invisibly until it doesn't</text>
    <text x="399" y="636" text-anchor="middle" class="cap" font-size="9" fill="#fca5a5">budget 5–15% of infrastructure spend · above ~20% it's a governance problem, not a tooling problem · model the bill at 5× BEFORE you sign</text>
  </g>

  <!-- ============ CALLOUT ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="670" width="728" height="42" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="390" y="690" text-anchor="middle" class="hd">Instrument with OTel regardless of who you buy from — that one choice keeps the backend competitive</text>
    <text x="390" y="705" text-anchor="middle" class="cap" fill="#5b21b6" font-size="10">the cheapest observability platform is always the one you send less data to</text>
  </g>
</svg>
