<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="lcbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="lcMsg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#fbbf24"/></marker>
    <marker id="lcConc" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#fca5a5"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .cap{fill:#e2e8f0;font-size:11px}
      .mut{fill:#94a3b8;font-size:10px}
      .lbl{fill:#f8fafc;font-size:13px;font-weight:700}
      .lam{fill:#6ee7b7;font-size:13px;font-weight:800}
      .vec{fill:#c4b5fd;font-size:11px;font-weight:700}
      .node{fill:#0b1220;stroke-width:2}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="760" height="600" rx="16" fill="url(#lcbg)"/>
  <text x="30" y="40" class="t">Logical Clocks: Lamport vs Vector</text>
  <text x="30" y="62" class="sub">ordering events with no trustworthy global clock — green = Lamport counter, purple = vector clock</text>

  <!-- ============ TIMELINE PANEL ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="80" width="708" height="356" rx="10" fill="#0b1220" stroke="#2563eb" stroke-width="2.5"/>
    <text x="44" y="104" class="hd" fill="#93c5fd">3 processes exchange messages — watch the counters update</text>

    <!-- process timelines -->
    <line x1="110" y1="170" x2="700" y2="170" stroke="#334155" stroke-width="2"/>
    <line x1="110" y1="285" x2="700" y2="285" stroke="#334155" stroke-width="2"/>
    <line x1="110" y1="400" x2="700" y2="400" stroke="#334155" stroke-width="2"/>
    <text x="44" y="175" class="lbl" fill="#16a34a">P1</text>
    <text x="44" y="290" class="lbl" fill="#2563eb">P2</text>
    <text x="44" y="405" class="lbl" fill="#7c3aed">P3</text>
    <text x="690" y="150" class="mut" text-anchor="end">time →</text>
  </g>

  <!-- ============ MESSAGE ARROWS ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.5s" fill="freeze"/>
    <!-- m1: P1.B -> P2 recv -->
    <line x1="272" y1="172" x2="356" y2="283" stroke="#fbbf24" stroke-width="2" marker-end="url(#lcMsg)"/>
    <text x="300" y="238" class="mut" fill="#fbbf24">m1</text>
    <!-- m2: P2.C -> P3 recv -->
    <line x1="472" y1="287" x2="556" y2="398" stroke="#fbbf24" stroke-width="2" marker-end="url(#lcMsg)"/>
    <text x="500" y="353" class="mut" fill="#fbbf24">m2</text>
  </g>

  <!-- ============ EVENTS: P1 ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.5s" fill="freeze"/>
    <!-- A local -->
    <circle cx="150" cy="170" r="7" class="node" stroke="#16a34a"/>
    <text x="150" y="150" text-anchor="middle" class="lam">1</text>
    <text x="150" y="196" text-anchor="middle" class="mut">A local</text>
    <text x="150" y="215" text-anchor="middle" class="vec">[1,0,0]</text>
    <!-- B send (write X=1) -->
    <circle cx="270" cy="170" r="8" class="node" stroke="#dc2626" stroke-width="2.5"/>
    <text x="270" y="150" text-anchor="middle" class="lam">2</text>
    <text x="270" y="196" text-anchor="middle" class="mut" fill="#fca5a5">B: write X=1, send m1</text>
    <text x="270" y="215" text-anchor="middle" class="vec" fill="#fca5a5">[2,0,0]</text>
  </g>

  <!-- ============ EVENTS: P2 ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.5s" fill="freeze"/>
    <!-- recv m1 -->
    <circle cx="360" cy="285" r="7" class="node" stroke="#2563eb"/>
    <text x="360" y="265" text-anchor="middle" class="lam">3</text>
    <text x="360" y="311" text-anchor="middle" class="mut">recv m1 = max(0,2)+1</text>
    <text x="360" y="330" text-anchor="middle" class="vec">[2,1,0]</text>
    <!-- C send -->
    <circle cx="470" cy="285" r="7" class="node" stroke="#2563eb"/>
    <text x="470" y="265" text-anchor="middle" class="lam">4</text>
    <text x="470" y="311" text-anchor="middle" class="mut">C: send m2</text>
    <text x="470" y="330" text-anchor="middle" class="vec">[2,2,0]</text>
  </g>

  <!-- ============ EVENTS: P3 ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.5s" fill="freeze"/>
    <!-- D local (write X=2) - concurrent with B -->
    <circle cx="300" cy="400" r="8" class="node" stroke="#dc2626" stroke-width="2.5"/>
    <text x="300" y="431" text-anchor="middle" class="mut" fill="#fca5a5">D: write X=2</text>
    <text x="300" y="380" text-anchor="middle" class="lam">1</text>
    <text x="270" y="400" text-anchor="end" class="vec" fill="#fca5a5">[0,0,1]</text>
  </g>
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.5s" fill="freeze"/>
    <!-- recv m2 -->
    <circle cx="560" cy="400" r="7" class="node" stroke="#7c3aed"/>
    <text x="560" y="380" text-anchor="middle" class="lam">5</text>
    <text x="560" y="424" text-anchor="middle" class="mut">recv m2 = max(1,4)+1</text>
    <text x="620" y="404" class="vec">[2,2,2]</text>
  </g>

  <!-- ============ CONCURRENCY HIGHLIGHT ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.6s" fill="freeze"/>
    <path d="M270,183 C255,300 285,300 300,388" fill="none" stroke="#fca5a5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#lcConc)"/>
    <rect x="330" y="440" width="404" height="52" rx="8" fill="#0b1220" stroke="#d97706" stroke-width="2"/>
    <text x="344" y="460" class="cap" fill="#fbbf24" font-weight="700">B [2,0,0]  vs  D [0,0,1]  →  neither ≤ the other</text>
    <text x="344" y="480" class="mut" fill="#fca5a5">CONCURRENT writes = conflict (Dynamo/Riak siblings). Lamport says 2&gt;1, falsely ordering them.</text>
  </g>

  <!-- ============ BOTTOM CALLOUT ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="504" width="708" height="72" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="380" y="528" text-anchor="middle" class="hd">Lamport = total order consistent with causality, but CAN'T detect concurrency</text>
    <text x="380" y="548" text-anchor="middle" class="hd">Vector = detects causal vs concurrent (conflict detection), costs O(N) size</text>
    <text x="380" y="567" text-anchor="middle" class="cap" fill="#5b21b6" font-size="10">HLC adds real-time closeness (physical time + logical counter) — used by CockroachDB; TrueTime bounds uncertainty with atomic clocks</text>
  </g>
</svg>
