<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 730" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="adbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="adR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#fca5a5"/></marker>
    <marker id="adG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6ee7b7"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .cap{fill:#e2e8f0;font-size:11px}
      .lbl{fill:#f8fafc;font-size:12px;font-weight:700}
      .mono{font-family:'Consolas','Courier New',monospace;font-size:10px;fill:#e2e8f0}
      .node{fill:#0b1220;stroke-width:2}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="780" height="730" rx="16" fill="url(#adbg)"/>
  <text x="30" y="38" class="t">Anomaly Detection &amp; Alert Correlation</text>
  <text x="30" y="58" class="sub">detecting the problem is the easy half — the hard half is emitting exactly one page about it</text>

  <!-- ============ PANEL A: THREE DETECTORS, ONE SEASONAL SERIES ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="72" width="728" height="196" rx="10" fill="#0b1220" stroke="#2563eb" stroke-width="2.5"/>
    <text x="44" y="94" class="hd" fill="#93c5fd">A. THE SAME WEEK, THREE DETECTORS — why a flat line is wrong twice</text>

    <!-- expected band (thick translucent stroke along the seasonal centre line) -->
    <polyline fill="none" stroke="#34d399" stroke-width="24" stroke-opacity="0.20" stroke-linejoin="round" stroke-linecap="round"
      points="70,215 85,210 100,198 115,180 130,168 145,166 160,178 175,195 190,208 205,214
              220,215 235,210 250,198 265,180 280,168 295,166 310,178 325,195 340,208 355,214
              370,215 385,210 400,198 415,180 430,168 445,166 460,178 475,195 490,208 505,214
              520,215 535,210 550,198 565,180 580,168 595,166 610,178 625,195 640,208 655,214"/>

    <!-- actual data, with the overnight anomaly and the legitimate daytime spike -->
    <polyline fill="none" stroke="#93c5fd" stroke-width="2"
      points="70,215 85,210 100,198 115,180 130,168 145,166 160,178 175,195 190,208 205,214
              220,215 235,210 250,198 265,180 280,168 295,166 310,178 325,195 340,208 355,214
              370,215 385,210 400,198 415,180 430,168 445,166 460,178 475,190 490,172 505,168
              520,170 535,196 550,198 565,180 580,138 595,134 610,178 625,195 640,208 655,214"/>

    <!-- static threshold -->
    <line x1="60" y1="150" x2="700" y2="150" stroke="#f87171" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="706" y="147" class="cap" font-size="9" fill="#fca5a5">static</text>
    <text x="706" y="158" class="cap" font-size="9" fill="#fca5a5">threshold</text>

    <!-- annotations -->
    <circle cx="505" cy="168" r="7" fill="none" stroke="#fca5a5" stroke-width="2.5">
      <animate attributeName="r" values="7;11;7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <line x1="505" y1="176" x2="470" y2="240" stroke="#fca5a5" stroke-width="1.4"/>
    <rect x="352" y="240" width="232" height="22" rx="5" fill="#3a0f12" stroke="#dc2626" stroke-width="1.6"/>
    <text x="468" y="255" text-anchor="middle" class="cap" font-size="9" fill="#fca5a5">REAL incident at 3am — never crosses the flat line</text>

    <circle cx="588" cy="136" r="7" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    <line x1="596" y1="136" x2="640" y2="128" stroke="#fbbf24" stroke-width="1.4"/>
    <rect x="596" y="100" width="152" height="30" rx="5" fill="#3a2a0a" stroke="#d97706" stroke-width="1.6"/>
    <text x="672" y="113" text-anchor="middle" class="cap" font-size="9" fill="#fbbf24">legit marketing spike →</text>
    <text x="672" y="124" text-anchor="middle" class="cap" font-size="9" fill="#fbbf24">the flat line pages anyway</text>

    <rect x="44" y="240" width="296" height="22" rx="5" fill="#052e1a" stroke="#16a34a" stroke-width="1.6"/>
    <text x="192" y="255" text-anchor="middle" class="cap" font-size="9" fill="#6ee7b7">green band = same minute-of-week, prior weeks · median ± k·MAD</text>
    <text x="600" y="255" class="cap" font-size="9" fill="#94a3b8">MAD survives 50% bad data — σ does not</text>
  </g>

  <!-- ============ PANEL B: BASE RATE + THE FUNNEL ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="280" width="728" height="212" rx="10" fill="#0b1220" stroke="#dc2626" stroke-width="2.5"/>
    <text x="44" y="302" class="hd" fill="#fca5a5">B. WHY DETECTION ALONE FAILS (base rate) — and what turns a storm into one page (correlation)</text>

    <rect x="44" y="312" width="216" height="118" rx="8" fill="#3a0f12" stroke="#dc2626" stroke-width="2"/>
    <text x="152" y="330" text-anchor="middle" class="cap" font-size="10" font-weight="700" fill="#fca5a5">the arithmetic to run FIRST</text>
    <text x="56" y="348" class="mono" font-size="10" fill="#fecaca">10,000 series × 1,440 min</text>
    <text x="56" y="362" class="mono" font-size="10" fill="#fecaca">= 14,400,000 checks/day</text>
    <text x="56" y="380" class="mono" font-size="10" fill="#fecaca">specificity 99.9%</text>
    <text x="56" y="394" class="mono" font-size="10" fill="#fca5a5">⇒ 14,400 false alerts/day</text>
    <text x="56" y="412" class="mono" font-size="10" fill="#fca5a5">⇒ precision ≈ 0.014%</text>
    <text x="152" y="425" text-anchor="middle" class="cap" font-size="9" fill="#fecaca">never page on this — ticket it</text>

    <text x="284" y="330" class="cap" font-size="10" font-weight="700" fill="#fbbf24">one DB failover → 240 alerts → 1 page</text>

    <rect x="284" y="338" width="440" height="20" rx="4" fill="#3a0f12" stroke="#dc2626" stroke-width="1.6"/>
    <text x="504" y="352" text-anchor="middle" class="cap" font-size="9" fill="#fca5a5">240 raw alerts · 1 DB · 34 latency · 180 pod · 19 queue · 6 SLO</text>

    <rect x="318" y="362" width="372" height="18" rx="4" class="node" stroke="#7c3aed"/>
    <text x="504" y="375" text-anchor="middle" class="cap" font-size="9" fill="#c4b5fd">① dedupe by fingerprint (alertname + key labels)</text>

    <rect x="348" y="384" width="312" height="18" rx="4" class="node" stroke="#7c3aed"/>
    <text x="504" y="397" text-anchor="middle" class="cap" font-size="9" fill="#c4b5fd">② group_by [cluster, service] · group_wait 30s</text>

    <rect x="378" y="406" width="252" height="18" rx="4" fill="#3a2a0a" stroke="#d97706" stroke-width="1.8"/>
    <text x="504" y="419" text-anchor="middle" class="cap" font-size="9" fill="#fbbf24">③ INHIBIT downstream of a firing cause</text>

    <rect x="408" y="428" width="192" height="18" rx="4" class="node" stroke="#7c3aed"/>
    <text x="504" y="441" text-anchor="middle" class="cap" font-size="9" fill="#c4b5fd">④ persistence: for: 5m + hysteresis</text>

    <rect x="418" y="450" width="172" height="18" rx="4" fill="#052e1a" stroke="#16a34a" stroke-width="2"/>
    <text x="504" y="463" text-anchor="middle" class="cap" font-size="9" fill="#6ee7b7">⑤ enrich: recent deploys + upstream</text>

    <rect x="436" y="472" width="136" height="14" rx="4" fill="#052e1a" stroke="#16a34a" stroke-width="2.5"/>
    <text x="504" y="483" text-anchor="middle" class="cap" font-size="9" fill="#6ee7b7" font-weight="700">1 PAGE — names the cause</text>

    <rect x="44" y="440" width="216" height="46" rx="7" class="node" stroke="#334155"/>
    <text x="152" y="456" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">measure the alerting system itself:</text>
    <text x="152" y="469" text-anchor="middle" class="cap" font-size="9">≤2 pages per 12h shift · &gt;80% actionable</text>
    <text x="152" y="481" text-anchor="middle" class="cap" font-size="9">alert:incident ratio · % found before customers</text>
  </g>

  <!-- ============ PANEL C: BURN-RATE LADDER ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="504" width="728" height="156" rx="10" fill="#0b1220" stroke="#16a34a" stroke-width="2.5"/>
    <text x="44" y="526" class="hd" fill="#6ee7b7">C. FOR ANYTHING WITH AN SLO, THIS BEATS EVERY DETECTOR — multi-window, multi-burn-rate</text>

    <text x="60" y="546" class="cap" font-size="9" fill="#94a3b8">burn rate</text>
    <text x="170" y="546" class="cap" font-size="9" fill="#94a3b8">long window</text>
    <text x="300" y="546" class="cap" font-size="9" fill="#94a3b8">budget consumed</text>
    <text x="452" y="546" class="cap" font-size="9" fill="#94a3b8">short window (fast reset)</text>
    <text x="632" y="546" class="cap" font-size="9" fill="#94a3b8">action</text>

    <rect x="44" y="552" width="710" height="22" rx="4" fill="#3a0f12" stroke="#dc2626" stroke-width="1.8"/>
    <text x="60" y="567" class="mono" font-size="10" fill="#fecaca">14.4×</text>
    <text x="170" y="567" class="mono" font-size="10" fill="#fecaca">1 hour</text>
    <text x="300" y="567" class="mono" font-size="10" fill="#fecaca">2% of the month</text>
    <text x="452" y="567" class="mono" font-size="10" fill="#fecaca">5 min</text>
    <text x="632" y="567" class="cap" font-size="10" fill="#fca5a5" font-weight="700">PAGE</text>

    <rect x="44" y="578" width="710" height="22" rx="4" fill="#3a2a0a" stroke="#d97706" stroke-width="1.8"/>
    <text x="60" y="593" class="mono" font-size="10" fill="#fde68a">6×</text>
    <text x="170" y="593" class="mono" font-size="10" fill="#fde68a">6 hours</text>
    <text x="300" y="593" class="mono" font-size="10" fill="#fde68a">5%</text>
    <text x="452" y="593" class="mono" font-size="10" fill="#fde68a">30 min</text>
    <text x="632" y="593" class="cap" font-size="10" fill="#fbbf24" font-weight="700">PAGE</text>

    <rect x="44" y="604" width="710" height="22" rx="4" fill="#0c2b3f" stroke="#2563eb" stroke-width="1.8"/>
    <text x="60" y="619" class="mono" font-size="10" fill="#bfdbfe">3×</text>
    <text x="170" y="619" class="mono" font-size="10" fill="#bfdbfe">1 day</text>
    <text x="300" y="619" class="mono" font-size="10" fill="#bfdbfe">10%</text>
    <text x="452" y="619" class="mono" font-size="10" fill="#bfdbfe">2 hours</text>
    <text x="632" y="619" class="cap" font-size="10" fill="#93c5fd" font-weight="700">TICKET</text>

    <rect x="44" y="630" width="710" height="22" rx="4" fill="#0c2b3f" stroke="#2563eb" stroke-width="1.8"/>
    <text x="60" y="645" class="mono" font-size="10" fill="#bfdbfe">1×</text>
    <text x="170" y="645" class="mono" font-size="10" fill="#bfdbfe">3 days</text>
    <text x="300" y="645" class="mono" font-size="10" fill="#bfdbfe">10%</text>
    <text x="452" y="645" class="mono" font-size="10" fill="#bfdbfe">6 hours</text>
    <text x="632" y="645" class="cap" font-size="10" fill="#93c5fd" font-weight="700">TICKET</text>
  </g>

  <!-- ============ CALLOUT ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="670" width="728" height="42" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="390" y="690" text-anchor="middle" class="hd">"Anomalous" is not "bad" — and a 99.9%-accurate detector over 14M daily checks is a spam cannon</text>
    <text x="390" y="705" text-anchor="middle" class="cap" fill="#5b21b6" font-size="10">page on burn rate · ticket on baselines · dashboard the ML · and keep a watchdog whose SILENCE is the alert</text>
  </g>
</svg>
