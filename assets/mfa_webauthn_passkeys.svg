<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 670" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="mfbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="mfG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6ee7b7"/></marker>
    <marker id="mfB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#93c5fd"/></marker>
    <marker id="mfV" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#c4b5fd"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .cap{fill:#e2e8f0;font-size:11px}
      .lbl{fill:#f8fafc;font-size:12px;font-weight:700}
      .node{fill:#0b1220;stroke-width:2}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="760" height="670" rx="16" fill="url(#mfbg)"/>
  <text x="30" y="38" class="t">MFA, Passwordless &amp; WebAuthn / Passkeys</text>
  <text x="30" y="58" class="sub">not all second factors are equal — only origin-bound public-key credentials are actually phishing-resistant</text>

  <!-- ============ PANEL A: FACTOR LADDER ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="72" width="708" height="180" rx="10" fill="#0b1220" stroke="#2563eb" stroke-width="2.5"/>
    <text x="44" y="94" class="hd" fill="#93c5fd">A. THE FACTOR LADDER — bar length = resistance to phishing / relay attacks</text>
    <text x="44" y="109" class="cap" font-size="10">every factor above stops password reuse and credential stuffing; only the last one stops a real-time proxy</text>

    <text x="44" y="132" class="cap" font-size="10">SMS / email OTP</text>
    <rect x="250" y="118" width="60" height="20" rx="5" fill="#3a0f12" stroke="#dc2626" stroke-width="2"/>
    <text x="320" y="132" class="cap" font-size="9" fill="#fca5a5">SIM swap · SS7 · relay · NIST deprecated</text>

    <text x="44" y="158" class="cap" font-size="10">TOTP app (6 digits/30 s)</text>
    <rect x="250" y="144" width="130" height="20" rx="5" fill="#3a2a0a" stroke="#d97706" stroke-width="2"/>
    <text x="390" y="158" class="cap" font-size="9" fill="#fbbf24">shared secret · user can type it into a fake site</text>

    <text x="44" y="184" class="cap" font-size="10">Push approval (tap Yes)</text>
    <rect x="250" y="170" width="150" height="20" rx="5" fill="#3a2a0a" stroke="#d97706" stroke-width="2"/>
    <text x="410" y="184" class="cap" font-size="9" fill="#fbbf24">MFA-fatigue bombing → user taps to make it stop</text>

    <text x="44" y="210" class="cap" font-size="10">Push + number matching</text>
    <rect x="250" y="196" width="230" height="20" rx="5" fill="#0b2545" stroke="#2563eb" stroke-width="2"/>
    <text x="490" y="210" class="cap" font-size="9" fill="#93c5fd">forces intent + shows context, still relayable</text>

    <text x="44" y="236" class="lbl" font-size="10" fill="#6ee7b7">WebAuthn passkey / security key</text>
    <rect x="250" y="222" width="380" height="20" rx="5" fill="#052e1a" stroke="#16a34a" stroke-width="2.5"/>
    <text x="640" y="236" class="cap" font-size="9" fill="#6ee7b7">origin-bound</text>
  </g>

  <!-- ============ PANEL B: WEBAUTHN CEREMONIES ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="264" width="708" height="206" rx="10" fill="#0b1220" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="44" y="286" class="hd" fill="#c4b5fd">B. THE TWO WEBAUTHN CEREMONIES — a challenge, signed by a key that never leaves the device</text>

    <text x="44" y="302" class="cap" font-size="10" fill="#c4b5fd" font-weight="700">① REGISTRATION (once per device)</text>
    <rect x="44" y="308" width="156" height="52" rx="7" class="node" stroke="#2563eb"/>
    <text x="122" y="326" text-anchor="middle" class="cap" font-size="10" font-weight="700">Relying Party</text>
    <text x="122" y="339" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">random challenge</text>
    <text x="122" y="351" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">+ rp.id = example.com</text>

    <rect x="216" y="308" width="156" height="52" rx="7" class="node" stroke="#334155"/>
    <text x="294" y="326" text-anchor="middle" class="cap" font-size="10" font-weight="700">Browser</text>
    <text x="294" y="339" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">credentials.create()</text>
    <text x="294" y="351" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">checks page origin = rp.id</text>

    <rect x="388" y="308" width="156" height="52" rx="7" class="node" stroke="#7c3aed"/>
    <text x="466" y="326" text-anchor="middle" class="cap" fill="#c4b5fd" font-size="10" font-weight="700">Authenticator</text>
    <text x="466" y="339" text-anchor="middle" class="cap" font-size="9">new key pair per site</text>
    <text x="466" y="351" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">private key → secure element</text>

    <rect x="560" y="308" width="156" height="52" rx="7" class="node" stroke="#16a34a"/>
    <text x="638" y="326" text-anchor="middle" class="cap" fill="#6ee7b7" font-size="10" font-weight="700">RP stores</text>
    <text x="638" y="339" text-anchor="middle" class="cap" font-size="9">public key + credential id</text>
    <text x="638" y="351" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">no shared secret exists</text>

    <line x1="200" y1="334" x2="214" y2="334" stroke="#93c5fd" stroke-width="1.8" marker-end="url(#mfB)"/>
    <line x1="372" y1="334" x2="386" y2="334" stroke="#c4b5fd" stroke-width="1.8" marker-end="url(#mfV)"/>
    <line x1="544" y1="334" x2="558" y2="334" stroke="#6ee7b7" stroke-width="1.8" marker-end="url(#mfG)"/>

    <text x="44" y="378" class="cap" font-size="10" fill="#c4b5fd" font-weight="700">② AUTHENTICATION (every login)</text>
    <rect x="44" y="384" width="156" height="56" rx="7" class="node" stroke="#2563eb"/>
    <text x="122" y="402" text-anchor="middle" class="cap" font-size="10" font-weight="700">RP</text>
    <text x="122" y="415" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">fresh random challenge</text>
    <text x="122" y="428" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">(anti-replay)</text>

    <rect x="216" y="384" width="156" height="56" rx="7" class="node" stroke="#334155"/>
    <text x="294" y="402" text-anchor="middle" class="cap" font-size="10" font-weight="700">Browser</text>
    <text x="294" y="415" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">builds clientDataJSON</text>
    <text x="294" y="428" text-anchor="middle" class="cap" font-size="9" fill="#fbbf24">including the REAL origin</text>

    <rect x="388" y="384" width="156" height="56" rx="7" class="node" stroke="#7c3aed"/>
    <text x="466" y="402" text-anchor="middle" class="cap" fill="#c4b5fd" font-size="10" font-weight="700">Authenticator</text>
    <text x="466" y="415" text-anchor="middle" class="cap" font-size="9">user verification: bio/PIN</text>
    <text x="466" y="428" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">sign(challenge‖origin‖rpIdHash)</text>

    <rect x="560" y="384" width="156" height="56" rx="7" class="node" stroke="#16a34a"/>
    <text x="638" y="402" text-anchor="middle" class="cap" fill="#6ee7b7" font-size="10" font-weight="700">RP verifies</text>
    <text x="638" y="415" text-anchor="middle" class="cap" font-size="9">signature + origin match</text>
    <text x="638" y="428" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">+ challenge + sign counter</text>

    <line x1="200" y1="412" x2="214" y2="412" stroke="#93c5fd" stroke-width="1.8" marker-end="url(#mfB)"/>
    <line x1="372" y1="412" x2="386" y2="412" stroke="#c4b5fd" stroke-width="1.8" marker-end="url(#mfV)"/>
    <line x1="544" y1="412" x2="558" y2="412" stroke="#6ee7b7" stroke-width="1.8" marker-end="url(#mfG)"/>

    <text x="380" y="458" text-anchor="middle" class="cap" font-size="10" fill="#fbbf24">the private key never leaves the authenticator, and the signature covers the ORIGIN — that is the whole phishing-resistance story</text>
  </g>

  <!-- ============ PANEL C: AiTM PROXY ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="482" width="708" height="110" rx="10" fill="#0b1220" stroke="#d97706" stroke-width="2.5"/>
    <text x="44" y="504" class="hd" fill="#fbbf24">C. THE REAL TEST — an adversary-in-the-middle proxy on evil.com</text>

    <rect x="44" y="516" width="330" height="64" rx="8" fill="#3a0f12" stroke="#dc2626" stroke-width="2.5"/>
    <text x="209" y="534" text-anchor="middle" class="lbl" fill="#fca5a5" font-size="11">TOTP / push / SMS  →  DEFEATED</text>
    <text x="209" y="550" text-anchor="middle" class="cap" font-size="10">the user types the 6 digits (or taps approve) at evil.com</text>
    <text x="209" y="564" text-anchor="middle" class="cap" font-size="10">the proxy relays it to the real IdP and steals the session</text>
    <text x="209" y="576" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">a human cannot tell a pixel-perfect proxy from the real site</text>

    <rect x="396" y="516" width="320" height="64" rx="8" fill="#052e1a" stroke="#16a34a" stroke-width="2.5"/>
    <text x="556" y="534" text-anchor="middle" class="lbl" fill="#6ee7b7" font-size="11">PASSKEY  →  BLOCKED</text>
    <text x="556" y="550" text-anchor="middle" class="cap" font-size="10">the browser puts origin = evil.com in the signed data</text>
    <text x="556" y="564" text-anchor="middle" class="cap" font-size="10">that ≠ rp.id, and no key for evil.com exists</text>
    <text x="556" y="576" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">there is nothing for the proxy to relay</text>
  </g>

  <!-- ============ CALLOUT ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="604" width="708" height="50" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="380" y="627" text-anchor="middle" class="hd">"MFA" is not one control — a shared secret can be phished, a signature bound to an origin cannot</text>
    <text x="380" y="645" text-anchor="middle" class="cap" fill="#5b21b6" font-size="10">any 2nd factor ≫ password alone · number matching fixes push fatigue · passkeys remove the phishable secret entirely</text>
  </g>
</svg>
