<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 700" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="lsbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="lsG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6ee7b7"/></marker>
    <marker id="lsB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#93c5fd"/></marker>
    <marker id="lsR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#fca5a5"/></marker>
    <marker id="lsA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#fbbf24"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .cap{fill:#e2e8f0;font-size:11px}
      .lbl{fill:#f8fafc;font-size:12px;font-weight:700}
      .mono{font-family:'Consolas','Courier New',monospace;font-size:10px;fill:#e2e8f0}
      .node{fill:#0b1220;stroke-width:2}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="780" height="700" rx="16" fill="url(#lsbg)"/>
  <text x="30" y="38" class="t">Structured Logging &amp; Sampling Strategies</text>
  <text x="30" y="58" class="sub">structure makes logs queryable · sampling makes them affordable · the sample rate makes them honest</text>

  <!-- ============ PANEL A: UNSTRUCTURED vs STRUCTURED ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="72" width="728" height="136" rx="10" fill="#0b1220" stroke="#2563eb" stroke-width="2.5"/>
    <text x="44" y="94" class="hd" fill="#93c5fd">A. A SENTENCE vs AN EVENT — what makes a log queryable</text>

    <rect x="44" y="104" width="330" height="86" rx="8" fill="#3a0f12" stroke="#dc2626" stroke-width="2"/>
    <text x="56" y="122" class="cap" fill="#fca5a5" font-size="11" font-weight="700">✗ unstructured</text>
    <text x="56" y="140" class="mono" fill="#fecaca">Failed to process order 12345</text>
    <text x="56" y="153" class="mono" fill="#fecaca">after 3 retries (took 431ms)</text>
    <text x="56" y="172" class="cap" font-size="9" fill="#fca5a5">needs a regex · breaks when reworded</text>
    <text x="56" y="183" class="cap" font-size="9" fill="#fca5a5">cannot group, aggregate, or alert on a field</text>

    <rect x="396" y="104" width="358" height="86" rx="8" fill="#052e1a" stroke="#16a34a" stroke-width="2"/>
    <text x="408" y="122" class="cap" fill="#6ee7b7" font-size="11" font-weight="700">✓ structured event</text>
    <text x="408" y="140" class="mono" fill="#bbf7d0">{"level":"ERROR","msg":"order failed",</text>
    <text x="408" y="153" class="mono" fill="#bbf7d0"> "order_id":12345,"retries":3,"duration_ms":431,</text>
    <text x="408" y="166" class="mono" fill="#fde68a"> "trace_id":"4bf92f...","sample_rate":1}</text>
    <text x="408" y="183" class="cap" font-size="9" fill="#6ee7b7">trace_id = the JOIN KEY to traces + metric exemplars · high-cardinality IDs belong HERE, not in labels</text>
  </g>

  <!-- ============ PANEL B: HEAD vs TAIL SAMPLING ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="220" width="728" height="256" rx="10" fill="#0b1220" stroke="#d97706" stroke-width="2.5"/>
    <text x="44" y="242" class="hd" fill="#fbbf24">B. WHERE THE DECISION IS MADE — head (at the door) vs tail (at discharge)</text>

    <!-- HEAD -->
    <text x="44" y="264" class="cap" font-size="11" font-weight="700" fill="#fbbf24">HEAD · decided at the root, before any work — cheap, consistent, BLIND to the outcome</text>
    <rect x="44" y="272" width="150" height="46" rx="7" class="node" stroke="#7c3aed"/>
    <text x="119" y="290" text-anchor="middle" class="cap" font-size="10" font-weight="700">Root service</text>
    <text x="119" y="303" text-anchor="middle" class="mono" font-size="9">hash(trace_id) &lt; rate?</text>
    <text x="119" y="314" text-anchor="middle" class="cap" font-size="8" fill="#94a3b8">hash, not random() → all agree</text>

    <rect x="222" y="264" width="146" height="28" rx="6" fill="#052e1a" stroke="#16a34a" stroke-width="1.8"/>
    <text x="295" y="282" text-anchor="middle" class="cap" font-size="10" fill="#6ee7b7">sampled=1 (1%) → keep all</text>
    <rect x="222" y="298" width="146" height="28" rx="6" fill="#3a0f12" stroke="#dc2626" stroke-width="1.8"/>
    <text x="295" y="316" text-anchor="middle" class="cap" font-size="10" fill="#fca5a5">sampled=0 (99%) → drop all</text>
    <line x1="196" y1="284" x2="218" y2="278" stroke="#6ee7b7" stroke-width="1.8" marker-end="url(#lsG)"/>
    <line x1="196" y1="302" x2="218" y2="310" stroke="#fca5a5" stroke-width="1.8" marker-end="url(#lsR)"/>

    <rect x="392" y="264" width="362" height="62" rx="7" fill="#3a0f12" stroke="#dc2626" stroke-width="2"/>
    <text x="573" y="282" text-anchor="middle" class="lbl" fill="#fca5a5" font-size="11">THE FLAW: the error happens in service C — too late</text>
    <text x="573" y="298" text-anchor="middle" class="cap" font-size="10" fill="#fca5a5">a 1% rate keeps 1% of your errors too · Dapper ran 1/1024</text>
    <text x="573" y="314" text-anchor="middle" class="cap" font-size="9" fill="#fecaca">50 errors/day × 1% ⇒ you capture one every two days</text>

    <line x1="44" y1="336" x2="754" y2="336" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- TAIL -->
    <text x="44" y="356" class="cap" font-size="11" font-weight="700" fill="#6ee7b7">TAIL · decided after the trace completes — outcome-aware, needs routing + memory</text>
    <rect x="44" y="366" width="140" height="46" rx="7" class="node" stroke="#334155"/>
    <text x="114" y="384" text-anchor="middle" class="cap" font-size="10" font-weight="700">all spans</text>
    <text x="114" y="398" text-anchor="middle" class="cap" font-size="9" fill="#94a3b8">from every service</text>

    <rect x="206" y="366" width="164" height="46" rx="7" fill="#0c2b3f" stroke="#2563eb" stroke-width="2"/>
    <text x="288" y="382" text-anchor="middle" class="cap" font-size="10" font-weight="700" fill="#93c5fd">route by trace_id</text>
    <text x="288" y="395" text-anchor="middle" class="mono" font-size="9" fill="#bfdbfe">loadbalancing exporter</text>
    <text x="288" y="407" text-anchor="middle" class="cap" font-size="8" fill="#93c5fd">whole trace → ONE collector</text>

    <rect x="392" y="366" width="150" height="46" rx="7" fill="#0c2b3f" stroke="#2563eb" stroke-width="2"/>
    <text x="467" y="382" text-anchor="middle" class="cap" font-size="10" font-weight="700" fill="#93c5fd">buffer + decide</text>
    <text x="467" y="395" text-anchor="middle" class="mono" font-size="9" fill="#bfdbfe">decision_wait 10s</text>
    <text x="467" y="407" text-anchor="middle" class="cap" font-size="8" fill="#93c5fd">≈2.5 GB RAM @ 50k tr/s</text>

    <rect x="564" y="358" width="190" height="28" rx="6" fill="#052e1a" stroke="#16a34a" stroke-width="2"/>
    <text x="659" y="376" text-anchor="middle" class="cap" font-size="10" fill="#6ee7b7">error / slow / rare route → 100%</text>
    <rect x="564" y="392" width="190" height="28" rx="6" fill="#3a2a0a" stroke="#d97706" stroke-width="2"/>
    <text x="659" y="410" text-anchor="middle" class="cap" font-size="10" fill="#fbbf24">fast &amp; successful → 1%</text>

    <line x1="186" y1="389" x2="202" y2="389" stroke="#93c5fd" stroke-width="1.8" marker-end="url(#lsB)"/>
    <line x1="372" y1="389" x2="388" y2="389" stroke="#93c5fd" stroke-width="1.8" marker-end="url(#lsB)"/>
    <line x1="544" y1="384" x2="560" y2="374" stroke="#6ee7b7" stroke-width="1.8" marker-end="url(#lsG)"/>
    <line x1="544" y1="394" x2="560" y2="404" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#lsA)"/>

    <rect x="44" y="428" width="710" height="34" rx="7" fill="#052e1a" stroke="#16a34a" stroke-width="2.5"/>
    <text x="399" y="445" text-anchor="middle" class="lbl" fill="#6ee7b7" font-size="11">With a 0.1% error rate, keeping 100% of errors costs 0.1% of traffic — same bill as blind 1%, ~100× the diagnostic value</text>
    <text x="399" y="458" text-anchor="middle" class="cap" font-size="9" fill="#6ee7b7">the catch: traces longer than decision_wait get judged on partial data — use head sampling for minute-long jobs</text>
  </g>

  <!-- ============ PANEL C: COST / CORRECTNESS LADDER ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="488" width="728" height="146" rx="10" fill="#0b1220" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="44" y="510" class="hd" fill="#c4b5fd">C. THE LADDER — 1M QPS × 1 KB/request = 86 TB/day ≈ $8,600/day just to ingest</text>

    <rect x="44" y="520" width="600" height="26" rx="5" fill="#3a0f12" stroke="#dc2626" stroke-width="2"/>
    <text x="56" y="537" class="cap" font-size="10" fill="#fca5a5">keep 100% — 86 TB/day · complete, unaffordable, and it melts under the 10× spike of an incident</text>
    <text x="660" y="537" class="cap" font-size="10" fill="#fca5a5" font-weight="700">$$$$$</text>

    <rect x="44" y="552" width="300" height="26" rx="5" fill="#3a2a0a" stroke="#d97706" stroke-width="2"/>
    <text x="56" y="569" class="cap" font-size="10" fill="#fbbf24">blind 1% head sample — cheap, but loses 99% of rare failures</text>
    <text x="660" y="569" class="cap" font-size="10" fill="#fbbf24" font-weight="700">$</text>

    <rect x="44" y="584" width="330" height="26" rx="5" fill="#052e1a" stroke="#16a34a" stroke-width="2"/>
    <text x="56" y="601" class="cap" font-size="10" fill="#6ee7b7">100% errors + 100% slow + 1% baseline ≈ 1.1% retained</text>
    <text x="660" y="601" class="cap" font-size="10" fill="#6ee7b7" font-weight="700">$ (best value)</text>

    <text x="44" y="626" class="cap" font-size="10" fill="#c4b5fd">then tier what survives: 7 d hot index (~$1/GB·mo) → 30 d warm → 13 mo in S3 at $0.023/GB·mo</text>
  </g>

  <!-- ============ CALLOUT ============ -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.5s" fill="freeze"/>
    <rect x="26" y="644" width="728" height="42" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="390" y="664" text-anchor="middle" class="hd">Write sample_rate into every retained event — then aggregate with SUM(1/p), never COUNT(*)</text>
    <text x="390" y="679" text-anchor="middle" class="cap" fill="#5b21b6" font-size="10">sampled data without its sampling probability isn't cheaper telemetry — it's an anecdote with a dashboard around it</text>
  </g>
</svg>
