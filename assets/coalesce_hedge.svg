<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="chbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="char" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .cap{fill:#e2e8f0;font-size:11px}
      .lbl{fill:#f8fafc;font-size:11px;font-weight:700}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="760" height="560" rx="16" fill="url(#chbg)"/>
  <text x="30" y="40" class="t">Two ways to spend a little work to cut tail latency</text>
  <text x="30" y="62" class="sub">coalescing REMOVES duplicate work on the miss path · hedging ADDS duplicate work to beat a slow tail</text>

  <!-- COALESCING -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="30" y="80" width="700" height="190" rx="10" fill="#0b1220" stroke="#16a34a" stroke-width="2"/>
    <text x="48" y="104" class="hd" fill="#6ee7b7">① REQUEST COALESCING / SINGLE-FLIGHT — collapse N concurrent misses into ONE origin call</text>
    <text x="48" y="124" class="cap">the problem: a hot key expires → 10,000 requests all miss at once → all 10,000 hit the DB (stampede/dogpile)</text>

    <!-- before -->
    <text x="60" y="150" class="lbl" fill="#fca5a5">WITHOUT</text>
    <line x1="120" y1="146" x2="220" y2="146" stroke="#fca5a5" marker-end="url(#char)"/>
    <line x1="120" y1="162" x2="220" y2="162" stroke="#fca5a5" marker-end="url(#char)"/>
    <line x1="120" y1="178" x2="220" y2="178" stroke="#fca5a5" marker-end="url(#char)"/>
    <text x="150" y="196" class="cap" font-size="10">N misses</text>
    <rect x="225" y="140" width="90" height="44" rx="6" fill="#7f1d1d" stroke="#dc2626"/><text x="270" y="166" text-anchor="middle" class="cap">DB × N 💥</text>

    <!-- after -->
    <text x="380" y="150" class="lbl" fill="#6ee7b7">WITH</text>
    <line x1="430" y1="146" x2="520" y2="158" stroke="#94a3b8" marker-end="url(#char)"/>
    <line x1="430" y1="162" x2="520" y2="160" stroke="#94a3b8" marker-end="url(#char)"/>
    <line x1="430" y1="178" x2="520" y2="164" stroke="#94a3b8" marker-end="url(#char)"/>
    <rect x="522" y="150" width="70" height="24" rx="6" fill="#065f46" stroke="#16a34a"/><text x="557" y="166" text-anchor="middle" class="cap" font-size="10">leader</text>
    <line x1="592" y1="162" x2="640" y2="162" stroke="#6ee7b7" marker-end="url(#char)"/>
    <rect x="642" y="150" width="70" height="24" rx="6" fill="#065f46" stroke="#16a34a"/><text x="677" y="166" text-anchor="middle" class="cap" font-size="10">DB × 1 ✓</text>
    <text x="430" y="196" class="cap" font-size="10">followers WAIT for the leader's result, then all get the same answer</text>
    <text x="48" y="222" class="cap" fill="#6ee7b7">Go singleflight · Java Caffeine per-key load lock · saves the ORIGIN from N× amplification</text>
    <text x="48" y="244" class="cap" font-size="10">pair with jittered TTL + stale-while-revalidate for the full stampede defense</text>
  </g>

  <!-- HEDGING -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.5s" fill="freeze"/>
    <rect x="30" y="284" width="700" height="196" rx="10" fill="#0b1220" stroke="#2563eb" stroke-width="2"/>
    <text x="48" y="308" class="hd" fill="#93c5fd">② HEDGED REQUESTS — fire a 2nd copy after a delay, take whichever returns first</text>
    <text x="48" y="328" class="cap">the problem: P99 is dominated by a few unlucky slow replicas (GC pause, busy disk); the median is fine</text>

    <!-- timeline -->
    <line x1="60" y1="392" x2="700" y2="392" stroke="#475569"/>
    <text x="60" y="356" class="lbl">t=0</text>
    <rect x="90" y="368" width="180" height="18" rx="4" fill="#1e3a8a" stroke="#2563eb"/><text x="180" y="381" text-anchor="middle" class="cap" font-size="10">try A (slow… GC pause)</text>
    <text x="290" y="360" class="cap" font-size="10" fill="#fbbf24">wait p95 (e.g. 10ms)</text>
    <line x1="290" y1="364" x2="290" y2="410" stroke="#fbbf24" stroke-dasharray="3 3"/>
    <rect x="290" y="392" width="70" height="18" rx="4" fill="#065f46" stroke="#16a34a"/><text x="325" y="405" text-anchor="middle" class="cap" font-size="10">try B ✓ fast</text>
    <text x="370" y="405" class="cap" font-size="10" fill="#6ee7b7">← take B's result, cancel A</text>
    <text x="48" y="440" class="cap" fill="#93c5fd">only hedge AFTER a delay (p95) → adds just ~5% extra load, collapses the P99 tail</text>
    <text x="48" y="462" class="cap" font-size="10">requires IDEMPOTENT reads · cancel the loser · Dean &amp; Barroso "The Tail at Scale"</text>
  </g>

  <!-- rule -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.5s" fill="freeze"/>
    <rect x="30" y="494" width="700" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="380" y="515" text-anchor="middle" class="hd">Coalesce to protect the ORIGIN from load · Hedge to protect the USER from the tail</text>
    <text x="380" y="532" text-anchor="middle" class="cap" fill="#166534">both backfire if misapplied: don't hedge non-idempotent writes; don't coalesce independent requests</text>
  </g>
</svg>
