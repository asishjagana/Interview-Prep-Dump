<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="lsbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="lsar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="lsarR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#f87171"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#0f172a;font-size:13px;font-weight:800}
      .cap{fill:#e2e8f0;font-size:11px}
      .lbl{fill:#f8fafc;font-size:12px;font-weight:700}
      .panelhd{font-size:14px;font-weight:800}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="760" height="560" rx="16" fill="url(#lsbg)"/>
  <text x="30" y="40" class="t">Load shedding: a brownout, not a blackout</text>
  <text x="30" y="62" class="sub">under overload you cannot serve everyone — reject some at the door so the rest stay healthy</text>

  <!-- LEFT PANEL: WITHOUT SHEDDING -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="30" y="82" width="345" height="378" rx="10" fill="#0b1220" stroke="#dc2626" stroke-width="2"/>
    <text x="202" y="106" text-anchor="middle" class="panelhd" fill="#fca5a5">WITHOUT SHEDDING</text>

    <!-- flood of requests, all admitted -->
    <text x="48" y="132" class="cap" fill="#94a3b8">every request admitted — no gate</text>
    <rect x="48" y="142" width="70" height="20" rx="4" fill="#334155" stroke="#64748b"/><text x="83" y="156" text-anchor="middle" class="cap">checkout</text>
    <rect x="126" y="142" width="70" height="20" rx="4" fill="#334155" stroke="#64748b"/><text x="161" y="156" text-anchor="middle" class="cap">login</text>
    <rect x="204" y="142" width="70" height="20" rx="4" fill="#334155" stroke="#64748b"/><text x="239" y="156" text-anchor="middle" class="cap">analytics</text>
    <rect x="282" y="142" width="78" height="20" rx="4" fill="#334155" stroke="#64748b"/><text x="321" y="156" text-anchor="middle" class="cap">recommend</text>
    <rect x="48" y="168" width="70" height="20" rx="4" fill="#334155" stroke="#64748b"/><text x="83" y="182" text-anchor="middle" class="cap">browse</text>
    <rect x="126" y="168" width="70" height="20" rx="4" fill="#334155" stroke="#64748b"/><text x="161" y="182" text-anchor="middle" class="cap">prefetch</text>
    <rect x="204" y="168" width="70" height="20" rx="4" fill="#334155" stroke="#64748b"/><text x="239" y="182" text-anchor="middle" class="cap">search</text>
    <rect x="282" y="168" width="78" height="20" rx="4" fill="#334155" stroke="#64748b"/><text x="321" y="182" text-anchor="middle" class="cap">upload</text>

    <line x1="202" y1="196" x2="202" y2="224" stroke="#f87171" stroke-width="2" marker-end="url(#lsarR)"/>

    <!-- overloaded backend -->
    <rect x="86" y="228" width="232" height="86" rx="10" fill="#450a0a" stroke="#dc2626" stroke-width="2.5"/>
    <text x="202" y="252" text-anchor="middle" class="lbl" fill="#fecaca">BACKEND</text>
    <text x="202" y="276" text-anchor="middle" class="cap" fill="#fca5a5" font-size="16" font-weight="800">100% CPU</text>
    <text x="202" y="298" text-anchor="middle" class="cap" fill="#fca5a5">queue → ∞ · everything times out</text>

    <line x1="202" y1="318" x2="202" y2="342" stroke="#f87171" stroke-width="2" marker-end="url(#lsarR)"/>

    <rect x="60" y="346" width="284" height="42" rx="8" fill="#1e1b1b" stroke="#dc2626" stroke-width="1.5"/>
    <text x="202" y="364" text-anchor="middle" class="cap" fill="#fca5a5" font-weight="800">TOTAL BLACKOUT</text>
    <text x="202" y="380" text-anchor="middle" class="cap" fill="#fca5a5">0% useful work — everyone gets a failure</text>

    <text x="202" y="414" text-anchor="middle" class="cap" fill="#94a3b8">100% busy · completes zero useful requests</text>
    <text x="202" y="432" text-anchor="middle" class="cap" fill="#94a3b8">health checks fail → LB kills nodes →</text>
    <text x="202" y="448" text-anchor="middle" class="cap" fill="#94a3b8">survivors get MORE load → death spiral</text>
  </g>

  <!-- RIGHT PANEL: WITH SHEDDING -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.5s" fill="freeze"/>
    <rect x="385" y="82" width="345" height="378" rx="10" fill="#0b1220" stroke="#16a34a" stroke-width="2.5"/>
    <text x="557" y="106" text-anchor="middle" class="panelhd" fill="#6ee7b7">WITH SHEDDING</text>

    <text x="403" y="132" class="cap" fill="#94a3b8">admission GATE at the edge — decides in µs</text>

    <!-- critical (green) admitted -->
    <rect x="403" y="142" width="72" height="20" rx="4" fill="#14532d" stroke="#16a34a"/><text x="439" y="156" text-anchor="middle" class="cap" fill="#bbf7d0">checkout</text>
    <rect x="481" y="142" width="60" height="20" rx="4" fill="#14532d" stroke="#16a34a"/><text x="511" y="156" text-anchor="middle" class="cap" fill="#bbf7d0">login</text>
    <!-- low priority (amber/red) rejected -->
    <rect x="549" y="142" width="76" height="20" rx="4" fill="#3f1d1d" stroke="#dc2626"/><text x="587" y="156" text-anchor="middle" class="cap" fill="#fca5a5">analytics</text>
    <rect x="631" y="142" width="80" height="20" rx="4" fill="#3a2a10" stroke="#d97706"/><text x="671" y="156" text-anchor="middle" class="cap" fill="#fbbf24">recommend</text>
  </g>

  <!-- gate + split -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.5s" fill="freeze"/>
    <rect x="470" y="180" width="174" height="30" rx="6" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/>
    <text x="557" y="200" text-anchor="middle" class="lbl" fill="#7dd3fc">ADMISSION GATE</text>

    <!-- critical passes down -->
    <line x1="500" y1="210" x2="500" y2="248" stroke="#22c55e" stroke-width="2.5" marker-end="url(#lsar)"/>
    <text x="470" y="234" class="cap" fill="#6ee7b7" font-size="10">critical ✓</text>
    <!-- low priority rejected fast (to the side) -->
    <line x1="614" y1="210" x2="660" y2="238" stroke="#f87171" stroke-width="2.5" marker-end="url(#lsarR)"/>
    <rect x="628" y="238" width="86" height="40" rx="8" fill="#3f1d1d" stroke="#dc2626" stroke-width="1.5"/>
    <text x="671" y="256" text-anchor="middle" class="cap" fill="#fca5a5" font-weight="800">429 / 503</text>
    <text x="671" y="270" text-anchor="middle" class="cap" fill="#fca5a5" font-size="9">rejected fast</text>
    <text x="671" y="292" text-anchor="middle" class="cap" fill="#94a3b8" font-size="9">no work done</text>
  </g>

  <!-- healthy backend -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.5s" fill="freeze"/>
    <rect x="418" y="248" width="182" height="82" rx="10" fill="#052e16" stroke="#16a34a" stroke-width="2.5"/>
    <text x="509" y="272" text-anchor="middle" class="lbl" fill="#bbf7d0">BACKEND</text>
    <text x="509" y="296" text-anchor="middle" class="cap" fill="#6ee7b7" font-size="15" font-weight="800">HEALTHY</text>
    <text x="509" y="316" text-anchor="middle" class="cap" fill="#6ee7b7">checkout ~200ms · stable</text>

    <rect x="418" y="346" width="294" height="42" rx="8" fill="#0f2417" stroke="#16a34a" stroke-width="1.5"/>
    <text x="565" y="364" text-anchor="middle" class="cap" fill="#6ee7b7" font-weight="800">SERVES THE IMPORTANT 80%</text>
    <text x="565" y="380" text-anchor="middle" class="cap" fill="#6ee7b7">a brownout, not a blackout</text>

    <text x="557" y="414" text-anchor="middle" class="cap" fill="#94a3b8">reject cheaply + first (before parse / auth / DB)</text>
    <text x="557" y="432" text-anchor="middle" class="cap" fill="#94a3b8">drop lowest tier first: BACKGROUND → NORMAL</text>
    <text x="557" y="448" text-anchor="middle" class="cap" fill="#94a3b8">CRITICAL always flows through</text>
  </g>

  <!-- bottom callout -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.5s" fill="freeze"/>
    <rect x="30" y="476" width="700" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="380" y="500" text-anchor="middle" class="hd">Overload collapses in SECONDS · autoscaling is ~60–120s away</text>
    <text x="380" y="522" text-anchor="middle" class="cap" fill="#166534">shedding is the instant demand-reducing lever — it buys the time until new capacity arrives</text>
  </g>
</svg>
