<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="dwbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="dar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker>
    <style>
      .t{fill:#f8fafc;font-size:20px;font-weight:700}
      .sub{fill:#94a3b8;font-size:12px}
      .hd{fill:#f8fafc;font-size:14px;font-weight:800}
      .nl{fill:#0f172a;font-size:11px;font-weight:700}
      .cap{fill:#cbd5e1;font-size:11px}
      .fade{opacity:0}
    </style>
  </defs>
  <rect width="760" height="500" rx="16" fill="url(#dwbg)"/>
  <text x="30" y="40" class="t">Data Warehouse vs Data Lake — ETL vs ELT</text>
  <text x="30" y="62" class="sub">OLTP apps run the business · OLAP warehouses &amp; lakes help you understand it</text>

  <!-- ETL flow (warehouse) -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <rect x="24" y="80" width="712" height="90" rx="10" fill="#0b1220" stroke="#2563eb" stroke-width="2"/>
    <text x="40" y="104" class="hd" fill="#93c5fd">WAREHOUSE — ETL (transform BEFORE load) · schema-on-write</text>
    <rect x="40" y="118" width="90" height="34" rx="6" fill="#94a3b8"/><text x="85" y="140" text-anchor="middle" class="nl">Extract</text>
    <rect x="170" y="118" width="110" height="34" rx="6" fill="#fbbf24"/><text x="225" y="140" text-anchor="middle" class="nl">Transform (clean)</text>
    <rect x="320" y="118" width="150" height="34" rx="6" fill="#60a5fa"/><text x="395" y="140" text-anchor="middle" class="nl">Load → structured tables</text>
    <line x1="130" y1="135" x2="170" y2="135" stroke="#64748b" marker-end="url(#dar)"/>
    <line x1="280" y1="135" x2="320" y2="135" stroke="#64748b" marker-end="url(#dar)"/>
    <text x="500" y="132" class="cap">Snowflake · Redshift · BigQuery</text>
    <text x="500" y="150" class="cap">clean, fast SQL for analysts/execs</text>
  </g>

  <!-- ELT flow (lake) -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.5s" fill="freeze"/>
    <rect x="24" y="182" width="712" height="90" rx="10" fill="#0b1220" stroke="#16a34a" stroke-width="2"/>
    <text x="40" y="206" class="hd" fill="#6ee7b7">LAKE — ELT (load raw, transform LATER) · schema-on-read</text>
    <rect x="40" y="220" width="90" height="34" rx="6" fill="#94a3b8"/><text x="85" y="242" text-anchor="middle" class="nl">Extract</text>
    <rect x="170" y="220" width="150" height="34" rx="6" fill="#34d399"/><text x="245" y="242" text-anchor="middle" class="nl">Load raw (S3 files)</text>
    <rect x="360" y="220" width="180" height="34" rx="6" fill="#fbbf24"/><text x="450" y="242" text-anchor="middle" class="nl">Transform on query</text>
    <line x1="130" y1="237" x2="170" y2="237" stroke="#64748b" marker-end="url(#dar)"/>
    <line x1="320" y1="237" x2="360" y2="237" stroke="#64748b" marker-end="url(#dar)"/>
    <text x="560" y="234" class="cap">S3+Athena · Databricks</text>
    <text x="560" y="252" class="cap">raw everything for data scientists/ML</text>
  </g>

  <!-- comparison table -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.6s" fill="freeze"/>
    <rect x="24" y="284" width="352" height="150" rx="10" fill="#e0f2fe" stroke="#2563eb" stroke-width="2"/>
    <text x="40" y="308" class="hd" fill="#0f172a">WAREHOUSE</text>
    <text x="40" y="330" class="nl" font-weight="400">structured tables, schema-on-write</text>
    <text x="40" y="350" class="nl" font-weight="400">✓ fast SQL, high quality, BI-ready</text>
    <text x="40" y="370" class="nl" font-weight="400">✓ non-technical users</text>
    <text x="40" y="390" class="nl" font-weight="400">✗ rigid schema, pricier storage</text>
    <text x="40" y="410" class="nl" font-weight="400">✗ ETL slow/fragile</text>
    <text x="40" y="428" class="nl" font-weight="400">use: known reports, dashboards</text>
  </g>
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.6s" fill="freeze"/>
    <rect x="384" y="284" width="352" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="400" y="308" class="hd" fill="#0f172a">LAKE</text>
    <text x="400" y="330" class="nl" font-weight="400">raw files (CSV/JSON/Parquet/video)</text>
    <text x="400" y="350" class="nl" font-weight="400">✓ dirt-cheap storage, holds everything</text>
    <text x="400" y="370" class="nl" font-weight="400">✓ flexible, infinite scale, ML fuel</text>
    <text x="400" y="390" class="nl" font-weight="400">✗ can become a "data swamp"</text>
    <text x="400" y="410" class="nl" font-weight="400">✗ needs code to query</text>
    <text x="400" y="428" class="nl" font-weight="400">use: raw logs, unknown future use</text>
  </g>

  <!-- lakehouse -->
  <g class="fade"><animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.6s" fill="freeze"/>
    <rect x="24" y="446" width="712" height="42" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="380" y="472" text-anchor="middle" class="hd" fill="#0f172a">LAKEHOUSE = warehouse structure ON lake storage (Databricks, Iceberg, Delta) — the modern convergence</text>
  </g>
</svg>
